class=\"kpi\">\n<div class=\"kpi-icon red\">✕</div>\n<div>\n<h3>CANCELADOS</h3>\n<div class=\"kpi-number\" id=\"kpiCancelados\">0</div>\n<p>Pedidos cancelados</p>\n</div>\n</div>\n</section>\n<!-- =========================================================\n     BOTONES\n========================================================= -->\n<section class=\"actions\">\n<button class=\"btn btn-green\" onclick=\"nuevoPedido()\">\n＋ Nuevo Pedido\n</button>\n<button class=\"btn btn-blue\" onclick=\"verPedidoSeleccionado()\">\n👁 Ver Detalle\n</button>\n<button class=\"btn btn-orange\" onclick=\"editarPedidoSeleccionado()\">\n✎ Editar Pedido\n</button>\n<button class=\"btn btn-red\" onclick=\"cancelarPedidoSeleccionado()\">\n🗑 Cancelar Pedido\n</button>\n<button class=\"btn btn-green\" onclick=\"exportarPedidos()\">\n↓ Exportar Excel\n</button>\n</section>\n<!-- =========================================================\n     FILTROS\n========================================================= -->\n<section class=\"filters\">\n<input class=\"control\" id=\"buscarPedido\" oninput=\"renderizarPedidos()\" placeholder=\"Buscar pedido...\"/>\n<select class=\"control\" id=\"filtroCliente\" onchange=\"renderizarPedidos()\">\n<option value=\"\">\nTodos los clientes\n</option>\n</select>\n<select class=\"control\" id=\"filtroEstado\" onchange=\"renderizarPedidos()\">\n<option value=\"\">\nTodos los estados\n</option>\n<option value=\"Pendiente\">\nPendiente\n</option>\n<option value=\"En proceso\">\nEn proceso\n</option>\n<option value=\"Enviado\">\nEnviado\n</option>\n<option value=\"Cancelado\">\nCancelado\n</option>\n</select>\n<input class=\"control\" id=\"fechaDesde\" onchange=\"renderizarPedidos()\" type=\"date\"/>\n<input class=\"control\" id=\"fechaHasta\" onchange=\"renderizarPedidos()\" type=\"date\"/>\n<button class=\"btn btn-blue\" onclick=\"renderizarPedidos()\">\n🔍 Buscar\n</button>\n</section>\n<!-- =========================================================\n     TABLA + DETALLE\n========================================================= -->\n<div class=\"grid\">\n<section class=\"panel\">\n<div class=\"panel-title\">\nLISTADO DE PEDIDOS\n</div>\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>ID PEDIDO</th>\n<th>CLIENTE</th>\n<th>FECHA</th>\n<th>TOTAL (Bs)</th>\n<th>ESTADO</th>\n<th>ENTREGA</th>\n<th>ACCIONES</th>\n</tr>\n</thead>\n<tbody id=\"tablaPedidos\"></tbody>\n</table>\n</div>\n</section>\n<aside class=\"panel\">\n<div class=\"panel-title\">\n📄 DETALLE DEL PEDIDO\n</div>\n<div class=\"detail\" id=\"detallePedido\">\n<p style=\"color:#64748b;font-size:13px;\">\nSelecciona un pedido para ver sus detalles.\n</p>\n</div>\n</aside>\n</div>\n</div>\n</main>\n<!-- =========================================================\n     MODAL NUEVO / EDITAR PEDIDO\n========================================================= -->\n<div class=\"modal\" id=\"modalPedido\">\n<div class=\"modal-box\">\n<div class=\"modal-header\">\n<h3 id=\"tituloModalPedido\">\nNUEVO PEDIDO\n</h3>\n<button class=\"modal-close\" onclick=\"cerrarModalPedido()\">\n×\n</button>\n</div>\n<form id=\"formPedido\" onsubmit=\"guardarPedido(event)\">\n<div class=\"modal-body\">\n<div class=\"form-layout\">\n<!-- DATOS PRINCIPALES -->\n<div>\n<div class=\"form-grid\">\n<div class=\"group\">\n<label>Cliente *</label>\n<input id=\"clientePedido\" placeholder=\"Nombre del cliente\" required=\"\"/>\n</div>\n<div class=\"group\">\n<label>Contacto</label>\n<input id=\"contactoPedido\" placeholder=\"Teléfono o contacto\"/>\n</div>\n<div class=\"group full\">\n<label>Dirección</label>\n<input id=\"direccionPedido\" placeholder=\"Dirección de entrega\"/>\n</div>\n<div class=\"group\">\n<label>Fecha Pedido *</label>\n<input id=\"fechaPedido\" required=\"\" type=\"date\"/>\n</div>\n<div class=\"group\">\n<label>Fecha Entrega *</label>\n<input id=\"fechaEntrega\" required=\"\" type=\"date\"/>\n</div>\n<div class=\"group\">\n<label>Estado *</label>\n<select id=\"estadoPedido\">\n<option value=\"Pendiente\">\nPendiente\n</option>\n<option value=\"En proceso\">\nEn proceso\n</option>\n<option value=\"Enviado\">\nEnviado\n</option>\n<option value=\"Cancelado\">\nCancelado\n</option>\n</select>\n</div>\n<div class=\"group\">\n<label>Método de Pago</label>\n<select id=\"metodoPago\">\n<option value=\"Efectivo\">\nEfectivo\n</option>\n<option value=\"QR\">\nQR\n</option>\n<option value=\"Transferencia\">\nTransferencia\n</option>\n<option value=\"Crédito\">\nCrédito\n</option>\n</select>\n</div>\n<div class=\"group\">\n<label>Descuento (%)</label>\n<input id=\"descuentoPedido\" max=\"100\" min=\"0\" oninput=\"calcularTotalPedido()\" type=\"number\" value=\"0\"/>\n</div>\n<div class=\"group full\">\n<label>Observaciones</label>\n<textarea id=\"observacionesPedido\" placeholder=\"Observaciones del pedido...\">\n</textarea>\n</div>\n</div>\n</div>\n<!-- PRODUCTOS -->\n<div class=\"product-box\">\n<h3 style=\"margin-bottom:12px;\">\nPRODUCTOS DEL PEDIDO\n</h3>\n<div id=\"contenedorProductos\"></div>\n<button class=\"btn btn-green\" onclick=\"agregarProducto()\" type=\"button\">\n\n＋ Agregar Producto\n\n</button>\n<div class=\"order-total\">\n\nTOTAL DEL PEDIDO:\n\n<span id=\"totalPedido\">\nBs 0,00\n</span>\n</div>\n</div>\n</div>\n</div>\n<div class=\"modal-footer\">\n<button class=\"btn btn-gray\" onclick=\"cerrarModalPedido()\" type=\"button\">\n\nCancelar\n\n</button>\n<button class=\"btn btn-blue\" type=\"submit\">\n\n💾 Guardar Pedido\n\n</button>\n</div>\n</form>\n</div>\n</div>\n<script>\n\n/* =========================================================\n   VARIABLES\n========================================================= */\n\nlet pedidoSeleccionadoId = null;\nlet pedidoEditandoId = null;\n\n\n/* =========================================================\n   OBTENER PEDIDOS\n========================================================= */\n\nfunction obtenerPedidos(){\n\n    try{\n\n        return JSON.parse(\n            localStorage.getItem(\"pedidos\")\n        ) || [];\n\n    }catch(error){\n\n        return [];\n\n    }\n\n}\n\n\n/* =========================================================\n   GUARDAR ARRAY\n========================================================= */\n\nfunction guardarPedidosStorage(pedidos){\n\n    localStorage.setItem(\n        \"pedidos\",\n        JSON.stringify(pedidos)\n    );\n\n}\n\n\n/* =========================================================\n   GENERAR ID\n========================================================= */\n\nfunction generarIdPedido(){\n\n    const pedidos = obtenerPedidos();\n\n    let mayor = 0;\n\n    pedidos.forEach(function(p){\n\n        const numero =\n            Number(\n                String(p.id)\n                .replace(\"PED-\",\"\")\n            );\n\n        if(numero > mayor){\n            mayor = numero;\n        }\n\n    });\n\n    return \"PED-\" +\n        String(mayor + 1)\n        .padStart(5,\"0\");\n\n}\n\n\n/* =========================================================\n   FECHA ACTUAL\n========================================================= */\n\nfunction hoyISO(){\n\n    const hoy = new Date();\n\n    const anio = hoy.getFullYear();\n\n    const mes =\n        String(hoy.getMonth()+1)\n        .padStart(2,\"0\");\n\n    const dia =\n        String(hoy.getDate())\n        .padStart(2,\"0\");\n\n    return `${anio}-${mes}-${dia}`;\n\n}\n\n\n/* =========================================================\n   FORMATEAR FECHA\n========================================================= */\n\nfunction formatearFecha(fecha){\n\n    if(!fecha){\n        return \"-\";\n    }\n\n    const p = fecha.split(\"-\");\n\n    if(p.length !== 3){\n        return fecha;\n    }\n\n    return `${p[2]}/${p[1]}/${p[0]}`;\n\n}\n\n\n/* =========================================================\n   MONEDA\n========================================================= */\n\nfunction moneda(numero){\n\n    return Number(numero || 0)\n        .toLocaleString(\n            \"es-BO\",\n            {\n                minimumFractionDigits:2,\n                maximumFractionDigits:2\n            }\n        );\n\n}\n\n\n/* =========================================================\n   CLASE ESTADO\n========================================================= */\n\nfunction claseEstado(estado){\n\n    if(estado === \"Pendiente\"){\n        return \"status-pendiente\";\n    }\n\n    if(estado === \"En proceso\"){\n        return \"status-proceso\";\n    }\n\n    if(estado === \"Enviado\"){\n        return \"status-enviado\";\n    }\n\n    return \"status-cancelado\";\n\n}\n\n\n/* =========================================================\n   NUEVO PEDIDO\n========================================================= */\n\nfunction nuevoPedido(){\n\n    pedidoEditandoId = null;\n\n    document\n        .getElementById(\"tituloModalPedido\")\n        .innerText =\n        \"NUEVO PEDIDO\";\n\n    document\n        .getElementById(\"formPedido\")\n        .reset();\n\n    document\n        .getElementById(\"fechaPedido\")\n        .value =\n        hoyISO();\n\n    document\n        .getElementById(\"estadoPedido\")\n        .value =\n        \"Pendiente\";\n\n    document\n        .getElementById(\"descuentoPedido\")\n        .value =\n        0;\n\n    document\n        .getElementById(\"contenedorProductos\")\n        .innerHTML =\n        \"\";\n\n    agregarProducto();\n\n    calcularTotalPedido();\n\n    document\n        .getElementById(\"modalPedido\")\n        .classList.add(\"show\");\n\n}\n\n\n/* =========================================================\n   CERRAR MODAL\n========================================================= */\n\nfunction cerrarModalPedido(){\n\n    document\n        .getElementById(\"modalPedido\")\n        .classList.remove(\"show\");\n\n}\n\n\n/* =========================================================\n   AGREGAR PRODUCTO\n========================================================= */\n\nfunction agregarProducto(datos = null){\n\n    const contenedor =\n        document.getElementById(\n            \"contenedorProductos\"\n        );\n\n    const fila =\n        document.createElement(\"div\");\n\n    fila.className =\n        \"product-row\";\n\n    fila.innerHTML = `\n\n        <input\n            class=\"prod-nombre\"\n            placeholder=\"Producto\"\n            value=\"${datos ? datos.nombre : \"\"}\"\n            required\n        >\n\n        <input\n            class=\"prod-cantidad\"\n            type=\"number\"\n            min=\"1\"\n            value=\"${datos ? datos.cantidad : 1}\"\n            oninput=\"calcularTotalPedido()\"\n            required\n        >\n\n        <input\n            class=\"prod-precio\"\n            type=\"number\"\n            min=\"0\"\n            step=\"0.01\"\n            value=\"${datos ? datos.precio : \"\"}\"\n            placeholder=\"Precio\"\n            oninput=\"calcularTotalPedido()\"\n            required\n        >\n\n        <input\n            class=\"prod-subtotal\"\n            readonly\n            value=\"0.00\"\n        >\n\n        <button\n            type=\"button\"\n            class=\"remove-product\"\n            onclick=\"eliminarProductoFila(this)\"\n        >\n            🗑\n        </button>\n\n    `;\n\n    contenedor.appendChild(fila);\n\n    calcularTotalPedido();\n\n}\n\n\n/* =========================================================\n   ELIMINAR PRODUCTO\n========================================================= */\n\nfunction eliminarProductoFila(boton){\n\n    const filas =\n        document.querySelectorAll(\n            \"#contenedorProductos .product-row\"\n        );\n\n    if(filas.length <= 1){\n\n        alert(\n            \"El pedido debe tener al menos un producto.\"\n        );\n\n        return;\n    }\n\n    boton\n        .closest(\".product-row\")\n        .remove();\n\n    calcularTotalPedido();\n\n}\n\n\n/* =========================================================\n   CALCULAR TOTAL\n========================================================= */\n\nfunction calcularTotalPedido(){\n\n    const filas =\n        document.querySelectorAll(\n            \"#contenedorProductos .product-row\"\n        );\n\n    let subtotalGeneral = 0;\n\n    filas.forEach(function(fila){\n\n        const cantidad =\n            Number(\n                fila.querySelector(\n                    \".prod-cantidad\"\n                ).value\n            ) || 0;\n\n        const precio =\n            Number(\n                fila.querySelector(\n                    \".prod-precio\"\n                ).value\n            ) || 0;\n\n        const subtotal =\n            cantidad * precio;\n\n        fila.querySelector(\n            \".prod-subtotal\"\n        ).value =\n            subtotal.toFixed(2);\n\n        subtotalGeneral += subtotal;\n\n    });\n\n    const descuento =\n        Number(\n            document\n                .getElementById(\n                    \"descuentoPedido\"\n                )\n                .value\n        ) || 0;\n\n    const total =\n        subtotalGeneral -\n        (\n            subtotalGeneral *\n            descuento / 100\n        );\n\n    document\n        .getElementById(\n            \"totalPedido\"\n        )\n        .innerText =\n        \"Bs \" + moneda(total);\n\n    return {\n        subtotal:subtotalGeneral,\n        descuento:descuento,\n        total:total\n    };\n\n}\n\n\n/* =========================================================\n   OBTENER PRODUCTOS DEL FORMULARIO\n========================================================= */\n\nfunction obtenerProductosFormulario(){\n\n    const filas =\n        document.querySelectorAll(\n            \"#contenedorProductos .product-row\"\n        );\n\n    const productos = [];\n\n    filas.forEach(function(fila){\n\n        const nombre =\n            fila.querySelector(\n                \".prod-nombre\"\n            ).value.trim();\n\n        const cantidad =\n            Number(\n                fila.querySelector(\n                    \".prod-cantidad\"\n                ).value\n            );\n\n        const precio =\n            Number(\n                fila.querySelector(\n                    \".prod-precio\"\n                ).value\n            );\n\n        productos.push({\n\n            nombre:nombre,\n\n            cantidad:cantidad,\n\n            precio:precio,\n\n            subtotal:\n                cantidad * precio\n\n        });\n\n    });\n\n    return productos;\n\n}\n\n\n/* =========================================================\n   GUARDAR PEDIDO\n========================================================= */\n\nfunction guardarPedido(event){\n\n    event.preventDefault();\n\n    const cliente =\n        document\n            .getElementById(\n                \"clientePedido\"\n            )\n            .value\n            .trim();\n\n    const fechaPedido =\n        document\n            .getElementById(\n                \"fechaPedido\"\n            )\n            .value;\n\n    const fechaEntrega =\n        document\n            .getElementById(\n                \"fechaEntrega\"\n            )\n            .value;\n\n    const productos =\n        obtenerProductosFormulario();\n\n    if(productos.length === 0){\n\n        alert(\n            \"Debe agregar al menos un producto.\"\n        );\n\n        return;\n    }\n\n    const calculo =\n        calcularTotalPedido();\n\n    let pedidos =\n        obtenerPedidos();\n\n\n    const pedido = {\n\n        id:\n            pedidoEditandoId ||\n            generarIdPedido(),\n\n        cliente:cliente,\n\n        contacto:\n            document\n                .getElementById(\n                    \"contactoPedido\"\n                )\n                .value,\n\n        direccion:\n            document\n                .getElementById(\n                    \"direccionPedido\"\n                )\n                .value,\n\n        fecha:\n            fechaPedido,\n\n        entrega:\n            fechaEntrega,\n\n        estado:\n            document\n                .getElementById(\n                    \"estadoPedido\"\n                )\n                .value,\n\n        metodoPago:\n            document\n                .getElementById(\n                    \"metodoPago\"\n                )\n                .value,\n\n        descuento:\n            calculo.descuento,\n\n        observaciones:\n            document\n                .getElementById(\n                    \"observacionesPedido\"\n                )\n                .value,\n\n        productos:productos,\n\n        subtotal:\n            calculo.subtotal,\n\n        total:\n            calculo.total\n\n    };\n\n\n    if(pedidoEditandoId){\n\n        const indice =\n            pedidos.findIndex(\n                p =>\n                p.id === pedidoEditandoId\n            );\n\n        if(indice !== -1){\n\n            pedidos[indice] =\n                pedido;\n\n        }\n\n    }else{\n\n        pedidos.push(\n            pedido\n        );\n\n    }\n\n\n    guardarPedidosStorage(\n        pedidos\n    );\n\n    cerrarModalPedido();\n\n    pedidoSeleccionadoId =\n        pedido.id;\n\n    pedidoEditandoId =\n        null;\n\n    actualizarTodo();\n\n    mostrarDetallePedido(\n        pedido.id\n    );\n\n    alert(\n        \"Pedido guardado correctamente.\"\n    );\n\n}\n\n\n/* =========================================================\n   RENDERIZAR PEDIDOS\n========================================================= */\n\nfunction renderizarPedidos(){\n\n    const tabla =\n        document.getElementById(\n            \"tablaPedidos\"\n        );\n\n    tabla.innerHTML = \"\";\n\n\n    const buscar =\n        document\n            .getElementById(\n                \"buscarPedido\"\n            )\n            .value\n            .toLowerCase()\n            .trim();\n\n\n    const cliente =\n        document\n            .getElementById(\n                \"filtroCliente\"\n            )\n            .value;\n\n\n    const estado =\n        document\n            .getElementById(\n                \"filtroEstado\"\n            )\n            .value;\n\n\n    const desde =\n        document\n            .getElementById(\n                \"fechaDesde\"\n            )\n            .value;\n\n\n    const hasta =\n        document\n            .getElementById(\n                \"fechaHasta\"\n            )\n            .value;\n\n\n    let pedidos =\n        obtenerPedidos();\n\n\n    pedidos =\n        pedidos\n            .filter(function(p){\n\n                const coincideTexto =\n                    !buscar ||\n                    p.id\n                        .toLowerCase()\n                        .includes(buscar) ||\n                    p.cliente\n                        .toLowerCase()\n                        .includes(buscar);\n\n                const coincideCliente =\n                    !cliente ||\n                    p.cliente === cliente;\n\n                const coincideEstado =\n                    !estado ||\n                    p.estado === estado;\n\n                const coincideDesde =\n                    !desde ||\n                    p.fecha >= desde;\n\n                const coincideHasta =\n                    !hasta ||\n                    p.fecha <= hasta;\n\n                return (\n                    coincideTexto &&\n                    coincideCliente &&\n                    coincideEstado &&\n                    coincideDesde &&\n                    coincideHasta\n                );\n\n            })\n            .sort(function(a,b){\n\n                return b.id\n                    .localeCompare(a.id);\n\n            });\n\n\n    pedidos.forEach(function(p){\n\n        const fila =\n            document.createElement(\"tr\");\n\n        if(\n            p.id ===\n            pedidoSeleccionadoId\n        ){\n\n            fila.classList.add(\n                \"selected\"\n            );\n\n        }\n\n        fila.onclick =\n            function(){\n\n                seleccionarPedido(\n                    p.id\n                );\n\n            };\n\n\n        fila.innerHTML = `\n\n            <td>\n                <strong>${p.id}</strong>\n            </td>\n\n            <td>\n                ${p.cliente}\n            </td>\n\n            <td>\n                ${formatearFecha(p.fecha)}\n            </td>\n\n            <td>\n                Bs ${moneda(p.total)}\n            </td>\n\n            <td>\n\n                <span\n                    class=\"status ${claseEstado(p.estado)}\"\n                >\n                    ${p.estado}\n                </span>\n\n            </td>\n\n            <td>\n                ${formatearFecha(p.entrega)}\n            </td>\n\n            <td>\n\n                <div class=\"row-actions\">\n\n                    <button\n                        class=\"icon-btn icon-view\"\n                        onclick=\"\n                            event.stopPropagation();\n                            mostrarDetallePedido('${p.id}')\n                        \"\n                    >\n                        👁\n                    </button>\n\n                    <button\n                        class=\"icon-btn icon-edit\"\n                        onclick=\"\n                            event.stopPropagation();\n                            editarPedido('${p.id}')\n                        \"\n                    >\n                        ✎\n                    </button>\n\n                    <button\n                        class=\"icon-btn icon-delete\"\n                        onclick=\"\n                            event.stopPropagation();\n                            eliminarPedido('${p.id}')\n                        \"\n                    >\n                        🗑\n                    </button>\n\n                </div>\n\n            </td>\n\n        `;\n\n        tabla.appendChild(fila);\n\n    });\n\n}\n\n\n/* =========================================================\n   SELECCIONAR\n========================================================= */\n\nfunction seleccionarPedido(id){\n\n    pedidoSeleccionadoId =\n        id;\n\n    renderizarPedidos();\n\n    mostrarDetallePedido(id);\n\n}\n\n\n/* =========================================================\n   DETALLE\n========================================================= */\n\nfunction mostrarDetallePedido(id){\n\n    pedidoSeleccionadoId =\n        id;\n\n    const pedido =\n        obtenerPedidos()\n        .find(p => p.id === id);\n\n    if(!pedido){\n        return;\n    }\n\n    let productosHTML = \"\";\n\n    pedido.productos\n        .forEach(function(p){\n\n            productosHTML += `\n\n                <div class=\"detail-product\">\n\n                    <span>\n                        • ${p.nombre}\n                        <br>\n                        ${p.cantidad}\n                        x Bs ${moneda(p.precio)}\n                    </span>\n\n                    <strong>\n                        Bs ${moneda(p.subtotal)}\n                    </strong>\n\n                </div>\n\n            `;\n\n        });\n\n\n    document\n        .getElementById(\n            \"detallePedido\"\n        )\n        .innerHTML = `\n\n        <div class=\"detail-row\">\n            <strong>ID Pedido:</strong>\n            <span>${pedido.id}</span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Cliente:</strong>\n            <span>${pedido.cliente}</span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Contacto:</strong>\n            <span>${pedido.contacto || \"-\"}</span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Fecha Pedido:</strong>\n            <span>${formatearFecha(pedido.fecha)}</span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Entrega:</strong>\n            <span>${formatearFecha(pedido.entrega)}</span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Estado:</strong>\n\n            <span>\n                <span\n                    class=\"status ${claseEstado(pedido.estado)}\"\n                >\n                    ${pedido.estado}\n                </span>\n            </span>\n        </div>\n\n        <div class=\"detail-row\">\n            <strong>Pago:</strong>\n            <span>${pedido.metodoPago}</span>\n        </div>\n\n        <div class=\"detail-products\">\n\n            <strong>PRODUCTOS</strong>\n\n            ${productosHTML}\n\n        </div>\n\n        <div class=\"detail-total\">\n\n            <span>TOTAL</span>\n\n            <span>\n                Bs ${moneda(pedido.total)}\n            </span>\n\n        </div>\n\n    `;\n\n    renderizarPedidos();\n\n}\n\n\n/* =========================================================\n   VER SELECCIONADO\n========================================================= */\n\nfunction verPedidoSeleccionado(){\n\n    if(!pedidoSeleccionadoId){\n\n        alert(\n            \"Seleccione un pedido.\"\n        );\n\n        return;\n    }\n\n    mostrarDetallePedido(\n        pedidoSeleccionadoId\n    );\n\n}\n\n\n/* =========================================================\n   EDITAR SELECCIONADO\n========================================================= */\n\nfunction editarPedidoSeleccionado(){\n\n    if(!pedidoSeleccionadoId){\n\n        alert(\n            \"Seleccione un pedido.\"\n        );\n\n        return;\n    }\n\n    editarPedido(\n        pedidoSeleccionadoId\n    );\n\n}\n\n\n/* =========================================================\n   EDITAR\n========================================================= */\n\nfunction editarPedido(id){\n\n    const pedido =\n        obtenerPedidos()\n        .find(p => p.id === id);\n\n    if(!pedido){\n        return;\n    }\n\n    pedidoEditandoId =\n        id;\n\n    document\n        .getElementById(\n            \"tituloModalPedido\"\n        )\n        .innerText =\n        \"EDITAR PEDIDO \" + id;\n\n\n    document\n        .getElementById(\n            \"clientePedido\"\n        )\n        .value =\n        pedido.cliente;\n\n\n    document\n        .getElementById(\n            \"contactoPedido\"\n        )\n        .value =\n        pedido.contacto || \"\";\n\n\n    document\n        .getElementById(\n            \"direccionPedido\"\n        )\n        .value =\n        pedido.direccion || \"\";\n\n\n    document\n        .getElementById(\n            \"fechaPedido\"\n        )\n        .value =\n        pedido.fecha;\n\n\n    document\n        .getElementById(\n            \"fechaEntrega\"\n        )\n        .value =\n        pedido.entrega;\n\n\n    document\n        .getElementById(\n            \"estadoPedido\"\n        )\n        .value =\n        pedido.estado;\n\n\n    document\n        .getElementById(\n            \"metodoPago\"\n        )\n        .value =\n        pedido.metodoPago;\n\n\n    document\n        .getElementById(\n            \"descuentoPedido\"\n        )\n        .value =\n        pedido.descuento || 0;\n\n\n    document\n        .getElementById(\n            \"observacionesPedido\"\n        )\n        .value =\n        pedido.observaciones || \"\";\n\n\n    const contenedor =\n        document.getElementById(\n            \"contenedorProductos\"\n        );\n\n    contenedor.innerHTML = \"\";\n\n\n    pedido.productos\n        .forEach(function(p){\n\n            agregarProducto(p);\n\n        });\n\n\n    calcularTotalPedido();\n\n\n    document\n        .getElementById(\n            \"modalPedido\"\n        )\n        .classList.add(\"show\");\n\n}\n\n\n/* =========================================================\n   CANCELAR\n========================================================= */\n\nfunction cancelarPedidoSeleccionado(){\n\n    if(!pedidoSeleccionadoId){\n\n        alert(\n            \"Seleccione un pedido.\"\n        );\n\n        return;\n    }\n\n    const confirmar =\n        confirm(\n            \"¿Desea cancelar el pedido?\"\n        );\n\n    if(!confirmar){\n        return;\n    }\n\n\n    let pedidos =\n        obtenerPedidos();\n\n\n    const pedido =\n        pedidos.find(\n            p =>\n            p.id ===\n            pedidoSeleccionadoId\n        );\n\n\n    if(pedido){\n\n        pedido.estado =\n            \"Cancelado\";\n\n    }\n\n\n    guardarPedidosStorage(\n        pedidos\n    );\n\n    actualizarTodo();\n\n    mostrarDetallePedido(\n        pedidoSeleccionadoId\n    );\n\n}\n\n\n/* =========================================================\n   ELIMINAR\n========================================================= */\n\nfunction eliminarPedido(id){\n\n    const confirmar =\n        confirm(\n            \"¿Eliminar definitivamente este pedido?\"\n        );\n\n    if(!confirmar){\n        return;\n    }\n\n\n    let pedidos =\n        obtenerPedidos();\n\n\n    pedidos =\n        pedidos.filter(\n            p => p.id !== id\n        );\n\n\n    guardarPedidosStorage(\n        pedidos\n    );\n\n\n    if(\n        pedidoSeleccionadoId === id\n    ){\n\n        pedidoSeleccionadoId =\n            null;\n\n        document\n            .getElementById(\n                \"detallePedido\"\n            )\n            .innerHTML =\n            \"<p>Selecciona un pedido para ver sus detalles.</p>\";\n\n    }\n\n\n    actualizarTodo();\n\n}\n\n\n/* =========================================================\n   KPIs\n========================================================= */\n\nfunction actualizarKPIs(){\n\n    const pedidos =\n        obtenerPedidos();\n\n\n    document\n        .getElementById(\n            \"kpiTotal\"\n        )\n        .innerText =\n        pedidos.length;\n\n\n    document\n        .getElementById(\n            \"kpiPendientes\"\n        )\n        .innerText =\n        pedidos.filter(\n            p =>\n            p.estado === \"Pendiente\"\n        ).length;\n\n\n    document\n        .getElementById(\n            \"kpiProceso\"\n        )\n        .innerText =\n        pedidos.filter(\n            p =>\n            p.estado === \"En proceso\"\n        ).length;\n\n\n    document\n        .getElementById(\n            \"kpiEnviados\"\n        )\n        .innerText =\n        pedidos.filter(\n            p =>\n            p.estado === \"Enviado\"\n        ).length;\n\n\n    document\n        .getElementById(\n            \"kpiCancelados\"\n        )\n        .innerText =\n        pedidos.filter(\n            p =>\n            p.estado === \"Cancelado\"\n        ).length;\n\n}\n\n\n/* =========================================================\n   CLIENTES DEL FILTRO\n========================================================= */\n\nfunction actualizarFiltroClientes(){\n\n    const pedidos =\n        obtenerPedidos();\n\n    const select =\n        document.getElementById(\n            \"filtroCliente\"\n        );\n\n    const actual =\n        select.value;\n\n\n    const clientes =\n        [\n            ...new Set(\n                pedidos\n                .map(p => p.cliente)\n                .filter(Boolean)\n            )\n        ]\n        .sort();\n\n\n    select.innerHTML =\n        '<option value=\"\">Todos los clientes</option>';\n\n\n    clientes.forEach(function(c){\n\n        const option =\n            document.createElement(\n                \"option\"\n            );\n\n        option.value = c;\n        option.textContent = c;\n\n        select.appendChild(\n            option\n        );\n\n    });\n\n\n    select.value =\n        actual;\n\n}\n\n\n/* =========================================================\n   EXPORTAR CSV\n========================================================= */\n\nfunction exportarPedidos(){\n\n    const pedidos =\n        obtenerPedidos();\n\n\n    if(pedidos.length === 0){\n\n        alert(\n            \"No existen pedidos para exportar.\"\n        );\n\n        return;\n    }\n\n\n    let csv =\n        \"ID;Cliente;Fecha;Entrega;Estado;Total Bs;Metodo Pago\\n\";\n\n\n    pedidos.forEach(function(p){\n\n        csv +=\n            `${p.id};` +\n            `${p.cliente};` +\n            `${formatearFecha(p.fecha)};` +\n            `${formatearFecha(p.entrega)};` +\n            `${p.estado};` +\n            `${p.total};` +\n            `${p.metodoPago}\\n`;\n\n    });\n\n\n    const blob =\n        new Blob(\n            [\"\\uFEFF\" + csv],\n            {\n                type:\n                \"text/csv;charset=utf-8;\"\n            }\n        );\n\n\n    const url =\n        URL.createObjectURL(\n            blob\n        );\n\n\n    const enlace =\n        document.createElement(\n            \"a\"\n        );\n\n\n    enlace.href =\n        url;\n\n\n    enlace.download =\n        \"Pedidos_Proactiva.csv\";\n\n\n    document.body\n        .appendChild(\n            enlace\n        );\n\n\n    enlace.click();\n\n\n    enlace.remove();\n\n\n    URL.revokeObjectURL(\n        url\n    );\n\n}\n\n\n/* =========================================================\n   ACTUALIZAR TODO\n========================================================= */\n\nfunction actualizarTodo(){\n\n    actualizarKPIs();\n\n    actualizarFiltroClientes();\n\n    renderizarPedidos();\n\n}\n\n\n/* =========================================================\n   DATOS DEMO SOLO SI ESTÁ VACÍO\n========================================================= */\n\nfunction crearDatosDemo(){\n\n    const pedidos =\n        obtenerPedidos();\n\n    if(pedidos.length > 0){\n        return;\n    }\n\n\n    const demo = [\n\n        {\n            id:\"PED-00001\",\n            cliente:\"Constructora Andina S.R.L.\",\n            contacto:\"70000001\",\n            direccion:\"Zona Central\",\n            fecha:\"2026-08-27\",\n            entrega:\"2026-08-30\",\n            estado:\"Pendiente\",\n            metodoPago:\"Transferencia\",\n            descuento:0,\n            observaciones:\"\",\n            productos:[\n                {\n                    nombre:\"Escritorio Ejecutivo\",\n                    cantidad:2,\n                    precio:850,\n                    subtotal:1700\n                },\n                {\n                    nombre:\"Silla Gerencial\",\n                    cantidad:3,\n                    precio:350,\n                    subtotal:1050\n                },\n                {\n                    nombre:\"Archivador Metálico\",\n                    cantidad:1,\n                    precio:100,\n                    subtotal:100\n                }\n            ],\n            subtotal:2850,\n            total:2850\n        },\n\n\n        {\n            id:\"PED-00002\",\n            cliente:\"Muebles & Diseño\",\n            contacto:\"70000002\",\n            direccion:\"Av. Principal\",\n            fecha:\"2026-08-27\",\n            entrega:\"2026-08-29\",\n            estado:\"En proceso\",\n            metodoPago:\"QR\",\n            descuento:0,\n            observaciones:\"\",\n            productos:[\n                {\n                    nombre:\"Mesa de Oficina\",\n                    cantidad:2,\n                    precio:625,\n                    subtotal:1250\n                }\n            ],\n            subtotal:1250,\n            total:1250\n        }\n\n    ];\n\n\n    guardarPedidosStorage(\n        demo\n    );\n\n}\n\n\n/* =========================================================\n   INICIO\n========================================================= */\n\ndocument.addEventListener(\n    \"DOMContentLoaded\",\n    function(){\n\n        crearDatosDemo();\n\n        actualizarTodo();\n\n    }\n);\n\n<\/script>\n\n<script>\n(function(){\n  function normalizar(s){\n    return (s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n  }\n  document.addEventListener('click', function(ev){\n    var a = ev.target.closest && ev.target.closest('a');\n    if(!a) return;\n    var texto = normalizar(a.textContent);\n    var href = normalizar(a.getAttribute('href') || '');\n    var pagina = null;\n    if(texto.includes('inicio') || href.includes('index')) pagina='inicio';\n    else if(texto.includes('produccion') || href.includes('produccion')) pagina='produccion';\n    else if(texto.includes('pedidos') || href.includes('pedidos')) pagina='pedidos';\n    else if(texto.includes('clientes') || href.includes('clientes')) pagina='clientes';\n    else if(texto.includes('ventas') || href.includes('ventas')) pagina='ventas';\n    else if(texto.includes('reportes') || href.includes('reportes')) pagina='reportes';\n    if(pagina){\n      ev.preventDefault();\n      ev.stopPropagation();\n      parent.postMessage({type:'proactiva-nav', page:pagina}, '*');\n    }\n  }, true);\n  parent.postMessage({type:'proactiva-ready', page: document.title || ''}, '*');\n})();\n<\/script>\n</body>\n</html>", "clientes": "<!DOCTYPE html>\n\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Clientes | Proactiva Tu Negocio</title>\n<style>\n\n/* =========================================================\n   CONFIGURACIÓN GENERAL\n========================================================= */\n\n*{\n    margin:0;\n    padding:0;\n    box-sizing:border-box;\n}\n\nbody{\n    font-family:Arial, Helvetica, sans-serif;\n    background:#f5a800;\n    color:#1e293b;\n    min-height:100vh;\n}\n\nbutton,\ninput,\nselect,\ntextarea{\n    font-family:inherit;\n}\n\nbutton{\n    cursor:pointer;\n}\n\na{\n    text-decoration:none;\n}\n\n\n/* =========================================================\n   ENCABEZADO\n========================================================= */\n\n.header{\n\n    height:120px;\n\n    background:#03052f;\n\n    color:white;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:space-between;\n\n    padding:0 35px;\n\n    position:fixed;\n\n    top:0;\n\n    left:0;\n\n    right:0;\n\n    z-index:1000;\n\n    box-shadow:\n    0 3px 10px rgba(0,0,0,.25);\n}\n\n\n.header-left{\n\n    display:flex;\n\n    align-items:center;\n\n    gap:25px;\n}\n\n\n/* LOGO */\n\n.logo-box{\n\n    width:110px;\n\n    height:80px;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:center;\n\n    overflow:hidden;\n}\n\n\n.logo-box img{\n\n    width:100%;\n\n    height:100%;\n\n    object-fit:contain;\n}\n\n\n.separator{\n\n    width:2px;\n\n    height:85px;\n\n    background:\n    rgba(255,255,255,.70);\n}\n\n\n.brand h1{\n\n    font-size:31px;\n\n    letter-spacing:1px;\n\n    color:white;\n}\n\n\n.brand h1 span{\n\n    color:#ffa600;\n}\n\n\n.brand p{\n\n    margin-top:7px;\n\n    font-size:16px;\n\n    color:#f1f1f1;\n}\n\n\n/* ADMINISTRADOR */\n\n.administrator{\n\n    display:flex;\n\n    align-items:center;\n\n    gap:12px;\n}\n\n\n.avatar{\n\n    width:55px;\n\n    height:55px;\n\n    border-radius:50%;\n\n    background:white;\n\n    color:#03052f;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:center;\n\n    font-size:28px;\n}\n\n\n.administrator-info strong{\n\n    display:block;\n\n    font-size:17px;\n}\n\n\n.administrator-info span{\n\n    display:block;\n\n    margin-top:5px;\n\n    color:#ddd;\n\n    font-size:13px;\n}\n\n\n.admin-arrow{\n\n    margin-left:10px;\n\n    font-size:22px;\n}\n\n\n/* =========================================================\n   MENÚ LATERAL\n========================================================= */\n\n.sidebar{\n\n    position:fixed;\n\n    top:120px;\n\n    left:0;\n\n    bottom:0;\n\n    width:240px;\n\n    background:#03052f;\n\n    color:white;\n\n    padding:22px 15px;\n\n    overflow-y:auto;\n\n    z-index:900;\n}\n\n\n.sidebar-title{\n\n    text-align:center;\n\n    font-size:21px;\n\n    font-weight:bold;\n\n    line-height:1.3;\n\n    margin-bottom:28px;\n}\n\n\n.menu{\n\n    display:flex;\n\n    flex-direction:column;\n\n    gap:10px;\n}\n\n\n.menu a{\n\n    color:white;\n\n    display:flex;\n\n    align-items:center;\n\n    gap:15px;\n\n    padding:15px 14px;\n\n    border-radius:9px;\n\n    transition:.25s;\n\n    font-size:16px;\n}\n\n\n.menu a:hover{\n\n    background:\n    rgba(18,224,221,.20);\n\n    transform:\n    translateX(3px);\n}\n\n\n.menu a.active{\n\n    background:#16dedb;\n\n    color:#051033;\n\n    font-weight:bold;\n}\n\n\n.menu-icon{\n\n    width:28px;\n\n    text-align:center;\n\n    font-size:23px;\n}\n\n\n/* =========================================================\n   CONTENIDO PRINCIPAL\n========================================================= */\n\n.main{\n\n    margin-left:240px;\n\n    padding-top:120px;\n\n    min-height:100vh;\n\n    background:\n\n    linear-gradient(\n        135deg,\n        #ffad00 0%,\n        #ffa000 45%,\n        #ffb000 100%\n    );\n}\n\n\n.content{\n\n    padding:25px 30px 35px;\n}\n\n\n.page-title h2{\n\n    font-size:36px;\n\n    font-weight:900;\n\n    color:#17202a;\n}\n\n\n.page-title p{\n\n    margin-top:5px;\n\n    font-size:16px;\n\n    font-weight:bold;\n\n    color:#19202a;\n}\n\n\n/* =========================================================\n   TARJETAS\n========================================================= */\n\n.stats-grid{\n\n    display:grid;\n\n    grid-template-columns:\n    repeat(4,1fr);\n\n    gap:15px;\n\n    margin-top:20px;\n}\n\n\n.stat-card{\n\n    min-height:125px;\n\n    background:white;\n\n    border-radius:13px;\n\n    padding:18px;\n\n    display:flex;\n\n    align-items:center;\n\n    gap:15px;\n\n    box-shadow:\n    0 5px 15px\n    rgba(0,0,0,.13);\n}\n\n\n.stat-icon{\n\n    width:65px;\n\n    height:65px;\n\n    border-radius:50%;\n\n    color:white;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:center;\n\n    font-size:30px;\n\n    flex-shrink:0;\n}\n\n\n.icon-clientes{\n\n    background:#13b9bd;\n}\n\n\n.icon-activos{\n\n    background:#21b34b;\n}\n\n\n.icon-nuevos{\n\n    background:#ff9500;\n}\n\n\n.icon-facturado{\n\n    background:#8449ca;\n}\n\n\n.stat-info h3{\n\n    font-size:13px;\n\n    color:#17202a;\n}\n\n\n.stat-number{\n\n    font-size:30px;\n\n    font-weight:900;\n\n    margin-top:4px;\n}\n\n\n.stat-info p{\n\n    margin-top:4px;\n\n    font-size:12px;\n\n    color:#64748b;\n}\n\n\n/* =========================================================\n   CAJAS\n========================================================= */\n\n.panel{\n\n    background:white;\n\n    border-radius:12px;\n\n    padding:18px;\n\n    box-shadow:\n    0 5px 15px\n    rgba(0,0,0,.12);\n}\n\n\n.top-grid{\n\n    display:grid;\n\n    grid-template-columns:\n    1.4fr 1fr;\n\n    gap:15px;\n\n    margin-top:18px;\n}\n\n\n.panel-title{\n\n    font-weight:900;\n\n    font-size:17px;\n\n    margin-bottom:14px;\n}\n\n\n/* =========================================================\n   FILTROS\n========================================================= */\n\n.filters{\n\n    display:grid;\n\n    grid-template-columns:\n    1.5fr 1fr;\n\n    gap:10px;\n}\n\n\n.control{\n\n    height:42px;\n\n    border:\n    1px solid #d1d7df;\n\n    border-radius:7px;\n\n    padding:0 11px;\n\n    outline:none;\n\n    background:white;\n}\n\n\n.control:focus{\n\n    border-color:#13b9bd;\n\n    box-shadow:\n    0 0 0 2px\n    rgba(19,185,189,.13);\n}\n\n\n/* =========================================================\n   BOTONES PRINCIPALES\n========================================================= */\n\n.actions{\n\n    display:grid;\n\n    grid-template-columns:\n    1fr 1fr;\n\n    gap:10px;\n}\n\n\n.btn{\n\n    border:none;\n\n    border-radius:7px;\n\n    padding:12px 16px;\n\n    font-weight:bold;\n\n    color:white;\n\n    transition:.2s;\n}\n\n\n.btn:hover{\n\n    transform:\n    translateY(-2px);\n}\n\n\n.btn-green{\n\n    background:#13ad4c;\n}\n\n\n.btn-blue{\n\n    background:#1375e5;\n}\n\n\n.btn-purple{\n\n    background:#7c3fc2;\n}\n\n\n.btn-orange{\n\n    background:#f59d00;\n}\n\n\n.btn-gray{\n\n    background:#e5e7eb;\n\n    color:#1f2937;\n}\n\n\n/* =========================================================\n   TABLA DE CLIENTES\n========================================================= */\n\n.clients-panel{\n\n    margin-top:15px;\n}\n\n\n.table-wrap{\n\n    overflow-x:auto;\n}\n\n\ntable{\n\n    width:100%;\n\n    border-collapse:collapse;\n\n    min-width:900px;\n}\n\n\nthead{\n\n    background:#10b8b8;\n\n    color:white;\n}\n\n\nth,\ntd{\n\n    border:\n    1px solid #e1e5e9;\n\n    padding:11px 8px;\n\n    text-align:center;\n\n    font-size:12px;\n}\n\n\ntbody tr:hover{\n\n    background:#f5ffff;\n}\n\n\n.nombre-cliente{\n\n    text-align:left;\n\n    font-weight:bold;\n}\n\n\n/* ESTADOS */\n\n.status{\n\n    display:inline-block;\n\n    min-width:75px;\n\n    padding:6px 10px;\n\n    border-radius:15px;\n\n    font-weight:bold;\n\n    font-size:11px;\n}\n\n\n.status-activo{\n\n    background:#d7f6df;\n\n    color:#18833a;\n}\n\n\n.status-inactivo{\n\n    background:#ffdcdc;\n\n    color:#d42e2e;\n}\n\n\n/* =========================================================\n   BOTONES TABLA\n========================================================= */\n\n.row-actions{\n\n    display:flex;\n\n    justify-content:center;\n\n    gap:5px;\n}\n\n\n.icon-btn{\n\n    width:31px;\n\n    height:31px;\n\n    border:none;\n\n    border-radius:5px;\n\n    color:white;\n}\n\n\n.view{\n\n    background:#0e79e8;\n}\n\n\n.edit{\n\n    background:#ffad00;\n}\n\n\n.delete{\n\n    background:#e93232;\n}\n\n\n/* =========================================================\n   PAGINACIÓN\n========================================================= */\n\n.pagination-area{\n\n    margin-top:15px;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:space-between;\n\n    gap:15px;\n\n    font-size:12px;\n}\n\n\n.pagination{\n\n    display:flex;\n\n    gap:5px;\n}\n\n\n.page-btn{\n\n    width:36px;\n\n    height:36px;\n\n    border:\n    1px solid #ddd;\n\n    background:white;\n\n    border-radius:6px;\n}\n\n\n.page-btn.active{\n\n    background:#13b9bd;\n\n    border-color:#13b9bd;\n\n    color:white;\n\n    font-weight:bold;\n}\n\n\n/* =========================================================\n   MODAL\n========================================================= */\n\n.modal{\n\n    position:fixed;\n\n    inset:0;\n\n    background:\n    rgba(3,5,47,.70);\n\n    display:none;\n\n    align-items:center;\n\n    justify-content:center;\n\n    padding:15px;\n\n    z-index:5000;\n}\n\n\n.modal.show{\n\n    display:flex;\n}\n\n\n.modal-box{\n\n    width:\n    min(760px,95vw);\n\n    max-height:93vh;\n\n    overflow:auto;\n\n    background:white;\n\n    border-radius:13px;\n\n    box-shadow:\n    0 15px 40px\n    rgba(0,0,0,.35);\n}\n\n\n.modal-header{\n\n    background:#03052f;\n\n    color:white;\n\n    padding:16px 20px;\n\n    display:flex;\n\n    align-items:center;\n\n    justify-content:space-between;\n}\n\n\n.modal-close{\n\n    border:none;\n\n    background:none;\n\n    color:white;\n\n    font-size:27px;\n}\n\n\n.modal-body{\n\n    padding:20px;\n}\n\n\n.form-grid{\n\n    display:grid;\n\n    grid-template-columns:\n    1fr 1fr;\n\n    gap:14px;\n}\n\n\n.form-group{\n\n    display:flex;\n\n    flex-direction:column;\n\n    gap:6px;\n}\n\n\n.form-group.full{\n\n    grid-column:1/-1;\n}\n\n\n.form-group label{\n\n    font-size:13px;\n\n    font-weight:bold;\n}\n\n\n.form-group input,\n.form-group select,\n.form-group textarea{\n\n    border:\n    1px solid #d0d7de;\n\n    border-radius:7px;\n\n    padding:10px;\n\n    outline:none;\n}\n\n\n.form-group textarea{\n\n    min-height:80px;\n\n    resize:vertical;\n}\n\n\n.modal-footer{\n\n    border-top:\n    1px solid #eee;\n\n    padding:15px 20px;\n\n    display:flex;\n\n    justify-content:flex-end;\n\n    gap:10px;\n}\n\n\n/* =========================================================\n   DETALLE CLIENTE\n========================================================= */\n\n.detail-grid{\n\n    display:grid;\n\n    grid-template-columns:\n    150px 1fr;\n\n    gap:12px;\n\n    font-size:14px;\n}\n\n\n.detail-grid strong{\n\n    color:#334155;\n}\n\n\n/* =========================================================\n   RESPONSIVE\n========================================================= */\n\n@media(max-width:1100px){\n\n    .stats-grid{\n\n        grid-template-columns:\n        repeat(2,1fr);\n    }\n\n\n    .top-grid{\n\n        grid-template-columns:1fr;\n    }\n\n}\n\n\n@media(max-width:750px){\n\n    .header{\n\n        height:90px;\n\n        padding:\n        5px 15px;\n    }\n\n\n    .logo-box{\n\n        width:90px;\n\n        height:65px;\n    }\n\n\n    .separator{\n\n        display:none;\n    }\n\n\n    .brand h1{\n\n        font-size:20px;\n    }\n\n\n    .brand p{\n\n        font-size:11px;\n    }\n\n\n    .administrator-info{\n\n        display:none;\n    }\n\n\n    .sidebar{\n\n        top:90px;\n\n        width:75px;\n\n        padding:\n        15px 7px;\n    }\n\n\n    .sidebar-title{\n\n        display:none;\n    }\n\n\n    .menu a{\n\n        justify-content:center;\n\n        font-size:0;\n    }\n\n\n    .menu-icon{\n\n        font-size:23px;\n    }\n\n\n    .main{\n\n        margin-left:75px;\n\n        padding-top:90px;\n    }\n\n\n    .content{\n\n        padding:18px;\n    }\n\n\n    .stats-grid{\n\n        grid-template-columns:1fr;\n    }\n\n\n    .filters,\n    .actions,\n    .form-grid{\n\n        grid-template-columns:1fr;\n    }\n\n}\n\n</style>\n</head>\n<body>\n<!-- =========================================================\n     ENCABEZADO\n========================================================= -->\n<header class=\"header\">\n<div class=\"header-left\">\n<div class=\"logo-box\">\n<img alt=\"Proactiva Tu Negocio\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkIC
