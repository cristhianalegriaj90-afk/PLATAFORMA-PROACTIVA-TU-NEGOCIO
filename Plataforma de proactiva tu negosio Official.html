tas\n</p>\n<!-- ===================================\n     ESTADISTICAS\n==================================== -->\n<section class=\"estadisticas\">\n<div class=\"tarjeta\">\n<div>\n<h3>\n            VENTAS TOTALES\n        </h3>\n<div class=\"numero\" id=\"ventasTotales\">\n\n            Bs 0\n\n        </div>\n<p>\n            Periodo seleccionado\n        </p>\n</div>\n<div class=\"icono azul\">\n        $\n    </div>\n</div>\n<div class=\"tarjeta\">\n<div>\n<h3>\n            CANTIDAD DE VENTAS\n        </h3>\n<div class=\"numero\" id=\"cantidadVentas\">\n\n            0\n\n        </div>\n<p>\n            Operaciones\n        </p>\n</div>\n<div class=\"icono verde\">\n        📊\n    </div>\n</div>\n<div class=\"tarjeta\">\n<div>\n<h3>\n            PROMEDIO POR VENTA\n        </h3>\n<div class=\"numero\" id=\"promedioVentas\">\n\n            Bs 0\n\n        </div>\n<p>\n            Promedio general\n        </p>\n</div>\n<div class=\"icono naranja\">\n        🛒\n    </div>\n</div>\n<div class=\"tarjeta\">\n<div>\n<h3>\n            ÚLTIMA VENTA\n        </h3>\n<div class=\"numero\" id=\"ultimaVenta\">\n\n            --\n\n        </div>\n<p>\n            Fecha\n        </p>\n</div>\n<div class=\"icono morado\">\n        📅\n    </div>\n</div>\n</section>\n<!-- ===================================\n     FILTROS\n==================================== -->\n<section class=\"panel\">\n<h2>\n    🔎 FILTROS DEL REPORTE\n</h2>\n<div class=\"filtros\">\n<div class=\"campo\">\n<label>\n    Fecha desde\n</label>\n<input id=\"fechaDesde\" type=\"date\"/>\n</div>\n<div class=\"campo\">\n<label>\n    Fecha hasta\n</label>\n<input id=\"fechaHasta\" type=\"date\"/>\n</div>\n<div class=\"campo\">\n<label>\n    Agrupar por\n</label>\n<select id=\"agrupar\">\n<option value=\"dia\">\n    Día\n</option>\n<option value=\"mes\">\n    Mes\n</option>\n</select>\n</div>\n<div class=\"campo\">\n<label>\n    Método de pago\n</label>\n<select id=\"filtroMetodo\">\n<option value=\"\">\n    Todos\n</option>\n<option value=\"Efectivo\">\n    Efectivo\n</option>\n<option value=\"Transferencia\">\n    Transferencia\n</option>\n<option value=\"Tarjeta\">\n    Tarjeta\n</option>\n</select>\n</div>\n<div class=\"campo\">\n<label>\n    Estado\n</label>\n<select id=\"filtroEstado\">\n<option value=\"\">\n    Todos\n</option>\n<option value=\"Completada\">\n    Completada\n</option>\n<option value=\"Pendiente\">\n    Pendiente\n</option>\n</select>\n</div>\n</div>\n<div class=\"botones\">\n<button class=\"btn-generar\" onclick=\"generarReporte()\">\n\n🔍 Generar Reporte\n\n</button>\n<button class=\"btn-limpiar\" onclick=\"limpiarFiltros()\">\n\n🔄 Limpiar Filtros\n\n</button>\n<button class=\"btn-exportar\" onclick=\"exportarReporte()\">\n\n📥 Exportar Excel\n\n</button>\n<button class=\"btn-imprimir\" onclick=\"window.print()\">\n\n🖨 Imprimir\n\n</button>\n</div>\n</section>\n<!-- ===================================\n     GRAFICOS\n==================================== -->\n<section class=\"graficos\">\n<!-- VENTAS POR DIA -->\n<div class=\"grafico\">\n<h2>\n    📈 VENTAS POR DÍA (Bs)\n</h2>\n<div class=\"barras\" id=\"graficoDias\">\n</div>\n</div>\n<!-- METODOS DE PAGO -->\n<div class=\"grafico\">\n<h2>\n    💳 VENTAS POR MÉTODO DE PAGO\n</h2>\n<div class=\"metodos\" id=\"graficoMetodos\">\n</div>\n</div>\n<!-- PRODUCTOS -->\n<div class=\"grafico\">\n<h2>\n    📦 VENTAS POR PRODUCTO\n</h2>\n<div class=\"productos\" id=\"graficoProductos\">\n</div>\n</div>\n</section>\n<!-- ===================================\n     TABLA DETALLADA\n==================================== -->\n<section class=\"tabla-panel\">\n<h2>\n    📋 RESUMEN DETALLADO DE VENTAS\n</h2>\n<div class=\"tabla-scroll\">\n<table>\n<thead>\n<tr>\n<th>\n    Fecha\n</th>\n<th>\n    N° Ventas\n</th>\n<th>\n    Ventas (Bs)\n</th>\n<th>\n    Cantidad Total\n</th>\n<th>\n    Promedio\n</th>\n<th>\n    Método Principal\n</th>\n<th>\n    Producto Más Vendido\n</th>\n</tr>\n</thead>\n<tbody id=\"tablaReporte\">\n</tbody>\n<tfoot id=\"pieTabla\">\n</tfoot>\n</table>\n</div>\n</section>\n<!-- ===================================\n     RESUMEN GENERAL\n==================================== -->\n<section class=\"resumen\">\n<div class=\"resumen-general\">\n<h2>\n    📊 RESUMEN GENERAL\n</h2>\n<div class=\"resumen-item\">\n<span>\n    Total de ventas\n</span>\n<strong id=\"resumenVentas\">\n    0\n</strong>\n</div>\n<div class=\"resumen-item\">\n<span>\n    Cantidad total\n</span>\n<strong id=\"resumenCantidad\">\n    0 unidades\n</strong>\n</div>\n<div class=\"resumen-item\">\n<span>\n    Ingresos totales\n</span>\n<strong id=\"resumenIngresos\">\n    Bs 0\n</strong>\n</div>\n<div class=\"resumen-item\">\n<span>\n    Promedio general por venta\n</span>\n<strong id=\"resumenPromedio\">\n    Bs 0\n</strong>\n</div>\n<div class=\"resumen-item\">\n<span>\n    Periodo del reporte\n</span>\n<strong id=\"resumenPeriodo\">\n    Todos\n</strong>\n</div>\n</div>\n</section>\n</main>\n</div>\n<script>\n\n/* =====================================\n   DATOS DE VENTAS\n===================================== */\n\n/*\n   Si posteriormente conectamos este\n   apartado con Ventas.html mediante\n   localStorage, estos datos podrán\n   reemplazarse automáticamente.\n*/\n\nlet ventas = JSON.parse(\n    localStorage.getItem(\"ventas\")\n) || [\n\n{\n    numero: \"VEN-0001\",\n    fecha: \"2026-09-01\",\n    cliente: \"Empresa A\",\n    producto: \"Producto 1\",\n    cantidad: 20,\n    total: 1850,\n    metodo: \"Transferencia\",\n    estado: \"Completada\"\n},\n\n{\n    numero: \"VEN-0002\",\n    fecha: \"2026-09-02\",\n    cliente: \"Empresa B\",\n    producto: \"Producto 2\",\n    cantidad: 15,\n    total: 1200,\n    metodo: \"Efectivo\",\n    estado: \"Completada\"\n},\n\n{\n    numero: \"VEN-0003\",\n    fecha: \"2026-09-03\",\n    cliente: \"Empresa C\",\n    producto: \"Producto 1\",\n    cantidad: 25,\n    total: 2300,\n    metodo: \"Transferencia\",\n    estado: \"Completada\"\n},\n\n{\n    numero: \"VEN-0004\",\n    fecha: \"2026-09-04\",\n    cliente: \"Empresa D\",\n    producto: \"Producto 3\",\n    cantidad: 18,\n    total: 1750,\n    metodo: \"Tarjeta\",\n    estado: \"Completada\"\n},\n\n{\n    numero: \"VEN-0005\",\n    fecha: \"2026-09-05\",\n    cliente: \"Empresa A\",\n    producto: \"Producto 2\",\n    cantidad: 12,\n    total: 1100,\n    metodo: \"Efectivo\",\n    estado: \"Pendiente\"\n}\n\n];\n\n\n/* =====================================\n   FORMATO DE MONEDA\n===================================== */\n\nfunction moneda(numero) {\n\n    return \"Bs \" +\n    Number(numero).toLocaleString(\n        \"es-BO\"\n    );\n}\n\n\n/* =====================================\n   MOSTRAR REPORTE\n===================================== */\n\nfunction generarReporte() {\n\n    let fechaDesde =\n        document.getElementById(\n            \"fechaDesde\"\n        ).value;\n\n    let fechaHasta =\n        document.getElementById(\n            \"fechaHasta\"\n        ).value;\n\n    let metodo =\n        document.getElementById(\n            \"filtroMetodo\"\n        ).value;\n\n    let estado =\n        document.getElementById(\n            \"filtroEstado\"\n        ).value;\n\n\n    let filtradas = ventas.filter(\n        venta => {\n\n            let cumpleDesde =\n                !fechaDesde ||\n                venta.fecha >= fechaDesde;\n\n            let cumpleHasta =\n                !fechaHasta ||\n                venta.fecha <= fechaHasta;\n\n            let cumpleMetodo =\n                !metodo ||\n                venta.metodo === metodo;\n\n            let cumpleEstado =\n                !estado ||\n                venta.estado === estado;\n\n\n            return (\n                cumpleDesde &&\n                cumpleHasta &&\n                cumpleMetodo &&\n                cumpleEstado\n            );\n\n        }\n    );\n\n\n    actualizarEstadisticas(\n        filtradas\n    );\n\n    generarGraficoDias(\n        filtradas\n    );\n\n    generarGraficoMetodos(\n        filtradas\n    );\n\n    generarGraficoProductos(\n        filtradas\n    );\n\n    generarTabla(\n        filtradas\n    );\n\n}\n\n\n/* =====================================\n   ESTADISTICAS\n===================================== */\n\nfunction actualizarEstadisticas(\n    lista\n) {\n\n    let total = lista.reduce(\n        (suma, venta) =>\n        suma + Number(venta.total),\n        0\n    );\n\n\n    let cantidad = lista.reduce(\n        (suma, venta) =>\n        suma + Number(venta.cantidad),\n        0\n    );\n\n\n    let promedio =\n        lista.length > 0\n        ? total / lista.length\n        : 0;\n\n\n    document.getElementById(\n        \"ventasTotales\"\n    ).textContent = moneda(total);\n\n\n    document.getElementById(\n        \"cantidadVentas\"\n    ).textContent = lista.length;\n\n\n    document.getElementById(\n        \"promedioVentas\"\n    ).textContent =\n        moneda(\n            Math.round(promedio)\n        );\n\n\n    if (lista.length > 0) {\n\n        document.getElementById(\n            \"ultimaVenta\"\n        ).textContent =\n            formatearFecha(\n                lista[0].fecha\n            );\n\n    } else {\n\n        document.getElementById(\n            \"ultimaVenta\"\n        ).textContent =\n            \"--\";\n    }\n\n\n    document.getElementById(\n        \"resumenVentas\"\n    ).textContent =\n        lista.length;\n\n\n    document.getElementById(\n        \"resumenCantidad\"\n    ).textContent =\n        cantidad + \" unidades\";\n\n\n    document.getElementById(\n        \"resumenIngresos\"\n    ).textContent =\n        moneda(total);\n\n\n    document.getElementById(\n        \"resumenPromedio\"\n    ).textContent =\n        moneda(\n            Math.round(promedio)\n        );\n\n\n    let desde =\n        document.getElementById(\n            \"fechaDesde\"\n        ).value;\n\n    let hasta =\n        document.getElementById(\n            \"fechaHasta\"\n        ).value;\n\n\n    let periodo = \"Todos\";\n\n\n    if (desde || hasta) {\n\n        periodo =\n            (desde\n            ? formatearFecha(desde)\n            : \"Inicio\")\n            +\n            \" al \"\n            +\n            (hasta\n            ? formatearFecha(hasta)\n            : \"Actual\");\n\n    }\n\n\n    document.getElementById(\n        \"resumenPeriodo\"\n    ).textContent =\n        periodo;\n}\n\n\n/* =====================================\n   GRAFICO POR DIAS\n===================================== */\n\nfunction generarGraficoDias(lista) {\n\n    let contenedor =\n        document.getElementById(\n            \"graficoDias\"\n        );\n\n    contenedor.innerHTML = \"\";\n\n\n    let datos = {};\n\n\n    lista.forEach(\n        venta => {\n\n            if (!datos[venta.fecha]) {\n\n                datos[venta.fecha] = 0;\n\n            }\n\n            datos[venta.fecha] +=\n                Number(venta.total);\n\n        }\n    );\n\n\n    let fechas =\n        Object.keys(datos);\n\n\n    if (fechas.length === 0) {\n\n        contenedor.innerHTML =\n            \"<p>No existen datos.</p>\";\n\n        return;\n    }\n\n\n    let maximo =\n        Math.max(\n            ...Object.values(datos)\n        );\n\n\n    fechas.slice(-10).forEach(\n        fecha => {\n\n            let altura =\n                (datos[fecha] / maximo)\n                * 220;\n\n\n            let barra =\n                document.createElement(\n                    \"div\"\n                );\n\n\n            barra.className =\n                \"barra\";\n\n\n            barra.style.height =\n                altura + \"px\";\n\n\n            barra.title =\n                moneda(datos[fecha]);\n\n\n            barra.innerHTML =\n                \"<span>\" +\n                fecha.substring(8) +\n                \"</span>\";\n\n\n            contenedor.appendChild(\n                barra\n            );\n\n        }\n    );\n}\n\n\n/* =====================================\n   GRAFICO METODOS\n===================================== */\n\nfunction generarGraficoMetodos(\n    lista\n) {\n\n    let contenedor =\n        document.getElementById(\n            \"graficoMetodos\"\n        );\n\n    contenedor.innerHTML = \"\";\n\n\n    let datos = {};\n\n\n    lista.forEach(\n        venta => {\n\n            if (!datos[venta.metodo]) {\n\n                datos[venta.metodo] =\n                    0;\n\n            }\n\n            datos[venta.metodo] +=\n                Number(venta.total);\n\n        }\n    );\n\n\n    let total =\n        Object.values(datos)\n        .reduce(\n            (a,b) => a + b,\n            0\n        );\n\n\n    Object.entries(datos)\n    .forEach(\n        ([metodo, valor]) => {\n\n            let porcentaje =\n                total > 0\n                ? (valor / total) * 100\n                : 0;\n\n\n            let fila =\n                document.createElement(\n                    \"div\"\n                );\n\n            fila.className =\n                \"metodo\";\n\n\n            fila.innerHTML = `\n\n                <strong>\n                    ${metodo}\n                </strong>\n\n                <div class=\"progreso\">\n\n                    <div\n                    style=\"width:${porcentaje}%\">\n                    </div>\n\n                </div>\n\n                <span>\n                    ${moneda(valor)}\n                </span>\n            `;\n\n\n            contenedor.appendChild(\n                fila\n            );\n\n        }\n    );\n}\n\n\n/* =====================================\n   GRAFICO PRODUCTOS\n===================================== */\n\nfunction generarGraficoProductos(\n    lista\n) {\n\n    let contenedor =\n        document.getElementById(\n            \"graficoProductos\"\n        );\n\n    contenedor.innerHTML = \"\";\n\n\n    let datos = {};\n\n\n    lista.forEach(\n        venta => {\n\n            if (!datos[venta.producto]) {\n\n                datos[venta.producto] =\n                    0;\n\n            }\n\n            datos[venta.producto] +=\n                Number(venta.total);\n\n        }\n    );\n\n\n    let valores =\n        Object.values(datos);\n\n\n    let maximo =\n        valores.length > 0\n        ? Math.max(...valores)\n        : 1;\n\n\n    Object.entries(datos)\n    .sort(\n        (a,b) => b[1] - a[1]\n    )\n    .forEach(\n        ([producto, valor]) => {\n\n            let porcentaje =\n                (valor / maximo) * 100;\n\n\n            let fila =\n                document.createElement(\n                    \"div\"\n                );\n\n            fila.className =\n                \"producto\";\n\n\n            fila.innerHTML = `\n\n                <div class=\"producto-nombre\">\n                    ${producto}\n                </div>\n\n                <div class=\"producto-barra\">\n\n                    <div\n                    style=\"width:${porcentaje}%\">\n                    </div>\n\n                </div>\n\n                <strong>\n                    ${moneda(valor)}\n                </strong>\n\n            `;\n\n\n            contenedor.appendChild(\n                fila\n            );\n\n        }\n    );\n}\n\n\n/* =====================================\n   TABLA\n===================================== */\n\nfunction generarTabla(lista) {\n\n    let tabla =\n        document.getElementById(\n            \"tablaReporte\"\n        );\n\n    let pie =\n        document.getElementById(\n            \"pieTabla\"\n        );\n\n\n    tabla.innerHTML = \"\";\n    pie.innerHTML = \"\";\n\n\n    let agrupado = {};\n\n\n    lista.forEach(\n        venta => {\n\n            if (!agrupado[venta.fecha]) {\n\n                agrupado[venta.fecha] = {\n\n                    ventas: 0,\n\n                    total: 0,\n\n                    cantidad: 0,\n\n                    metodos: {},\n\n                    productos: {}\n\n                };\n\n            }\n\n\n            let dia =\n                agrupado[venta.fecha];\n\n\n            dia.ventas++;\n\n            dia.total +=\n                Number(venta.total);\n\n            dia.cantidad +=\n                Number(venta.cantidad);\n\n\n            dia.metodos[\n                venta.metodo\n            ] =\n                (dia.metodos[\n                    venta.metodo\n                ] || 0) + 1;\n\n\n            dia.productos[\n                venta.producto\n            ] =\n                (dia.productos[\n                    venta.producto\n                ] || 0) +\n                Number(venta.cantidad);\n\n        }\n    );\n\n\n    Object.entries(agrupado)\n    .forEach(\n        ([fecha, dia]) => {\n\n            let metodoPrincipal =\n                Object.entries(\n                    dia.metodos\n                )\n                .sort(\n                    (a,b) =>\n                    b[1] - a[1]\n                )[0];\n\n\n            let productoPrincipal =\n                Object.entries(\n                    dia.productos\n                )\n                .sort(\n                    (a,b) =>\n                    b[1] - a[1]\n                )[0];\n\n\n            let fila =\n                document.createElement(\n                    \"tr\"\n                );\n\n\n            fila.innerHTML = `\n\n                <td>\n                    ${formatearFecha(fecha)}\n                </td>\n\n                <td>\n                    ${dia.ventas}\n                </td>\n\n                <td>\n                    ${moneda(dia.total)}\n                </td>\n\n                <td>\n                    ${dia.cantidad}\n                </td>\n\n                <td>\n                    ${moneda(\n                        Math.round(\n                            dia.total /\n                            dia.ventas\n                        )\n                    )}\n                </td>\n\n                <td>\n                    ${metodoPrincipal\n                    ? metodoPrincipal[0]\n                    : \"-\"}\n                </td>\n\n                <td>\n                    ${productoPrincipal\n                    ? productoPrincipal[0]\n                    : \"-\"}\n                </td>\n\n            `;\n\n\n            tabla.appendChild(\n                fila\n            );\n\n        }\n    );\n\n\n    let totalVentas =\n        lista.length;\n\n\n    let totalIngresos =\n        lista.reduce(\n            (suma, venta) =>\n            suma + Number(venta.total),\n            0\n        );\n\n\n    let totalCantidad =\n        lista.reduce(\n            (suma, venta) =>\n            suma + Number(venta.cantidad),\n            0\n        );\n\n\n    let filaTotal =\n        document.createElement(\n            \"tr\"\n        );\n\n\n    filaTotal.className =\n        \"total\";\n\n\n    filaTotal.innerHTML = `\n\n        <td>\n            TOTAL\n        </td>\n\n        <td>\n            ${totalVentas}\n        </td>\n\n        <td>\n            ${moneda(totalIngresos)}\n        </td>\n\n        <td>\n            ${totalCantidad}\n        </td>\n\n        <td>\n            ${moneda(\n                totalVentas > 0\n                ? Math.round(\n                    totalIngresos /\n                    totalVentas\n                )\n                : 0\n            )}\n        </td>\n\n        <td>\n            -\n        </td>\n\n        <td>\n            -\n        </td>\n\n    `;\n\n\n    pie.appendChild(\n        filaTotal\n    );\n}\n\n\n/* =====================================\n   FECHA\n===================================== */\n\nfunction formatearFecha(\n    fecha\n) {\n\n    if (!fecha) return \"--\";\n\n\n    let partes =\n        fecha.split(\"-\");\n\n\n    return partes[2] +\n        \"/\" +\n        partes[1] +\n        \"/\" +\n        partes[0];\n}\n\n\n/* =====================================\n   LIMPIAR FILTROS\n===================================== */\n\nfunction limpiarFiltros() {\n\n    document.getElementById(\n        \"fechaDesde\"\n    ).value = \"\";\n\n\n    document.getElementById(\n        \"fechaHasta\"\n    ).value = \"\";\n\n\n    document.getElementById(\n        \"filtroMetodo\"\n    ).value = \"\";\n\n\n    document.getElementById(\n        \"filtroEstado\"\n    ).value = \"\";\n\n\n    generarReporte();\n}\n\n\n/* =====================================\n   EXPORTAR\n===================================== */\n\nfunction exportarReporte() {\n\n    let contenido =\n        \"REPORTE DE VENTAS\\n\\n\";\n\n\n    contenido +=\n        \"Fecha,Cliente,Producto,Cantidad,Total,Método,Estado\\n\";\n\n\n    ventas.forEach(\n        venta => {\n\n            contenido +=\n                venta.fecha + \",\" +\n                venta.cliente + \",\" +\n                venta.producto + \",\" +\n                venta.cantidad + \",\" +\n                venta.total + \",\" +\n                venta.metodo + \",\" +\n                venta.estado +\n                \"\\n\";\n\n        }\n    );\n\n\n    let archivo =\n        new Blob(\n            [contenido],\n            {\n                type:\n                \"text/csv;charset=utf-8;\"\n            }\n        );\n\n\n    let url =\n        URL.createObjectURL(\n            archivo\n        );\n\n\n    let enlace =\n        document.createElement(\n            \"a\"\n        );\n\n\n    enlace.href = url;\n\n    enlace.download =\n        \"Reporte_de_Ventas.csv\";\n\n\n    enlace.click();\n\n\n    URL.revokeObjectURL(\n        url\n    );\n}\n\n\n/* =====================================\n   INICIAR\n===================================== */\n\ngenerarReporte();\n\n<\/script>\n\n<script>\n(function(){\n  function leer(clave){ try{ var d=JSON.parse(localStorage.getItem(clave)); return Array.isArray(d)?d:[]; }catch(e){ return []; } }\n  function norm(v){return String(v||'').trim().toLowerCase();}\n  function esc(v){return String(v==null?'':v).replace(/[&<>\"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch];});}\n  function moneda2(n){ return 'Bs '+Number(n||0).toLocaleString('es-BO'); }\n  var estilos=document.createElement('style');\n  estilos.textContent='.clientes-integrados{margin-bottom:20px}.clientes-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.cliente-kpi{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px}.cliente-kpi strong{display:block;font-size:25px;color:#0b2f63;margin-bottom:4px}.cliente-kpi span{font-size:12px;color:#475569;font-weight:700}.clientes-tabla{width:100%;border-collapse:collapse;min-width:760px}.clientes-tabla th{background:#0b2f63;color:white;padding:10px}.clientes-tabla td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left}.clientes-scroll{overflow:auto}@media(max-width:900px){.clientes-kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.clientes-kpis{grid-template-columns:1fr}}';\n  document.head.appendChild(estilos);\n  var stats=document.querySelector('.estadisticas');\n  var panel=document.createElement('section');\n  panel.className='panel clientes-integrados';\n  panel.innerHTML='<h2>👥 RESUMEN INTEGRADO DE CLIENTES</h2><div class=\"clientes-kpis\"><div class=\"cliente-kpi\"><strong id=\"repTotalClientes\">0</strong><span>CLIENTES REGISTRADOS</span></div><div class=\"cliente-kpi\"><strong id=\"repClientesActivos\">0</strong><span>CLIENTES ACTIVOS</span></div><div class=\"cliente-kpi\"><strong id=\"repClientesConVentas\">0</strong><span>CLIENTES CON VENTAS EN EL PERIODO</span></div><div class=\"cliente-kpi\"><strong id=\"repTopCliente\">--</strong><span>CLIENTE DESTACADO DEL PERIODO</span></div></div><div class=\"clientes-scroll\"><table class=\"clientes-tabla\"><thead><tr><th>ID</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Ventas</th><th>Facturación del periodo</th></tr></thead><tbody id=\"tablaClientesIntegrada\"></tbody></table></div>';\n  if(stats && stats.parentNode) stats.insertAdjacentElement('afterend',panel);\n\n  function filtrarVentasActuales(){\n    var lista=leer('ventas');\n    var desde=(document.getElementById('fechaDesde')||{}).value||'';\n    var hasta=(document.getElementById('fechaHasta')||{}).value||'';\n    var metodo=(document.getElementById('filtroMetodo')||{}).value||'';\n    var estado=(document.getElementById('filtroEstado')||{}).value||'';\n    return lista.filter(function(v){return (!desde||v.fecha>=desde)&&(!hasta||v.fecha<=hasta)&&(!metodo||v.metodo===metodo)&&(!estado||v.estado===estado);});\n  }\n  function renderClientesReporte(){\n    var clientes=leer('clientes'), vs=filtrarVentasActuales();\n    var activos=clientes.filter(function(c){return c.estado==='Activo';}).length;\n    var datos={};\n    vs.forEach(function(v){\n      var key=v.clienteId?'id:'+v.clienteId:'nm:'+norm(v.cliente);\n      if(!datos[key]) datos[key]={ventas:0,total:0,nombre:v.cliente};\n      datos[key].ventas++; datos[key].total+=Number(v.total||0);\n    });\n    var conVentas=0, topNombre='--', topValor=-1;\n    var filas=clientes.map(function(c){\n      var d=datos['id:'+c.id]||datos['nm:'+norm(c.nombre)]||{ventas:0,total:0};\n      if(d.ventas>0) conVentas++;\n      if(d.total>topValor){topValor=d.total;topNombre=d.total>0?c.nombre:'--';}\n      return {c:c,d:d};\n    }).sort(function(a,b){return b.d.total-a.d.total;});\n    document.getElementById('repTotalClientes').textContent=clientes.length;\n    document.getElementById('repClientesActivos').textContent=activos;\n    document.getElementById('repClientesConVentas').textContent=conVentas;\n    document.getElementById('repTopCliente').textContent=topNombre;\n    var tb=document.getElementById('tablaClientesIntegrada'); tb.innerHTML='';\n    if(!filas.length){ tb.innerHTML='<tr><td colspan=\"6\">No hay clientes registrados.</td></tr>'; return; }\n    filas.forEach(function(x){\n      var tr=document.createElement('tr');\n      tr.innerHTML='<td>'+esc(x.c.id||'')+'</td><td>'+esc(x.c.nombre||'')+'</td><td>'+esc(x.c.tipo||'')+'</td><td>'+esc(x.c.estado||'')+'</td><td>'+x.d.ventas+'</td><td>'+moneda2(x.d.total)+'</td>';\n      tb.appendChild(tr);\n    });\n  }\n  var generarBase=typeof generarReporte==='function'?generarReporte:null;\n  if(generarBase){\n    generarReporte=function(){\n      var actuales=leer('ventas'); if(Array.isArray(actuales)) ventas=actuales;\n      generarBase(); renderClientesReporte();\n    };\n  }\n  exportarReporte=function(){\n    var vs=leer('ventas'), cls=leer('clientes');\n    function csv(v){return '\"'+String(v==null?'':v).replace(/\"/g,'\"\"')+'\"';}\n    var out='REPORTE INTEGRADO PROACTIVA TU NEGOCIO\\n\\nVENTAS\\nFecha,Cliente,Producto,Cantidad,Total,Metodo,Estado\\n';\n    vs.forEach(function(v){out+=[v.fecha,v.cliente,v.producto,v.cantidad,v.total,v.metodo,v.estado].map(csv).join(',')+'\\n';});\n    out+='\\nCLIENTES\\nID,Nombre,Tipo,Telefono,Correo,Estado,Facturado\\n';\n    cls.forEach(function(c){out+=[c.id,c.nombre,c.tipo,c.telefono,c.correo,c.estado,c.facturado||0].map(csv).join(',')+'\\n';});\n    var archivo=new Blob([out],{type:'text/csv;charset=utf-8;'}), url=URL.createObjectURL(archivo), a=document.createElement('a');\n    a.href=url; a.download='Reporte_Integrado_Proactiva.csv'; a.click(); URL.revokeObjectURL(url);\n  };\n  if(typeof generarReporte==='function') generarReporte(); else renderClientesReporte();\n})();\n<\/script>\n\n<script>\n(function(){\n  function normalizar(s){\n    return (s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n  }\n  document.addEventListener('click', function(ev){\n    var a = ev.target.closest && ev.target.closest('a');\n    if(!a) return;\n    var texto = normalizar(a.textContent);\n    var href = normalizar(a.getAttribute('href') || '');\n    var pagina = null;\n    if(texto.includes('inicio') || href.includes('index')) pagina='inicio';\n    else if(texto.includes('produccion') || href.includes('produccion')) pagina='produccion';\n    else if(texto.includes('pedidos') || href.includes('pedidos')) pagina='pedidos';\n    else if(texto.includes('clientes') || href.includes('clientes')) pagina='clientes';\n    else if(texto.includes('ventas') || href.includes('ventas')) pagina='ventas';\n    else if(texto.includes('reportes') || href.includes('reportes')) pagina='reportes';\n    if(pagina){\n      ev.preventDefault();\n      ev.stopPropagation();\n      parent.postMessage({type:'proactiva-nav', page:pagina}, '*');\n    }\n  }, true);\n  parent.postMessage({type:'proactiva-ready', page: document.title || ''}, '*');\n})();\n<\/script>\n</body>\n</html>"};
const CLIENTES_INICIALES=[{"id": "CLI-0001", "nombre": "Empresa A", "tipo": "Empresa", "telefono": "71234567", "correo": "contacto@empresaa.com", "direccion": "La Paz", "documento": "1234567012", "estado": "Activo", "facturado": 0, "fecha": "__HOY__", "observaciones": ""}, {"id": "CLI-0002", "nombre": "Empresa B", "tipo": "Empresa", "telefono": "72345678", "correo": "info@empresab.com", "direccion": "El Alto", "documento": "2234567015", "estado": "Activo", "facturado": 0, "fecha": "__HOY__", "observaciones": ""}, {"id": "CLI-0003", "nombre": "Cliente Particular C", "tipo": "Particular", "telefono": "73456789", "correo": "cliente@gmail.com", "direccion": "La Paz", "documento": "6754321", "estado": "Activo", "facturado": 0, "fecha": "__HOY__", "observaciones": ""}, {"id": "CLI-0004", "nombre": "Empresa D", "tipo": "Empresa", "telefono": "74567890", "correo": "ventas@empresad.com", "direccion": "Cochabamba", "documento": "4556677001", "estado": "Activo", "facturado": 0, "fecha": "__HOY__", "observaciones": ""}, {"id": "CLI-0005", "nombre": "Cliente Particular E", "tipo": "Particular", "telefono": "75678901", "correo": "cliente.e@gmail.com", "direccion": "El Alto", "documento": "6876543", "estado": "Inactivo", "facturado": 0, "fecha": "__HOY__", "observaciones": ""}];

function seguroLeer(k){try{let d=JSON.parse(localStorage.getItem(k));return Array.isArray(d)?d:null}catch(e){return null}}
function seguroGuardar(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function inicializarDatosCompartidos(){
  const hoy=new Date().toISOString().split('T')[0];
  if(seguroLeer('clientes')===null){seguroGuardar('clientes',CLIENTES_INICIALES.map(c=>Object.assign({},c,{fecha:c.fecha==='__HOY__'?hoy:c.fecha})))}
  if(seguroLeer('ventas')===null) seguroGuardar('ventas',VENTAS_INICIALES);
  sincronizarFacturacion();
}
function sincronizarFacturacion(){
  let clientes=seguroLeer('clientes'), ventas=seguroLeer('ventas'); if(!clientes||!ventas) return;
  const normal=s=>String(s||'').trim().toLowerCase(); const totales={}; let cambioVentas=false;
  ventas.forEach(v=>{let c=v.clienteId?clientes.find(x=>x.id===v.clienteId):clientes.find(x=>normal(x.nombre)===normal(v.cliente));if(c){if(v.clienteId!==c.id||v.cliente!==c.nombre){v.clienteId=c.id;v.cliente=c.nombre;cambioVentas=true}totales[c.id]=(totales[c.id]||0)+Number(v.total||0)}});
  clientes.forEach(c=>{c.facturado=Number(totales[c.id]||0)}); seguroGuardar('clientes',clientes); if(cambioVentas)seguroGuardar('ventas',ventas);
}
let paginaActual='inicio';
const frame=document.getElementById('appFrame');
const menuGlobal=Array.from(document.querySelectorAll('#menuGlobal [data-page]'));

function actualizarMenuGlobal(pagina){
  menuGlobal.forEach(function(a){
    a.classList.toggle('active',a.getAttribute('data-page')===pagina);
  });
}

function prepararModulo(){
  try{
    const doc=frame.contentDocument||(frame.contentWindow&&frame.contentWindow.document);
    if(!doc||!doc.head) return;
    let estilo=doc.getElementById('proactiva-shell-unico');
    if(!estilo){
      estilo=doc.createElement('style');
      estilo.id='proactiva-shell-unico';
      estilo.textContent=`
        /* El encabezado y menú reales están en la plataforma principal. */
        body > header,
        body > header.header,
        body > header.encabezado,
        body > aside.sidebar,
        body > .sidebar,
        .main > header.header,
        .main > .header,
        .contenedor > aside.sidebar { display:none !important; }

        html,body { min-height:100% !important; }
        body { overflow-x:hidden !important; }

        .main-content {
          margin-left:0 !important;
          padding:30px !important;
          min-height:100vh !important;
        }
        .main {
          margin-left:0 !important;
          padding-top:0 !important;
          min-height:100vh !important;
        }
        .contenedor {
          display:block !important;
          width:100% !important;
          min-height:100vh !important;
        }
        main.contenido,
        .contenido {
          width:100% !important;
          min-height:100vh !important;
          padding:30px !important;
          box-sizing:border-box !important;
        }

        @media (max-width:720px){
          .main-content,.content,main.contenido,.contenido{padding:16px !important;}
          .main{margin-left:0 !important;padding-top:0 !important;}
        }
      `;
      doc.head.appendChild(estilo);
    }
    // Por seguridad, ocultamos también elementos que algunos módulos colocan dinámicamente.
    doc.querySelectorAll('body > header, body > aside.sidebar, .main > header.header, .contenedor > aside.sidebar').forEach(function(el){
      el.style.setProperty('display','none','important');
    });
  }catch(e){ console.warn('No se pudo aplicar el diseño común:',e); }
}

frame.addEventListener('load',prepararModulo);

menuGlobal.forEach(function(a){
  a.addEventListener('click',function(ev){
    ev.preventDefault();
    cargarPagina(a.getAttribute('data-page'));
  });
});

function cargarPagina(pagina){
  if(!MODULOS[pagina]) pagina='inicio';
  sincronizarFacturacion();
  paginaActual=pagina;
  actualizarMenuGlobal(pagina);
  document.title='Proactiva Tu Negocio - '+pagina.charAt(0).toUpperCase()+pagina.slice(1);
  document.getElementById('cargando').style.display='flex';
  frame.srcdoc=MODULOS[pagina];
}

window.addEventListener('message',function(e){
  if(!e.data||typeof e.data!=='object') return;
  if(e.data.type==='proactiva-nav') cargarPagina(e.data.page);
  if(e.data.type==='proactiva-data-changed') sincronizarFacturacion();
});
window.addEventListener('storage',function(e){
  if(e.key==='ventas'||e.key==='clientes') sincronizarFacturacion();
});

frame.addEventListener('load',function(){
  prepararModulo();
  document.getElementById('cargando').style.display='none';
});

inicializarDatosCompartidos();
cargarPagina('inicio');
