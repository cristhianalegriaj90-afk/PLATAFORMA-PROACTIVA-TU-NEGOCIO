===== -->\n<main class=\"main\">\n<div class=\"content\">\n<section class=\"page-title\">\n<h2>\nCLIENTES\n</h2>\n<p>\nGESTIÓN Y CONTROL DE CLIENTES\n</p>\n</section>\n<!-- =========================================================\n     TARJETAS\n========================================================= -->\n<section class=\"stats-grid\">\n<div class=\"stat-card\">\n<div class=\"stat-icon icon-clientes\">\n👥\n</div>\n<div class=\"stat-info\">\n<h3>\nTOTAL CLIENTES\n</h3>\n<div class=\"stat-number\" id=\"totalClientes\">\n0\n</div>\n<p>\nRegistrados\n</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon icon-activos\">\n✓\n</div>\n<div class=\"stat-info\">\n<h3>\nCLIENTES ACTIVOS\n</h3>\n<div class=\"stat-number\" id=\"clientesActivos\">\n0\n</div>\n<p>\nActivos\n</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon icon-nuevos\">\n👤+\n</div>\n<div class=\"stat-info\">\n<h3>\nNUEVOS ESTE MES\n</h3>\n<div class=\"stat-number\" id=\"clientesNuevos\">\n0\n</div>\n<p>\nNuevos\n</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon icon-facturado\">\nBs\n</div>\n<div class=\"stat-info\">\n<h3>\nTOTAL FACTURADO\n</h3>\n<div class=\"stat-number\" id=\"totalFacturado\">\nBs 0\n</div>\n<p>\nAcumulado\n</p>\n</div>\n</div>\n</section>\n<!-- =========================================================\n     FILTROS Y ACCIONES\n========================================================= -->\n<section class=\"top-grid\">\n<div class=\"panel\">\n<div class=\"panel-title\">\n\n🔍 BUSCAR Y FILTRAR\n\n</div>\n<div class=\"filters\">\n<input class=\"control\" id=\"buscarCliente\" oninput=\"renderizarClientes()\" placeholder=\"Buscar por nombre, empresa, teléfono...\" type=\"text\"/>\n<select class=\"control\" id=\"filtroEstado\" onchange=\"renderizarClientes()\">\n<option value=\"\">\nTodos los estados\n</option>\n<option value=\"Activo\">\nActivo\n</option>\n<option value=\"Inactivo\">\nInactivo\n</option>\n</select>\n<select class=\"control\" id=\"filtroTipo\" onchange=\"renderizarClientes()\">\n<option value=\"\">\nTodos los tipos\n</option>\n<option value=\"Empresa\">\nEmpresa\n</option>\n<option value=\"Particular\">\nParticular\n</option>\n</select>\n<button class=\"btn btn-gray\" onclick=\"limpiarFiltros()\">\n\nLimpiar filtros\n\n</button>\n</div>\n</div>\n<div class=\"panel\">\n<div class=\"panel-title\">\n\n⚙ ACCIONES\n\n</div>\n<div class=\"actions\">\n<button class=\"btn btn-green\" onclick=\"nuevoCliente()\">\n\n＋ Nuevo Cliente\n\n</button>\n<button class=\"btn btn-blue\" onclick=\"exportarClientes()\">\n\n⬇ Exportar Excel\n\n</button>\n<button class=\"btn btn-purple\" onclick=\"window.print()\">\n\n🖨 Imprimir\n\n</button>\n<button class=\"btn btn-orange\" onclick=\"actualizarTodo()\">\n\n⟳ Actualizar\n\n</button>\n</div>\n</div>\n</section>\n<!-- =========================================================\n     LISTA DE CLIENTES\n========================================================= -->\n<section class=\"panel clients-panel\">\n<div class=\"panel-title\">\n\nLISTA DE CLIENTES\n\n</div>\n<div class=\"table-wrap\">\n<table>\n<thead>\n<tr>\n<th>ID</th>\n<th>\nNombre / Empresa\n</th>\n<th>Tipo</th>\n<th>Teléfono</th>\n<th>Correo</th>\n<th>Estado</th>\n<th>Acciones</th>\n</tr>\n</thead>\n<tbody id=\"tablaClientes\">\n</tbody>\n</table>\n</div>\n<div class=\"pagination-area\">\n<span id=\"contadorRegistros\">\n0 clientes\n</span>\n<div class=\"pagination\" id=\"paginacion\">\n</div>\n</div>\n</section>\n</div>\n</main>\n<!-- =========================================================\n     MODAL NUEVO / EDITAR CLIENTE\n========================================================= -->\n<div class=\"modal\" id=\"modalCliente\">\n<div class=\"modal-box\">\n<div class=\"modal-header\">\n<h3 id=\"tituloModal\">\n\nNUEVO CLIENTE\n\n</h3>\n<button class=\"modal-close\" onclick=\"cerrarModal()\">\n\n×\n\n</button>\n</div>\n<form id=\"formCliente\" onsubmit=\"guardarCliente(event)\">\n<div class=\"modal-body\">\n<div class=\"form-grid\">\n<div class=\"form-group\">\n<label>\nNombre / Empresa *\n</label>\n<input id=\"nombreCliente\" required=\"\"/>\n</div>\n<div class=\"form-group\">\n<label>\nTipo de cliente *\n</label>\n<select id=\"tipoCliente\">\n<option value=\"Empresa\">\nEmpresa\n</option>\n<option value=\"Particular\">\nParticular\n</option>\n</select>\n</div>\n<div class=\"form-group\">\n<label>\nTeléfono\n</label>\n<input id=\"telefonoCliente\" placeholder=\"Ej: 76543210\"/>\n</div>\n<div class=\"form-group\">\n<label>\nCorreo electrónico\n</label>\n<input id=\"correoCliente\" placeholder=\"correo@empresa.com\" type=\"email\"/>\n</div>\n<div class=\"form-group full\">\n<label>\nDirección\n</label>\n<input id=\"direccionCliente\" placeholder=\"Dirección del cliente\"/>\n</div>\n<div class=\"form-group\">\n<label>\nNIT / CI\n</label>\n<input id=\"documentoCliente\"/>\n</div>\n<div class=\"form-group\">\n<label>\nEstado\n</label>\n<select id=\"estadoCliente\">\n<option value=\"Activo\">\nActivo\n</option>\n<option value=\"Inactivo\">\nInactivo\n</option>\n</select>\n</div>\n<div class=\"form-group\">\n<label>\nTotal facturado (Bs)\n</label>\n<input id=\"facturadoCliente\" min=\"0\" step=\"0.01\" type=\"number\" value=\"0\"/>\n</div>\n<div class=\"form-group\">\n<label>\nFecha de registro\n</label>\n<input id=\"fechaCliente\" type=\"date\"/>\n</div>\n<div class=\"form-group full\">\n<label>\nObservaciones\n</label>\n<textarea id=\"observacionesCliente\">\n</textarea>\n</div>\n</div>\n</div>\n<div class=\"modal-footer\">\n<button class=\"btn btn-gray\" onclick=\"cerrarModal()\" type=\"button\">\n\nCancelar\n\n</button>\n<button class=\"btn btn-green\" type=\"submit\">\n\n💾 Guardar Cliente\n\n</button>\n</div>\n</form>\n</div>\n</div>\n<!-- =========================================================\n     MODAL DETALLE CLIENTE\n========================================================= -->\n<div class=\"modal\" id=\"modalDetalle\">\n<div class=\"modal-box\">\n<div class=\"modal-header\">\n<h3>\nDETALLE DEL CLIENTE\n</h3>\n<button class=\"modal-close\" onclick=\"cerrarDetalle()\">\n\n×\n\n</button>\n</div>\n<div class=\"modal-body\" id=\"detalleCliente\">\n</div>\n<div class=\"modal-footer\">\n<button class=\"btn btn-blue\" onclick=\"cerrarDetalle()\">\n\nCerrar\n\n</button>\n</div>\n</div>\n</div>\n<script>\n\n\n/* =========================================================\n   VARIABLES\n========================================================= */\n\nconst CLAVE_CLIENTES =\n\"clientes\";\n\n\nlet clienteEditandoId =\nnull;\n\n\nlet paginaActual =\n1;\n\n\nconst registrosPorPagina =\n5;\n\n\n\n/* =========================================================\n   OBTENER CLIENTES\n========================================================= */\n\nfunction obtenerClientes(){\n\n    try{\n\n        const datos =\n        JSON.parse(\n            localStorage.getItem(\n                CLAVE_CLIENTES\n            )\n        );\n\n        return Array.isArray(datos)\n        ? datos\n        : [];\n\n    }catch(error){\n\n        return [];\n\n    }\n\n}\n\n\n\n/* =========================================================\n   GUARDAR CLIENTES\n========================================================= */\n\nfunction guardarClientes(datos){\n\n    localStorage.setItem(\n        CLAVE_CLIENTES,\n        JSON.stringify(datos)\n    );\n\n}\n\n\n\n/* =========================================================\n   FECHA ACTUAL\n========================================================= */\n\nfunction hoyISO(){\n\n    const hoy =\n    new Date();\n\n    const anio =\n    hoy.getFullYear();\n\n    const mes =\n    String(\n        hoy.getMonth()+1\n    ).padStart(2,\"0\");\n\n    const dia =\n    String(\n        hoy.getDate()\n    ).padStart(2,\"0\");\n\n    return (\n        anio +\n        \"-\" +\n        mes +\n        \"-\" +\n        dia\n    );\n\n}\n\n\n\n/* =========================================================\n   FORMATEAR MONEDA\n========================================================= */\n\nfunction moneda(valor){\n\n    return Number(\n        valor || 0\n    ).toLocaleString(\n        \"es-BO\",\n        {\n            minimumFractionDigits:2,\n            maximumFractionDigits:2\n        }\n    );\n\n}\n\n\n\n/* =========================================================\n   GENERAR ID\n========================================================= */\n\nfunction generarIdCliente(){\n\n    const clientes =\n    obtenerClientes();\n\n\n    let mayor =\n    0;\n\n\n    clientes.forEach(\n        function(cliente){\n\n            const numero =\n            Number(\n                String(\n                    cliente.id\n                )\n                .replace(\n                    \"CLI-\",\n                    \"\"\n                )\n            );\n\n\n            if(numero > mayor){\n\n                mayor =\n                numero;\n\n            }\n\n        }\n    );\n\n\n    return (\n        \"CLI-\" +\n        String(\n            mayor + 1\n        ).padStart(\n            4,\n            \"0\"\n        )\n    );\n\n}\n\n\n\n/* =========================================================\n   NUEVO CLIENTE\n========================================================= */\n\nfunction nuevoCliente(){\n\n    clienteEditandoId =\n    null;\n\n\n    document\n    .getElementById(\n        \"tituloModal\"\n    )\n    .innerText =\n    \"NUEVO CLIENTE\";\n\n\n    document\n    .getElementById(\n        \"formCliente\"\n    )\n    .reset();\n\n\n    document\n    .getElementById(\n        \"fechaCliente\"\n    )\n    .value =\n    hoyISO();\n\n\n    document\n    .getElementById(\n        \"estadoCliente\"\n    )\n    .value =\n    \"Activo\";\n\n\n    document\n    .getElementById(\n        \"facturadoCliente\"\n    )\n    .value =\n    0;\n\n\n    document\n    .getElementById(\n        \"modalCliente\"\n    )\n    .classList\n    .add(\"show\");\n\n}\n\n\n\n/* =========================================================\n   CERRAR MODAL\n========================================================= */\n\nfunction cerrarModal(){\n\n    document\n    .getElementById(\n        \"modalCliente\"\n    )\n    .classList\n    .remove(\"show\");\n\n}\n\n\n\n/* =========================================================\n   GUARDAR CLIENTE\n========================================================= */\n\nfunction guardarCliente(event){\n\n    event.preventDefault();\n\n\n    const nombre =\n    document\n    .getElementById(\n        \"nombreCliente\"\n    )\n    .value\n    .trim();\n\n\n    if(nombre === \"\"){\n\n        alert(\n            \"Debe ingresar el nombre del cliente.\"\n        );\n\n        return;\n\n    }\n\n\n    let clientes =\n    obtenerClientes();\n\n\n    const cliente = {\n\n        id:\n        clienteEditandoId ||\n        generarIdCliente(),\n\n        nombre:nombre,\n\n        tipo:\n        document\n        .getElementById(\n            \"tipoCliente\"\n        )\n        .value,\n\n        telefono:\n        document\n        .getElementById(\n            \"telefonoCliente\"\n        )\n        .value,\n\n        correo:\n        document\n        .getElementById(\n            \"correoCliente\"\n        )\n        .value,\n\n        direccion:\n        document\n        .getElementById(\n            \"direccionCliente\"\n        )\n        .value,\n\n        documento:\n        document\n        .getElementById(\n            \"documentoCliente\"\n        )\n        .value,\n\n        estado:\n        document\n        .getElementById(\n            \"estadoCliente\"\n        )\n        .value,\n\n        facturado:\n        Number(\n            document\n            .getElementById(\n                \"facturadoCliente\"\n            )\n            .value\n        ) || 0,\n\n        fecha:\n        document\n        .getElementById(\n            \"fechaCliente\"\n        )\n        .value,\n\n        observaciones:\n        document\n        .getElementById(\n            \"observacionesCliente\"\n        )\n        .value\n\n    };\n\n\n    if(clienteEditandoId){\n\n        const indice =\n        clientes\n        .findIndex(\n            c =>\n            c.id ===\n            clienteEditandoId\n        );\n\n\n        if(indice !== -1){\n\n            clientes[indice] =\n            cliente;\n\n        }\n\n    }else{\n\n        clientes.push(\n            cliente\n        );\n\n    }\n\n\n    guardarClientes(\n        clientes\n    );\n\n\n    cerrarModal();\n\n\n    clienteEditandoId =\n    null;\n\n\n    paginaActual =\n    1;\n\n\n    actualizarTodo();\n\n\n    alert(\n        \"Cliente guardado correctamente.\"\n    );\n\n}\n\n\n\n/* =========================================================\n   EDITAR CLIENTE\n========================================================= */\n\nfunction editarCliente(id){\n\n    const clientes =\n    obtenerClientes();\n\n\n    const cliente =\n    clientes.find(\n        c =>\n        c.id === id\n    );\n\n\n    if(!cliente){\n\n        return;\n\n    }\n\n\n    clienteEditandoId =\n    id;\n\n\n    document\n    .getElementById(\n        \"tituloModal\"\n    )\n    .innerText =\n    \"EDITAR CLIENTE\";\n\n\n    document\n    .getElementById(\n        \"nombreCliente\"\n    )\n    .value =\n    cliente.nombre || \"\";\n\n\n    document\n    .getElementById(\n        \"tipoCliente\"\n    )\n    .value =\n    cliente.tipo ||\n    \"Empresa\";\n\n\n    document\n    .getElementById(\n        \"telefonoCliente\"\n    )\n    .value =\n    cliente.telefono || \"\";\n\n\n    document\n    .getElementById(\n        \"correoCliente\"\n    )\n    .value =\n    cliente.correo || \"\";\n\n\n    document\n    .getElementById(\n        \"direccionCliente\"\n    )\n    .value =\n    cliente.direccion || \"\";\n\n\n    document\n    .getElementById(\n        \"documentoCliente\"\n    )\n    .value =\n    cliente.documento || \"\";\n\n\n    document\n    .getElementById(\n        \"estadoCliente\"\n    )\n    .value =\n    cliente.estado ||\n    \"Activo\";\n\n\n    document\n    .getElementById(\n        \"facturadoCliente\"\n    )\n    .value =\n    cliente.facturado || 0;\n\n\n    document\n    .getElementById(\n        \"fechaCliente\"\n    )\n    .value =\n    cliente.fecha ||\n    hoyISO();\n\n\n    document\n    .getElementById(\n        \"observacionesCliente\"\n    )\n    .value =\n    cliente.observaciones || \"\";\n\n\n    document\n    .getElementById(\n        \"modalCliente\"\n    )\n    .classList\n    .add(\"show\");\n\n}\n\n\n\n/* =========================================================\n   ELIMINAR CLIENTE\n========================================================= */\n\nfunction eliminarCliente(id){\n\n    const confirmar =\n    confirm(\n        \"¿Está seguro de eliminar este cliente?\"\n    );\n\n\n    if(!confirmar){\n\n        return;\n\n    }\n\n\n    let clientes =\n    obtenerClientes();\n\n\n    clientes =\n    clientes.filter(\n        c =>\n        c.id !== id\n    );\n\n\n    guardarClientes(\n        clientes\n    );\n\n\n    actualizarTodo();\n\n}\n\n\n\n/* =========================================================\n   VER DETALLE\n========================================================= */\n\nfunction verCliente(id){\n\n    const cliente =\n    obtenerClientes()\n    .find(\n        c =>\n        c.id === id\n    );\n\n\n    if(!cliente){\n\n        return;\n\n    }\n\n\n    document\n    .getElementById(\n        \"detalleCliente\"\n    )\n    .innerHTML = `\n\n    <div class=\"detail-grid\">\n\n    <strong>ID:</strong>\n    <span>${cliente.id}</span>\n\n    <strong>Nombre / Empresa:</strong>\n    <span>${cliente.nombre}</span>\n\n    <strong>Tipo:</strong>\n    <span>${cliente.tipo}</span>\n\n    <strong>Teléfono:</strong>\n    <span>${cliente.telefono || \"-\"}</span>\n\n    <strong>Correo:</strong>\n    <span>${cliente.correo || \"-\"}</span>\n\n    <strong>Dirección:</strong>\n    <span>${cliente.direccion || \"-\"}</span>\n\n    <strong>NIT / CI:</strong>\n    <span>${cliente.documento || \"-\"}</span>\n\n    <strong>Estado:</strong>\n    <span>${cliente.estado}</span>\n\n    <strong>Total facturado:</strong>\n    <span>\n    Bs ${moneda(cliente.facturado)}\n    </span>\n\n    <strong>Fecha registro:</strong>\n    <span>${cliente.fecha || \"-\"}</span>\n\n    <strong>Observaciones:</strong>\n    <span>\n    ${cliente.observaciones || \"-\"}\n    </span>\n\n    </div>\n\n    `;\n\n\n    document\n    .getElementById(\n        \"modalDetalle\"\n    )\n    .classList\n    .add(\"show\");\n\n}\n\n\n\n/* =========================================================\n   CERRAR DETALLE\n========================================================= */\n\nfunction cerrarDetalle(){\n\n    document\n    .getElementById(\n        \"modalDetalle\"\n    )\n    .classList\n    .remove(\"show\");\n\n}\n\n\n\n/* =========================================================\n   FILTRAR CLIENTES\n========================================================= */\n\nfunction obtenerClientesFiltrados(){\n\n    const texto =\n    document\n    .getElementById(\n        \"buscarCliente\"\n    )\n    .value\n    .toLowerCase()\n    .trim();\n\n\n    const estado =\n    document\n    .getElementById(\n        \"filtroEstado\"\n    )\n    .value;\n\n\n    const tipo =\n    document\n    .getElementById(\n        \"filtroTipo\"\n    )\n    .value;\n\n\n    return obtenerClientes()\n    .filter(\n        function(cliente){\n\n            const contenido =\n            (\n                cliente.id +\n                \" \" +\n                cliente.nombre +\n                \" \" +\n                cliente.telefono +\n                \" \" +\n                cliente.correo\n            )\n            .toLowerCase();\n\n\n            const coincideTexto =\n            !texto ||\n            contenido.includes(\n                texto\n            );\n\n\n            const coincideEstado =\n            !estado ||\n            cliente.estado === estado;\n\n\n            const coincideTipo =\n            !tipo ||\n            cliente.tipo === tipo;\n\n\n            return (\n                coincideTexto &&\n                coincideEstado &&\n                coincideTipo\n            );\n\n        }\n    );\n\n}\n\n\n\n/* =========================================================\n   RENDERIZAR CLIENTES\n========================================================= */\n\nfunction renderizarClientes(){\n\n    const tabla =\n    document\n    .getElementById(\n        \"tablaClientes\"\n    );\n\n\n    tabla.innerHTML =\n    \"\";\n\n\n    const clientes =\n    obtenerClientesFiltrados();\n\n\n    const totalPaginas =\n    Math.max(\n        1,\n        Math.ceil(\n            clientes.length /\n            registrosPorPagina\n        )\n    );\n\n\n    if(\n        paginaActual >\n        totalPaginas\n    ){\n\n        paginaActual =\n        totalPaginas;\n\n    }\n\n\n    const inicio =\n    (\n        paginaActual - 1\n    ) *\n    registrosPorPagina;\n\n\n    const fin =\n    inicio +\n    registrosPorPagina;\n\n\n    const clientesPagina =\n    clientes.slice(\n        inicio,\n        fin\n    );\n\n\n    clientesPagina\n    .forEach(\n        function(cliente){\n\n            const fila =\n            document\n            .createElement(\n                \"tr\"\n            );\n\n\n            const claseEstado =\n            cliente.estado ===\n            \"Activo\"\n            ?\n            \"status-activo\"\n            :\n            \"status-inactivo\";\n\n\n            fila.innerHTML = `\n\n            <td>\n            ${cliente.id}\n            </td>\n\n            <td class=\"nombre-cliente\">\n            ${cliente.nombre}\n            </td>\n\n            <td>\n            ${cliente.tipo}\n            </td>\n\n            <td>\n            ${cliente.telefono || \"-\"}\n            </td>\n\n            <td>\n            ${cliente.correo || \"-\"}\n            </td>\n\n            <td>\n\n            <span\n            class=\"\n            status\n            ${claseEstado}\n            \">\n\n            ${cliente.estado}\n\n            </span>\n\n            </td>\n\n            <td>\n\n            <div class=\"row-actions\">\n\n            <button\n            class=\"icon-btn view\"\n            onclick=\"\n            verCliente('${cliente.id}')\n            \"\n            title=\"Ver\">\n\n            👁\n\n            </button>\n\n\n            <button\n            class=\"icon-btn edit\"\n            onclick=\"\n            editarCliente('${cliente.id}')\n            \"\n            title=\"Editar\">\n\n            ✎\n\n            </button>\n\n\n            <button\n            class=\"icon-btn delete\"\n            onclick=\"\n            eliminarCliente('${cliente.id}')\n            \"\n            title=\"Eliminar\">\n\n            🗑\n\n            </button>\n\n            </div>\n\n            </td>\n\n            `;\n\n\n            tabla.appendChild(\n                fila\n            );\n\n        }\n    );\n\n\n    document\n    .getElementById(\n        \"contadorRegistros\"\n    )\n    .innerText =\n\n    clientes.length === 0\n\n    ?\n\n    \"No hay clientes registrados\"\n\n    :\n\n    \"Mostrando \" +\n    (inicio + 1) +\n    \" a \" +\n    Math.min(\n        fin,\n        clientes.length\n    ) +\n    \" de \" +\n    clientes.length +\n    \" clientes\";\n\n\n    renderizarPaginacion(\n        totalPaginas\n    );\n\n}\n\n\n\n/* =========================================================\n   PAGINACIÓN\n========================================================= */\n\nfunction renderizarPaginacion(\n    totalPaginas\n){\n\n    const contenedor =\n    document\n    .getElementById(\n        \"paginacion\"\n    );\n\n\n    contenedor.innerHTML =\n    \"\";\n\n\n    if(totalPaginas <= 1){\n\n        return;\n\n    }\n\n\n    for(\n        let i = 1;\n        i <= totalPaginas;\n        i++\n    ){\n\n        const boton =\n        document\n        .createElement(\n            \"button\"\n        );\n\n\n        boton.className =\n        \"page-btn\";\n\n\n        if(\n            i === paginaActual\n        ){\n\n            boton.classList\n            .add(\"active\");\n\n        }\n\n\n        boton.innerText =\n        i;\n\n\n        boton.onclick =\n        function(){\n\n            paginaActual =\n            i;\n\n            renderizarClientes();\n\n        };\n\n\n        contenedor\n        .appendChild(\n            boton\n        );\n\n    }\n\n}\n\n\n\n/* =========================================================\n   LIMPIAR FILTROS\n========================================================= */\n\nfunction limpiarFiltros(){\n\n    document\n    .getElementById(\n        \"buscarCliente\"\n    )\n    .value =\n    \"\";\n\n\n    document\n    .getElementById(\n        \"filtroEstado\"\n    )\n    .value =\n    \"\";\n\n\n    document\n    .getElementById(\n        \"filtroTipo\"\n    )\n    .value =\n    \"\";\n\n\n    paginaActual =\n    1;\n\n\n    renderizarClientes();\n\n}\n\n\n\n/* =========================================================\n   ACTUALIZAR TARJETAS\n========================================================= */\n\nfunction actualizarTarjetas(){\n\n    const clientes =\n    obtenerClientes();\n\n\n    const activos =\n    clientes.filter(\n        c =>\n        c.estado ===\n        \"Activo\"\n    );\n\n\n    const ahora =\n    new Date();\n\n\n    const anio =\n    ahora.getFullYear();\n\n\n    const mes =\n    ahora.getMonth() + 1;\n\n\n    const nuevos =\n    clientes.filter(\n        function(c){\n\n            if(!c.fecha){\n\n                return false;\n\n            }\n\n\n            const partes =\n            c.fecha.split(\"-\");\n\n\n            return (\n                Number(\n                    partes[0]\n                ) === anio\n                &&\n                Number(\n                    partes[1]\n                ) === mes\n            );\n\n        }\n    );\n\n\n    const totalFacturado =\n    clientes.reduce(\n        function(acumulado,c){\n\n            return (\n                acumulado +\n                Number(\n                    c.facturado || 0\n                )\n            );\n\n        },\n        0\n    );\n\n\n    document\n    .getElementById(\n        \"totalClientes\"\n    )\n    .innerText =\n    clientes.length;\n\n\n    document\n    .getElementById(\n        \"clientesActivos\"\n    )\n    .innerText =\n    activos.length;\n\n\n    document\n    .getElementById(\n        \"clientesNuevos\"\n    )\n    .innerText =\n    nuevos.length;\n\n\n    document\n    .getElementById(\n        \"totalFacturado\"\n    )\n    .innerText =\n    \"Bs \" +\n    moneda(\n        totalFacturado\n    );\n\n}\n\n\n\n/* =========================================================\n   EXPORTAR CLIENTES\n========================================================= */\n\nfunction exportarClientes(){\n\n    const clientes =\n    obtenerClientes();\n\n\n    if(\n        clientes.length === 0\n    ){\n\n        alert(\n            \"No existen clientes para exportar.\"\n        );\n\n        return;\n\n    }\n\n\n    let contenido =\n\n    \"ID,Nombre o Empresa,Tipo,Telefono,Correo,Direccion,NIT CI,Estado,Facturado,Fecha\\n\";\n\n\n    clientes.forEach(\n        function(c){\n\n            contenido +=\n\n            `\"${c.id}\",` +\n\n            `\"${c.nombre}\",` +\n\n            `\"${c.tipo}\",` +\n\n            `\"${c.telefono || \"\"}\",` +\n\n            `\"${c.correo || \"\"}\",` +\n\n            `\"${c.direccion || \"\"}\",` +\n\n            `\"${c.documento || \"\"}\",` +\n\n            `\"${c.estado}\",` +\n\n            `\"${c.facturado || 0}\",` +\n\n            `\"${c.fecha || \"\"}\"\\n`;\n\n        }\n    );\n\n\n    const archivo =\n    new Blob(\n        [contenido],\n        {\n            type:\n            \"text/csv;charset=utf-8;\"\n        }\n    );\n\n\n    const enlace =\n    document\n    .createElement(\n        \"a\"\n    );\n\n\n    enlace.href =\n    URL.createObjectURL(\n        archivo\n    );\n\n\n    enlace.download =\n    \"Clientes_Proactiva.csv\";\n\n\n    enlace.click();\n\n\n    URL.revokeObjectURL(\n        enlace.href\n    );\n\n}\n\n\n\n/* =========================================================\n   ACTUALIZAR TODO\n========================================================= */\n\nfunction actualizarTodo(){\n\n    actualizarTarjetas();\n\n    renderizarClientes();\n\n}\n\n\n\n/* =========================================================\n   DATOS DE EJEMPLO SOLO LA PRIMERA VEZ\n========================================================= */\n\nfunction cargarEjemplos(){\n\n    const existentes =\n    obtenerClientes();\n\n\n    if(\n        existentes.length >\n        0\n    ){\n\n        return;\n\n    }\n\n\n    const ejemplos = [\n\n        {\n            id:\"CLI-0001\",\n            nombre:\"Empresa A\",\n            tipo:\"Empresa\",\n            telefono:\"71234567\",\n            correo:\n            \"contacto@empresaa.com\",\n            direccion:\n            \"La Paz\",\n            documento:\n            \"1234567012\",\n            estado:\"Activo\",\n            facturado:5500,\n            fecha:hoyISO(),\n            observaciones:\"\"\n        },\n\n        {\n            id:\"CLI-0002\",\n            nombre:\"Empresa B\",\n            tipo:\"Empresa\",\n            telefono:\"72345678\",\n            correo:\n            \"info@empresab.com\",\n            direccion:\n            \"El Alto\",\n            documento:\n            \"2234567015\",\n            estado:\"Activo\",\n            facturado:4200,\n            fecha:hoyISO(),\n            observaciones:\"\"\n        },\n\n        {\n            id:\"CLI-0003\",\n            nombre:\n            \"Cliente Particular C\",\n            tipo:\"Particular\",\n            telefono:\"73456789\",\n            correo:\n            \"cliente@gmail.com\",\n            direccion:\n            \"La Paz\",\n            documento:\n            \"6754321\",\n            estado:\"Activo\",\n            facturado:2700,\n            fecha:hoyISO(),\n            observaciones:\"\"\n        },\n\n        {\n            id:\"CLI-0004\",\n            nombre:\"Empresa D\",\n            tipo:\"Empresa\",\n            telefono:\"74567890\",\n            correo:\n            \"ventas@empresad.com\",\n            direccion:\n            \"Cochabamba\",\n            documento:\n            \"4556677001\",\n            estado:\"Activo\",\n            facturado:4800,\n            fecha:hoyISO(),\n            observaciones:\"\"\n        },\n\n        {\n            id:\"CLI-0005\",\n            nombre:\n            \"Cliente Particular E\",\n            tipo:\"Particular\",\n            telefono:\"75678901\",\n            correo:\n            \"cliente.e@gmail.com\",\n            direccion:\n            \"El Alto\",\n            documento:\n            \"6876543\",\n            estado:\"Inactivo\",\n            facturado:1550,\n            fecha:hoyISO(),\n            observaciones:\"\"\n        }\n\n    ];\n\n\n    guardarClientes(\n        ejemplos\n    );\n\n}\n\n\n\n/* =========================================================\n   INICIAR\n========================================================= */\n\ncargarEjemplos();\n\nactualizarTodo();\n\n\n<\/script>\n\n<script>\n(function(){\n  function leer(clave){\n    try{ var d=JSON.parse(localStorage.getItem(clave)); return Array.isArray(d)?d:[]; }catch(e){ return []; }\n  }\n  function guardar(clave, datos){\n    try{ localStorage.setItem(clave, JSON.stringify(datos)); }catch(e){}\n  }\n  function claveNombre(s){ return String(s||'').trim().toLowerCase(); }\n  function sincronizarFacturado(){\n    var ventas = leer('ventas');\n    if(!localStorage.getItem('ventas')) return;\n    var clientes = leer('clientes');\n    var totales = {};\n    ventas.forEach(function(v){\n      var key = v.clienteId ? 'id:'+v.clienteId : 'nm:'+claveNombre(v.cliente);\n      totales[key] = (totales[key]||0) + Number(v.total||0);\n    });\n    var cambio=false;\n    clientes.forEach(function(c){\n      var suma = totales['id:'+c.id];\n      if(suma == null) suma = totales['nm:'+claveNombre(c.nombre)] || 0;\n      if(Number(c.facturado||0)!==Number(suma)) { c.facturado=Number(suma); cambio=true; }\n    });\n    if(cambio) guardar('clientes', clientes);\n  }\n  var guardarBase = typeof guardarCliente==='function' ? guardarCliente : null;\n  if(guardarBase){\n    guardarCliente = function(event){\n      var idEditado = typeof clienteEditandoId!=='undefined' ? clienteEditandoId : null;\n      var antes = leer('clientes');\n      var previo = idEditado ? antes.find(function(c){return c.id===idEditado;}) : null;\n      var nombreAnterior = previo ? previo.nombre : '';\n      guardarBase(event);\n      var despues = leer('clientes');\n      if(idEditado){\n        var actualizado = despues.find(function(c){return c.id===idEditado;});\n        if(actualizado){\n          var ventas=leer('ventas'), cambio=false;\n          ventas.forEach(function(v){\n            if(v.clienteId===idEditado || (!v.clienteId && claveNombre(v.cliente)===claveNombre(nombreAnterior))){\n              v.clienteId=idEditado;\n              v.cliente=actualizado.nombre;\n              cambio=true;\n            }\n          });\n          if(cambio) guardar('ventas', ventas);\n        }\n      }\n      sincronizarFacturado();\n      if(typeof actualizarTodo==='function') actualizarTodo();\n      parent.postMessage({type:'proactiva-data-changed', area:'clientes'}, '*');\n    };\n  }\n  var eliminarBase = typeof eliminarCliente==='function' ? eliminarCliente : null;\n  if(eliminarBase){\n    eliminarCliente = function(id){\n      eliminarBase(id);\n      parent.postMessage({type:'proactiva-data-changed', area:'clientes'}, '*');\n    };\n  }\n  sincronizarFacturado();\n  if(typeof actualizarTodo==='function') actualizarTodo();\n})();\n<\/script>\n\n<script>\n(function(){\n  function normalizar(s){\n    return (s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n  }\n  document.addEventListener('click', function(ev){\n    var a = ev.target.closest && ev.target.closest('a');\n    if(!a) return;\n    var texto = normalizar(a.textContent);\n    var href = normalizar(a.getAttribute('href') || '');\n    var pagina = null;\n    if(texto.includes('inicio') || href.includes('index')) pagina='inicio';\n    else if(texto.includes('produccion') || href.includes('produccion')) pagina='produccion';\n    else if(texto.includes('pedidos') || href.includes('pedidos')) pagina='pedidos';\n    else if(texto.includes('clientes') || href.includes('clientes')) pagina='clientes';\n    else if(texto.includes('ventas') || href.includes('ventas')) pagina='ventas';\n    else if(texto.includes('reportes') || href.includes('reportes')) pagina='reportes';\n    if(pagina){\n      ev.preventDefault();\n      ev.stopPropagation();\n      parent.postMessage({type:'proactiva-nav', page:pagina}, '*');\n    }\n  }, true);\n  parent.postMessage({type:'proactiva-ready', page: document.title || ''}, '*');\n})();\n<\/script>\n</body>\n</html>", "ventas": "<!DOCTYPE html>\n\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Ventas - Proactiva Tu Negocio</title>\n<style>\n        * {\n            box-sizing: border-box;\n            margin: 0;\n            padding: 0;\n            font-family: Arial, sans-serif;\n        }\n\n        body {\n            background: hsl(40, 39%, 91%);\n            color: #222;\n        }\n\n        /* =========================\n           ENCABEZADO\n        ========================== */\n\n        .header {\n            height: 112px;\n            background: #0b2f63;\n            color: white;\n            display: flex;\n            align-items: center;\n            padding: 15px 25px;\n        }\n\n        .logo {\n            width: 110px;\n            height: 80px;\n            background: #ffb000;\n            border-radius: 8px;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            overflow: hidden;\n            margin-right: 25px;\n        }\n\n        .logo img {\n            width: 100%;\n            height: 100%;\n            object-fit: contain;\n        }\n\n        .linea {\n            height: 80px;\n            width: 2px;\n            background: white;\n            margin-right: 28px;\n        }\n\n        .titulo-header h1 {\n            font-size: 30px;\n            margin-bottom: 8px;\n        }\n\n        .titulo-header h1 span {\n            color: #ffab00;\n        }\n\n        .titulo-header p {\n            font-size: 17px;\n            font-weight: bold;\n        }\n\n        .administrador {\n            margin-left: auto;\n            display: flex;\n            align-items: center;\n            gap: 15px;\n        }\n\n        .usuario {\n            width: 55px;\n            height: 55px;\n            border-radius: 50%;\n            background: white;\n            color: #0b2f63;\n            display: flex;\n            align-items: center;\n            justify-content: center;\n            font-size: 28px;\n        }\n\n        .administrador strong {\n            font-size: 16px;\n        }\n\n        .administrador small {\n            display: block;\n            margin-top: 5px;\n        }\n\n        /* =========================\n           ESTRUCTURA\n        ========================== */\n\n        .contenedor {\n            display: flex;\n            min-height: calc(100vh - 112px);\n        }\n\n        /* =========================\n           MENU LATERAL\n        ========================== */\n\n        .sidebar {\n            width: 250px;\n            background: #06265c;\n            color: white;\n            padding: 25px 15px;\n            flex-shrink: 0;\n        }\n\n        .sidebar h2 {\n            text-align: center;\n            font-size: 25px;\n            margin-bottom: 30px;\n            line-height: 1.25;\n        }\n\n        .menu {\n            list-style: none;\n        }\n\n        .menu li {\n            margin-bottom: 10px;\n        }\n\n        .menu a {\n            display: block;\n            color: white;\n            text-decoration: none;\n            padding: 17px 18px;\n            border-radius: 10px;\n            font-size: 17px;\n            font-weight: bold;\n        }\n\n        .menu a:hover {\n            background: #ffab00;\n            color: white;\n        }\n\n        .menu .activo {\n            background: #ffab00;\n        }\n\n        /* =========================\n           CONTENIDO\n        ========================== */\n\n        .contenido {\n            flex: 1;\n            padding: 32px;\n            background: #ffab00;\n            overflow-x: auto;\n        }\n\n        .contenido h1 {\n            font-size: 40px;\n            margin-bottom: 5px;\n        }\n\n        .subtitulo {\n            font-size: 19px;\n            font-weight: bold;\n            margin-bottom: 25px;\n        }\n\n        /* =========================\n           TARJETAS ESTADISTICAS\n        ========================== */\n\n        .estadisticas {\n            display: grid;\n            grid-template-columns: repeat(4, 1fr);\n            gap: 18px;\n            margin-bottom: 20px;\n        }\n\n        .tarjeta {\n            background: white;\n            border-radius: 12px;\n            padding: 22px;\n            min-height: 135px;\n            box-shadow: 0 4px 10px rgba(0,0,0,0.12);\n        }\n\n        .tarjeta h3 {\n            font-size: 16px;\n            margin-bottom: 15px;\n        }\n\n        .tarjeta .numero {\n            font-size: 30px;\n            font-weight: bold;\n        }\n\n        /* =========================\n           FILTROS\n        ========================== */\n\n        .panel {\n            background: white;\n            border-radius: 12px;\n            padding: 20px;\n            margin-bottom: 20px;\n            box-shadow: 0 4px 10px rgba(0,0,0,0.10);\n        }\n\n        .panel h2 {\n            font-size: 21px;\n            margin-bottom: 15px;\n        }\n\n        .filtros {\n            display: grid;\n            grid-template-columns: repeat(3, 1fr);\n            gap: 12px;\n        }\n\n        input,\n        select {\n            width: 100%;\n            padding: 12px;\n            border: 1px solid #bbb;\n            border-radius: 7px;\n            font-size: 14px;\n        }\n\n        .acciones {\n            display: flex;\n            flex-wrap: wrap;\n            gap: 10px;\n            margin-top: 15px;\n        }\n\n        button {\n            border: none;\n            border-radius: 7px;\n            padding: 12px 18px;\n            cursor: pointer;\n            color: white;\n            font-weight: bold;\n            font-size: 14px;\n        }\n\n        .btn-nueva {\n            background: #0aa63b;\n        }\n\n        .btn-limpiar {\n            background: #069ca8;\n        }\n\n        .btn-actualizar {\n            background: #f28c00;\n        }\n\n        .btn-imprimir {\n            background: #5b21b6;\n        }\n\n        .btn-exportar {\n            background: #1557d6;\n        }\n\n        button:hover {\n            opacity: 0.85;\n        }\n\n        /* =========================\n           TABLA\n        ========================== */\n\n        .tabla-contenedor {\n            background: white;\n            border-radius: 12px;\n            padding: 20px;\n            box-shadow: 0 4px 10px rgba(0,0,0,0.10);\n        }\n\n        .tabla-contenedor h2 {\n            margin-bottom: 18px;\n        }\n\n        .tabla-scroll {\n            overflow-x: auto;\n        }\n\n        table {\n            width: 100%;\n            border-collapse: collapse;\n            min-width: 950px;\n        }\n\n        th {\n            background: #08a5b5;\n            color: white;\n            padding: 14px 10px;\n            text-align: left;\n        }\n\n        td {\n            padding: 13px 10px;\n            border-bottom: 1px solid #ddd;\n        }\n\n        tr:hover {\n            background: #f5f5f5;\n        }\n\n        .completada {\n            background: #d5f5d5;\n            color: #16832a;\n            padding: 7px 12px;\n            border-radius: 5px;\n            font-weight: bold;\n        }\n\n        .pendiente {\n            background: #ffe0c2;\n            color: #e66a00;\n            padding: 7px 12px;\n            border-radius: 5px;\n            font-weight: bold;\n        }\n\n        .acciones-tabla button {\n            padding: 8px 11px;\n            margin-right: 4px;\n        }\n\n        .ver {\n            background: #1557d6;\n        }\n\n        .editar {\n            background: #f0a500;\n        }\n\n        .eliminar {\n            background: #df2020;\n        }\n\n        /* =========================\n           MODAL NUEVA VENTA\n        ========================== */\n\n        .modal {\n            display: none;\n            position: fixed;\n            z-index: 1000;\n            left: 0;\n            top: 0;\n            width: 100%;\n            height: 100%;\n            background: rgba(0,0,0,0.6);\n            align-items: center;\n            justify-content: center;\n        }\n\n        .modal-contenido {\n            background: white;\n            width: 500px;\n            max-width: 90%;\n            max-height: 90vh;\n            overflow-y: auto;\n            padding: 25px;\n            border-radius: 12px;\n        }\n\n        .modal-contenido h2 {\n            margin-bottom: 20px;\n        }\n\n        .campo {\n            margin-bottom: 15px;\n        }\n\n        .campo label {\n            display: block;\n            margin-bottom: 6px;\n            font-weight: bold;\n        }\n\n        .cerrar {\n            background: #df2020;\n            float: right;\n        }\n\n        .modal-acciones {\n            display: flex;\n            justify-content: flex-end;\n            gap: 10px;\n            margin-top: 22px;\n            padding-top: 16px;\n            border-top: 1px solid #e5e7eb;\n        }\n\n        .modal-acciones button {\n            min-width: 120px;\n        }\n\n        .cancelar {\n            background: #e5e7eb;\n            color: #374151;\n        }\n\n        .guardar {\n            background: #0aa63b;\n        }\n\n        /* =========================\n           RESPONSIVE\n        ========================== */\n\n        @media (max-width: 1000px) {\n\n            .estadisticas {\n                grid-template-columns: repeat(2, 1fr);\n            }\n\n            .filtros {\n                grid-template-columns: 1fr;\n            }\n        }\n\n        @media (max-width: 700px) {\n\n            .header {\n                height: auto;\n                flex-wrap: wrap;\n            }\n\n            .administrador {\n                display: none;\n            }\n\n            .contenedor {\n                flex-direction: column;\n            }\n\n            .sidebar {\n                width: 100%;\n            }\n\n            .estadisticas {\n                grid-template-columns: 1fr;\n            }\n        }\n    </style>\n</head>\n<body>\n<!-- =========================\n     ENCABEZADO\n========================== -->\n<header class=\"header\">\n<div class=\"logo\">\n<!-- CAMBIA logo.png POR EL NOMBRE DE TU LOGO -->\n<img alt=\"Proactiva Tu Negocio\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAGkAiADASIAAhEBAxEB/8QAHAA enta\">--</div>\n<p>Fecha</p>\n</div>\n</section>\n<!-- FILTROS Y ACCIONES -->\n<section class=\"panel\">\n<h2>🔎 FILTRAR VENTAS</h2>\n<div class=\"filtros\">\n<input id=\"fechaDesde\" placeholder=\"Fecha desde\" type=\"date\"/>\n<input id=\"fechaHasta\" placeholder=\"Fecha hasta\" type=\"date\"/>\n<select id=\"estadoFiltro\">\n<option value=\"\">Todos los estados</option>\n<option value=\"Completada\">Completada</option>\n<option value=\"Pendiente\">Pendiente</option>\n</select>\n<select id=\"metodoFiltro\">\n<option value=\"\">Todos los métodos de pago</option>\n<option value=\"Efectivo\">Efectivo</option>\n<option value=\"Transferencia\">Transferencia</option>\n<option value=\"Tarjeta\">Tarjeta</option>\n</select>\n<input id=\"buscar\" placeholder=\"Buscar por N° de venta o producto...\" type=\"text\"/>\n</div>\n<div class=\"acciones\">\n<button class=\"btn-nueva\" onclick=\"abrirModal()\">\n                    + Nueva Venta\n                </button>\n<button class=\"btn-exportar\" onclick=\"exportarExcel()\">\n                    📄 Exportar\n                </button>\n<button class=\"btn-imprimir\" onclick=\"window.print()\">\n                    🖨 Imprimir\n                </button>\n<button class=\"btn-actualizar\" onclick=\"actualizarTabla()\">\n                    🔄 Actualizar\n                </button>\n<button class=\"btn-limpiar\" onclick=\"limpiarFiltros()\">\n                    🧹 Limpiar filtros\n                </button>\n</div>\n</section>\n<!-- TABLA -->\n<section class=\"tabla-contenedor\">\n<h2>LISTA DE VENTAS</h2>\n<div class=\"tabla-scroll\">\n<table>\n<thead>\n<tr>\n<th>N° Venta</th>\n<th>Fecha</th>\n<th>Cliente</th>\n<th>Producto</th>\n<th>Cantidad</th>\n<th>Total (Bs)</th>\n<th>Método de pago</th>\n<th>Estado</th>\n<th>Acciones</th>\n</tr>\n</thead>\n<tbody id=\"tablaVentas\">\n</tbody>\n</table>\n</div>\n</section>\n</main>\n</div>\n<!-- =========================\n     MODAL\n========================== -->\n<div class=\"modal\" id=\"modalVenta\">\n<div class=\"modal-contenido\">\n<button class=\"cerrar\" onclick=\"cerrarModal()\">\n            X\n        </button>\n<h2>Registrar nueva venta</h2>\n<div class=\"campo\">\n<label>Cliente</label>\n<input id=\"cliente\" placeholder=\"Nombre del cliente\" type=\"text\"/>\n</div>\n<div class=\"campo\">\n<label>Producto</label>\n<input id=\"producto\" placeholder=\"Nombre del producto\" type=\"text\"/>\n</div>\n<div class=\"campo\">\n<label>Cantidad</label>\n<input id=\"cantidad\" min=\"1\" type=\"number\" value=\"1\"/>\n</div>\n<div class=\"campo\">\n<label>Total (Bs)</label>\n<input id=\"total\" min=\"0\" placeholder=\"Monto total\" type=\"number\"/>\n</div>\n<div class=\"campo\">\n<label>Método de pago</label>\n<select id=\"metodoPago\">\n<option value=\"Efectivo\">Efectivo</option>\n<option value=\"Transferencia\">Transferencia</option>\n<option value=\"Tarjeta\">Tarjeta</option>\n</select>\n</div>\n<div class=\"campo\">\n<label>Estado</label>\n<select id=\"estado\">\n<option value=\"Completada\">Completada</option>\n<option value=\"Pendiente\">Pendiente</option>\n</select>\n</div>\n<div class=\"modal-acciones\">\n<button class=\"cancelar\" onclick=\"cerrarModal()\">\n            Cancelar\n        </button>\n<button class=\"guardar\" onclick=\"guardarVenta()\">\n            Guardar venta\n        </button>\n</div>\n</div>\n</div>\n<script>\n\n    /* =========================\n       DATOS DE EJEMPLO\n    ========================== */\n\n    let ventas = [\n\n        {\n            numero: \"VEN-0001\",\n            fecha: \"2025-05-20\",\n            cliente: \"Empresa A\",\n            producto: \"Producto 1, Producto 2\",\n            cantidad: 25,\n            total: 1850,\n            metodo: \"Transferencia\",\n            estado: \"Completada\"\n        },\n\n        {\n            numero: \"VEN-0002\",\n            fecha: \"2025-05-19\",\n            cliente: \"Empresa B\",\n            producto: \"Producto 3\",\n            cantidad: 10,\n            total: 950,\n            metodo: \"Efectivo\",\n            estado: \"Completada\"\n        },\n\n        {\n            numero: \"VEN-0003\",\n            fecha: \"2025-05-18\",\n            cliente: \"Cliente Particular C\",\n            producto: \"Producto 2, Producto 4\",\n            cantidad: 15,\n            total: 1620,\n            metodo: \"Tarjeta\",\n            estado: \"Completada\"\n        },\n\n        {\n            numero: \"VEN-0004\",\n            fecha: \"2025-05-17\",\n            cliente: \"Empresa D\",\n            producto: \"Producto 1\",\n            cantidad: 20,\n            total: 1400,\n            metodo: \"Transferencia\",\n            estado: \"Completada\"\n        },\n\n        {\n            numero: \"VEN-0005\",\n            fecha: \"2025-05-16\",\n            cliente: \"Empresa A\",\n            producto: \"Producto 5\",\n            cantidad: 8,\n            total: 780,\n            metodo: \"Efectivo\",\n            estado: \"Pendiente\"\n        }\n\n    ];\n\n\n    /* =========================\n       MOSTRAR VENTAS\n    ========================== */\n\n    function mostrarVentas(lista = ventas) {\n\n        const tabla = document.getElementById(\"tablaVentas\");\n\n        tabla.innerHTML = \"\";\n\n        lista.forEach((venta, indice) => {\n\n            const fila = document.createElement(\"tr\");\n\n            fila.innerHTML = `\n\n                <td>${venta.numero}</td>\n\n                <td>${formatearFecha(venta.fecha)}</td>\n\n                <td>${venta.cliente}</td>\n\n                <td>${venta.producto}</td>\n\n                <td>${venta.cantidad}</td>\n\n                <td>Bs ${venta.total.toLocaleString(\"es-BO\")}</td>\n\n                <td>${venta.metodo}</td>\n\n                <td>\n                    <span class=\"${venta.estado === \"Completada\" ? \"completada\" : \"pendiente\"}\">\n                        ${venta.estado}\n                    </span>\n                </td>\n\n                <td class=\"acciones-tabla\">\n\n                    <button class=\"ver\"\n                        onclick=\"verVenta(${indice})\">\n                        👁\n                    </button>\n\n                    <button class=\"editar\"\n                        onclick=\"editarVenta(${indice})\">\n                        ✏\n                    </button>\n\n                    <button class=\"eliminar\"\n                        onclick=\"eliminarVenta(${indice})\">\n                        🗑\n                    </button>\n\n                </td>\n            `;\n\n            tabla.appendChild(fila);\n\n        });\n\n        actualizarEstadisticas(lista);\n    }\n\n\n    /* =========================\n       ESTADISTICAS\n    ========================== */\n\n    function actualizarEstadisticas(lista) {\n\n        document.getElementById(\"totalVentas\").textContent =\n            lista.length;\n\n        let ingresos = lista.reduce(\n            (suma, venta) => suma + Number(venta.total),\n            0\n        );\n\n        document.getElementById(\"ingresosTotales\").textContent =\n            \"Bs \" + ingresos.toLocaleString(\"es-BO\");\n\n        let promedio = lista.length > 0\n            ? ingresos / lista.length\n            : 0;\n\n        document.getElementById(\"promedioVenta\").textContent =\n            \"Bs \" + Math.round(promedio).toLocaleString(\"es-BO\");\n\n        if (lista.length > 0) {\n\n            document.getElementById(\"ultimaVenta\").textContent =\n                formatearFecha(lista[0].fecha);\n\n        } else {\n\n            document.getElementById(\"ultimaVenta\").textContent =\n                \"--\";\n        }\n    }\n\n\n    /* =========================\n       FORMATO FECHA\n    ========================== */\n\n    function formatearFecha(fecha) {\n\n        const partes = fecha.split(\"-\");\n\n        return partes[2] + \"/\" +\n               partes[1] + \"/\" +\n               partes[0];\n    }\n\n\n    /* =========================\n       MODAL\n    ========================== */\n\n    function abrirModal() {\n\n        document.getElementById(\"modalVenta\").style.display =\n            \"flex\";\n    }\n\n\n    function cerrarModal() {\n\n        document.getElementById(\"modalVenta\").style.display =\n            \"none\";\n    }\n\n\n    /* =========================\n       GUARDAR VENTA\n    ========================== */\n\n    function guardarVenta() {\n\n        const cliente =\n            document.getElementById(\"cliente\").value.trim();\n\n        const producto =\n            document.getElementById(\"producto\").value.trim();\n\n        const cantidad =\n            Number(document.getElementById(\"cantidad\").value);\n\n        const total =\n            Number(document.getElementById(\"total\").value);\n\n        const metodo =\n            document.getElementById(\"metodoPago\").value;\n\n        const estado =\n            document.getElementById(\"estado\").value;\n\n\n        if (!cliente || !producto || !cantidad || !total) {\n\n            alert(\"Por favor complete todos los campos.\");\n\n            return;\n        }\n\n\n        const nuevoNumero =\n            \"VEN-\" +\n            String(ventas.length + 1).padStart(4, \"0\");\n\n\n        const nuevaVenta = {\n\n            numero: nuevoNumero,\n\n            fecha: new Date()\n                .toISOString()\n                .split(\"T\")[0],\n\n            cliente: cliente,\n\n            producto: producto,\n\n            cantidad: cantidad,\n\n            total: total,\n\n            metodo: metodo,\n\n            estado: estado\n        };\n\n\n        ventas.unshift(nuevaVenta);\n\n        mostrarVentas();\n\n        limpiarFormulario();\n\n        cerrarModal();\n\n        alert(\"Venta registrada correctamente.\");\n    }\n\n\n    /* =========================\n       LIMPIAR FORMULARIO\n    ========================== */\n\n    function limpiarFormulario() {\n\n        document.getElementById(\"cliente\").value = \"\";\n\n        document.getElementById(\"producto\").value = \"\";\n\n        document.getElementById(\"cantidad\").value = 1;\n\n        document.getElementById(\"total\").value = \"\";\n\n        document.getElementById(\"metodoPago\").value =\n            \"Efectivo\";\n\n        document.getElementById(\"estado\").value =\n            \"Completada\";\n    }\n\n\n    /* =========================\n       VER VENTA\n    ========================== */\n\n    function verVenta(indice) {\n\n        const venta = ventas[indice];\n\n        alert(\n            \"N° Venta: \" + venta.numero +\n            \"\\nCliente: \" + venta.cliente +\n            \"\\nProducto: \" + venta.producto +\n            \"\\nCantidad: \" + venta.cantidad +\n            \"\\nTotal: Bs \" + venta.total +\n            \"\\nMétodo de pago: \" + venta.metodo +\n            \"\\nEstado: \" + venta.estado\n        );\n    }\n\n\n    /* =========================\n       EDITAR VENTA\n    ========================== */\n\n    function editarVenta(indice) {\n\n        const venta = ventas[indice];\n\n        document.getElementById(\"cliente\").value =\n            venta.cliente;\n\n        document.getElementById(\"producto\").value =\n            venta.producto;\n\n        document.getElementById(\"cantidad\").value =\n            venta.cantidad;\n\n        document.getElementById(\"total\").value =\n            venta.total;\n\n        document.getElementById(\"metodoPago\").value =\n            venta.metodo;\n\n        document.getElementById(\"estado\").value =\n            venta.estado;\n\n        abrirModal();\n\n        ventas.splice(indice, 1);\n    }\n\n\n    /* =========================\n       ELIMINAR VENTA\n    ========================== */\n\n    function eliminarVenta(indice) {\n\n        const confirmar =\n            confirm(\"¿Está seguro de eliminar esta venta?\");\n\n        if (confirmar) {\n\n            ventas.splice(indice, 1);\n\n            mostrarVentas();\n\n        }\n    }\n\n\n    /* =========================\n       FILTROS\n    ========================== */\n\n    function actualizarTabla() {\n\n        const texto =\n            document.getElementById(\"buscar\").value\n            .toLowerCase();\n\n        const estado =\n            document.getElementById(\"estadoFiltro\").value;\n\n        const metodo =\n            document.getElementById(\"metodoFiltro\").value;\n\n        const desde =\n            document.getElementById(\"fechaDesde\").value;\n\n        const hasta =\n            document.getElementById(\"fechaHasta\").value;\n\n\n        const filtradas = ventas.filter(venta => {\n\n            const coincideTexto =\n                venta.numero.toLowerCase().includes(texto) ||\n                venta.producto.toLowerCase().includes(texto) ||\n                venta.cliente.toLowerCase().includes(texto);\n\n            const coincideEstado =\n                !estado || venta.estado === estado;\n\n            const coincideMetodo =\n                !metodo || venta.metodo === metodo;\n\n            const coincideDesde =\n                !desde || venta.fecha >= desde;\n\n            const coincideHasta =\n                !hasta || venta.fecha <= hasta;\n\n\n            return coincideTexto &&\n                   coincideEstado &&\n                   coincideMetodo &&\n                   coincideDesde &&\n                   coincideHasta;\n        });\n\n\n        mostrarVentas(filtradas);\n    }\n\n\n    /* =========================\n       LIMPIAR FILTROS\n    ========================== */\n\n    function limpiarFiltros() {\n\n        document.getElementById(\"fechaDesde\").value = \"\";\n\n        document.getElementById(\"fechaHasta\").value = \"\";\n\n        document.getElementById(\"estadoFiltro\").value = \"\";\n\n        document.getElementById(\"metodoFiltro\").value = \"\";\n\n        document.getElementById(\"buscar\").value = \"\";\n\n        mostrarVentas();\n    }\n\n\n    /* =========================\n       EXPORTAR\n    ========================== */\n\n    function exportarExcel() {\n\n        let contenido =\n            \"N° Venta,Fecha,Cliente,Producto,Cantidad,Total,Método de pago,Estado\\n\";\n\n\n        ventas.forEach(venta => {\n\n            contenido +=\n                venta.numero + \",\" +\n                venta.fecha + \",\" +\n                venta.cliente + \",\" +\n                venta.producto + \",\" +\n                venta.cantidad + \",\" +\n                venta.total + \",\" +\n                venta.metodo + \",\" +\n                venta.estado + \"\\n\";\n\n        });\n\n\n        const archivo =\n            new Blob([contenido], {\n                type: \"text/csv;charset=utf-8;\"\n            });\n\n\n        const url =\n            URL.createObjectURL(archivo);\n\n\n        const enlace =\n            document.createElement(\"a\");\n\n        enlace.href = url;\n\n        enlace.download = \"ventas.csv\";\n\n        enlace.click();\n\n        URL.revokeObjectURL(url);\n    }\n\n\n    /* =========================\n       BUSQUEDA AUTOMATICA\n    ========================== */\n\n    document\n        .getElementById(\"buscar\")\n        .addEventListener(\n            \"input\",\n            actualizarTabla\n        );\n\n\n    document\n        .getElementById(\"estadoFiltro\")\n        .addEventListener(\n            \"change\",\n            actualizarTabla\n        );\n\n\n    document\n        .getElementById(\"metodoFiltro\")\n        .addEventListener(\n            \"change\",\n            actualizarTabla\n        );\n\n\n    document\n        .getElementById(\"fechaDesde\")\n        .addEventListener(\n            \"change\",\n            actualizarTabla\n        );\n\n\n    document\n        .getElementById(\"fechaHasta\")\n        .addEventListener(\n            \"change\",\n            actualizarTabla\n        );\n\n\n    /* =========================\n       INICIAR\n    ========================== */\n\n    mostrarVentas();\n\n<\/script>\n\n<script>\n(function(){\n  var CLAVE_VENTAS_INTEGRADAS='ventas';\n  var CLAVE_CLIENTES_INTEGRADOS='clientes';\n  var ventaEditandoNumeroIntegrado=null;\n  function leer(clave){\n    try{ var d=JSON.parse(localStorage.getItem(clave)); return Array.isArray(d)?d:[]; }catch(e){ return []; }\n  }\n  function guardar(clave, datos){ try{ localStorage.setItem(clave, JSON.stringify(datos)); }catch(e){} }\n  function esc(v){ return String(v==null?'':v).replace(/[&<>\"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[ch];}); }\n  function norm(v){ return String(v||'').trim().toLowerCase(); }\n  function clientesActuales(){ return leer(CLAVE_CLIENTES_INTEGRADOS); }\n  function cargarVentasPersistidas(){\n    var raw=null;\n    try{ raw=localStorage.getItem(CLAVE_VENTAS_INTEGRADAS); }catch(e){}\n    if(raw!==null){\n      try{ var d=JSON.parse(raw); if(Array.isArray(d)) return d; }catch(e){}\n    }\n    var iniciales = Array.isArray(ventas) ? ventas.slice() : [];\n    guardar(CLAVE_VENTAS_INTEGRADAS, iniciales);\n    return iniciales;\n  }\n  function resolverClienteId(nombre){\n    var c=clientesActuales().find(function(x){return norm(x.nombre)===norm(nombre);});\n    return c ? c.id : '';\n  }\n  function sincronizarNombres(){\n    var cls=clientesActuales(), cambio=false;\n    ventas.forEach(function(v){\n      var c = v.clienteId ? cls.find(function(x){return x.id===v.clienteId;}) : cls.find(function(x){return norm(x.nombre)===norm(v.cliente);});\n      if(c){\n        if(v.cliente!==c.nombre || v.clienteId!==c.id){ v.cliente=c.nombre; v.clienteId=c.id; cambio=true; }\n      }\n    });\n    if(cambio) guardar(CLAVE_VENTAS_INTEGRADAS, ventas);\n  }\n  function sincronizarFacturadoClientes(){\n    var cls=clientesActuales();\n    if(!cls.length) return;\n    var totales={};\n    ventas.forEach(function(v){\n      var key=v.clienteId?'id:'+v.clienteId:'nm:'+norm(v.cliente);\n      totales[key]=(totales[key]||0)+Number(v.total||0);\n    });\n    cls.forEach(function(c){\n      var suma=totales['id:'+c.id];\n      if(suma==null) suma=totales['nm:'+norm(c.nombre)]||0;\n      c.facturado=Number(suma);\n    });\n    guardar(CLAVE_CLIENTES_INTEGRADOS, cls);\n  }\n  function persistir(){\n    guardar(CLAVE_VENTAS_INTEGRADAS, ventas);\n    sincronizarFacturadoClientes();\n    parent.postMessage({type:'proactiva-data-changed', area:'ventas'}, '*');\n  }\n  function cargarDatalistClientes(){\n    var input=document.getElementById('cliente');\n    if(!input) return;\n    input.setAttribute('list','listaClientesRegistrados');\n    var lista=document.getElementById('listaClientesRegistrados');\n    if(!lista){\n      lista=document.createElement('datalist'); lista.id='listaClientesRegistrados';\n      input.insertAdjacentElement('afterend',lista);\n      var ayuda=document.createElement('small');\n      ayuda.textContent='Seleccione un cliente registrado o escriba uno nuevo.';\n      ayuda.style.cssText='display:block;margin-top:6px;color:#64748b;font-weight:600';\n      lista.insertAdjacentElement('afterend',ayuda);\n    }\n    lista.innerHTML='';\n    clientesActuales().filter(function(c){return c.estado!=='Inactivo';}).forEach(function(c){\n      var o=document.createElement('option'); o.value=c.nombre; o.label=(c.id||'')+' · '+(c.tipo||'Cliente'); lista.appendChild(o);\n    });\n  }\n  function numeroSiguiente(){\n    var mayor=0;\n    ventas.forEach(function(v){ var n=Number(String(v.numero||'').replace(/\\D/g,'')); if(n>mayor) mayor=n; });\n    return 'VEN-'+String(mayor+1).padStart(4,'0');\n  }\n  ventas=cargarVentasPersistidas();\n  sincronizarNombres();\n  sincronizarFacturadoClientes();\n  cargarDatalistClientes();\n\n  mostrarVentas = function(lista){\n    if(!Array.isArray(lista)) lista=ventas;\n    var tabla=document.getElementById('tablaVentas'); if(!tabla) return;\n    tabla.innerHTML='';\n    lista.forEach(function(venta){\n      var fila=document.createElement('tr');\n      fila.innerHTML='<td>'+esc(venta.numero)+'</td>'+\n        '<td>'+esc(formatearFecha(venta.fecha))+'</td>'+\n        '<td>'+esc(venta.cliente)+'</td>'+\n        '<td>'+esc(venta.producto)+'</td>'+\n        '<td>'+Number(venta.cantidad||0)+'</td>'+\n        '<td>Bs '+Number(venta.total||0).toLocaleString('es-BO')+'</td>'+\n        '<td>'+esc(venta.metodo)+'</td>'+\n        '<td><span class=\"'+(venta.estado==='Completada'?'completada':'pendiente')+'\">'+esc(venta.estado)+'</span></td>'+\n        '<td class=\"acciones-tabla\"><button class=\"ver\" data-accion=\"ver\" data-numero=\"'+esc(venta.numero)+'\">👁</button> <button class=\"editar\" data-accion=\"editar\" data-numero=\"'+esc(venta.numero)+'\">✏</button> <button class=\"eliminar\" data-accion=\"eliminar\" data-numero=\"'+esc(venta.numero)+'\">🗑</button></td>';\n      tabla.appendChild(fila);\n    });\n    actualizarEstadisticas(lista);\n  };\n\n  var tablaVentas=document.getElementById('tablaVentas');\n  if(tablaVentas){\n    tablaVentas.addEventListener('click',function(e){\n      var b=e.target.closest('button[data-accion]'); if(!b) return;\n      var num=b.getAttribute('data-numero'), accion=b.getAttribute('data-accion');\n      if(accion==='ver') verVenta(num); else if(accion==='editar') editarVenta(num); else if(accion==='eliminar') eliminarVenta(num);\n    });\n  }\n\n  abrirModal = function(){\n    cargarDatalistClientes();\n    var modal=document.getElementById('modalVenta'); if(modal) modal.style.display='flex';\n    var titulo=modal && modal.querySelector('h2'); if(titulo) titulo.textContent=ventaEditandoNumeroIntegrado?'Editar venta':'Registrar nueva venta';\n  };\n  cerrarModal = function(){\n    var modal=document.getElementById('modalVenta'); if(modal) modal.style.display='none';\n    ventaEditandoNumeroIntegrado=null;\n    var titulo=modal && modal.querySelector('h2'); if(titulo) titulo.textContent='Registrar nueva venta';\n  };\n  guardarVenta = function(){\n    var cliente=(document.getElementById('cliente').value||'').trim();\n    var producto=(document.getElementById('producto').value||'').trim();\n    var cantidad=Number(document.getElementById('cantidad').value);\n    var total=Number(document.getElementById('total').value);\n    var metodo=document.getElementById('metodoPago').value;\n    var estado=document.getElementById('estado').value;\n    if(!cliente || !producto || !cantidad || !total){ alert('Por favor complete todos los campos.'); return; }\n    var clienteId=resolverClienteId(cliente);\n    if(ventaEditandoNumeroIntegrado){\n      var i=ventas.findIndex(function(v){return v.numero===ventaEditandoNumeroIntegrado;});\n      if(i!==-1){ ventas[i]=Object.assign({},ventas[i],{cliente:cliente,clienteId:clienteId,producto:producto,cantidad:cantidad,total:total,metodo:metodo,estado:estado}); }\n    }else{\n      ventas.unshift({numero:numeroSiguiente(),fecha:new Date().toISOString().split('T')[0],cliente:cliente,clienteId:clienteId,producto:producto,cantidad:cantidad,total:total,metodo:metodo,estado:estado});\n    }\n    persistir();\n    mostrarVentas();\n    if(typeof limpiarFormulario==='function') limpiarFormulario();\n    ventaEditandoNumeroIntegrado=null;\n    var modal=document.getElementById('modalVenta'); if(modal) modal.style.display='none';\n    alert('Venta guardada correctamente. Los reportes se actualizarán automáticamente.');\n  };\n  verVenta = function(numero){\n    var v=ventas.find(function(x){return x.numero===numero;}); if(!v) return;\n    alert('N° Venta: '+v.numero+'\\nFecha: '+formatearFecha(v.fecha)+'\\nCliente: '+v.cliente+'\\nProducto: '+v.producto+'\\nCantidad: '+v.cantidad+'\\nTotal: Bs '+Number(v.total).toLocaleString('es-BO')+'\\nMétodo de pago: '+v.metodo+'\\nEstado: '+v.estado);\n  };\n  editarVenta = function(numero){\n    var v=ventas.find(function(x){return x.numero===numero;}); if(!v) return;\n    ventaEditandoNumeroIntegrado=numero;\n    document.getElementById('cliente').value=v.cliente||'';\n    document.getElementById('producto').value=v.producto||'';\n    document.getElementById('cantidad').value=v.cantidad||1;\n    document.getElementById('total').value=v.total||'';\n    document.getElementById('metodoPago').value=v.metodo||'Efectivo';\n    document.getElementById('estado').value=v.estado||'Completada';\n    abrirModal();\n  };\n  eliminarVenta = function(numero){\n    if(!confirm('¿Está seguro de eliminar esta venta?')) return;\n    ventas=ventas.filter(function(v){return v.numero!==numero;});\n    persistir(); mostrarVentas();\n  };\n  mostrarVentas();\n})();\n<\/script>\n\n<script>\n(function(){\n  function normalizar(s){\n    return (s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n  }\n  document.addEventListener('click', function(ev){\n    var a = ev.target.closest && ev.target.closest('a');\n    if(!a) return;\n    var texto = normalizar(a.textContent);\n    var href = normalizar(a.getAttribute('href') || '');\n    var pagina = null;\n    if(texto.includes('inicio') || href.includes('index')) pagina='inicio';\n    else if(texto.includes('produccion') || href.includes('produccion')) pagina='produccion';\n    else if(texto.includes('pedidos') || href.includes('pedidos')) pagina='pedidos';\n    else if(texto.includes('clientes') || href.includes('clientes')) pagina='clientes';\n    else if(texto.includes('ventas') || href.includes('ventas')) pagina='ventas';\n    else if(texto.includes('reportes') || href.includes('reportes')) pagina='reportes';\n    if(pagina){\n      ev.preventDefault();\n      ev.stopPropagation();\n      parent.postMessage({type:'proactiva-nav', page:pagina}, '*');\n    }\n  }, true);\n  parent.postMessage({type:'proactiva-ready', page: document.title || ''}, '*');\n})();\n<\/script>\n</body>\n</html>", "reportes": "<!DOCTYPE html>\n\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Reportes - Proactiva Tu Negocio</title>\n<style>\n\n/* ==============================\n   CONFIGURACIÓN GENERAL\n================================ */\n\n* {\n    margin: 0;\n    padding: 0;\n    box-sizing: border-box;\n    font-family: Arial, Helvetica, sans-serif;\n}\n\nbody {\n    background: #ffab00;\n    color: #111;\n}\n\n/* ==============================\n   ENCABEZADO\n================================ */\n\n.header {\n    height: 110px;\n    background: #0b2f63;\n    color: white;\n\n    display: flex;\n    align-items: center;\n\n    padding: 12px 25px;\n}\n\n.logo {\n    width: 110px;\n    height: 80px;\n\n    background: #ffab00;\n\n    border-radius: 8px;\n\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    overflow: hidden;\n\n    margin-right: 25px;\n}\n\n.logo img {\n    width: 100%;\n    height: 100%;\n\n    object-fit: contain;\n}\n\n.linea {\n    width: 2px;\n    height: 75px;\n\n    background: white;\n\n    margin-right: 25px;\n}\n\n.titulo-header h1 {\n    font-size: 30px;\n    margin-bottom: 7px;\n}\n\n.titulo-header h1 span {\n    color: #ffab00;\n}\n\n.titulo-header p {\n    font-size: 16px;\n    font-weight: bold;\n}\n\n.administrador {\n    margin-left: auto;\n\n    display: flex;\n    align-items: center;\n\n    gap: 12px;\n}\n\n.usuario {\n    width: 55px;\n    height: 55px;\n\n    background: white;\n    color: #0b2f63;\n\n    border-radius: 50%;\n\n    display: flex;\n    align-items: center;\n    justify-content: center;\n\n    font-size: 27px;\n}\n\n.administrador strong {\n    display: block;\n    font-size: 16px;\n}\n\n.administrador small {\n    display: block;\n    margin-top: 5px;\n}\n\n/* ==============================\n   ESTRUCTURA\n================================ */\n\n.contenedor {\n    display: flex;\n\n    min-height: calc(100vh - 110px);\n}\n\n/* ==============================\n   MENU LATERAL\n================================ */\n\n.sidebar {\n    width: 240px;\n\n    background: #06265c;\n\n    color: white;\n\n    padding: 25px 15px;\n\n    flex-shrink: 0;\n}\n\n.sidebar h2 {\n    text-align: center;\n\n    font-size: 24px;\n\n    line-height: 1.2;\n\n    margin-bottom: 25px;\n}\n\n.menu {\n    list-style: none;\n}\n\n.menu li {\n    margin-bottom: 8px;\n}\n\n.menu a {\n    display: block;\n\n    color: white;\n\n    text-decoration: none;\n\n    padding: 16px 15px;\n\n    border-radius: 9px;\n\n    font-size: 16px;\n\n    font-weight: bold;\n}\n\n.menu a:hover {\n    background: #ffab00;\n}\n\n.menu .activo {\n    background: #08a5b5;\n}\n\n/* ==============================\n   CONTENIDO\n================================ */\n\n.contenido {\n    flex: 1;\n\n    padding: 30px;\n\n    background: #ffab00;\n\n    overflow-x: auto;\n}\n\n.contenido h1 {\n    font-size: 38px;\n\n    margin-bottom: 5px;\n}\n\n.subtitulo {\n    font-size: 18px;\n\n    font-weight: bold;\n\n    margin-bottom: 22px;\n}\n\n/* ==============================\n   TARJETAS\n================================ */\n\n.estadisticas {\n\n    display: grid;\n\n    grid-template-columns:\n    repeat(4, 1fr);\n\n    gap: 18px;\n\n    margin-bottom: 20px;\n}\n\n.tarjeta {\n\n    background: white;\n\n    border-radius: 12px;\n\n    padding: 20px;\n\n    min-height: 130px;\n\n    box-shadow:\n    0 4px 10px rgba(0,0,0,0.12);\n\n    display: flex;\n\n    align-items: center;\n\n    justify-content: space-between;\n}\n\n.tarjeta h3 {\n    font-size: 14px;\n\n    margin-bottom: 12px;\n}\n\n.tarjeta .numero {\n\n    font-size: 29px;\n\n    font-weight: bold;\n}\n\n.tarjeta p {\n\n    margin-top: 7px;\n\n    color: #555;\n\n    font-size: 13px;\n}\n\n.icono {\n\n    width: 60px;\n    height: 60px;\n\n    border-radius: 50%;\n\n    display: flex;\n\n    align-items: center;\n    justify-content: center;\n\n    font-size: 28px;\n\n    color: white;\n}\n\n.icono.azul {\n    background: #08a5b5;\n}\n\n.icono.verde {\n    background: #149c3c;\n}\n\n.icono.naranja {\n    background: #f28c00;\n}\n\n.icono.morado {\n    background: #6b35b8;\n}\n\n/* ==============================\n   PANELES\n================================ */\n\n.panel {\n\n    background: white;\n\n    border-radius: 12px;\n\n    padding: 20px;\n\n    margin-bottom: 20px;\n\n    box-shadow:\n    0 4px 10px rgba(0,0,0,0.10);\n}\n\n.panel h2 {\n\n    font-size: 20px;\n\n    margin-bottom: 16px;\n}\n\n/* ==============================\n   FILTROS\n================================ */\n\n.filtros {\n\n    display: grid;\n\n    grid-template-columns:\n    repeat(5, 1fr);\n\n    gap: 12px;\n}\n\n.campo label {\n\n    display: block;\n\n    font-weight: bold;\n\n    font-size: 13px;\n\n    margin-bottom: 6px;\n}\n\ninput,\nselect {\n\n    width: 100%;\n\n    padding: 11px;\n\n    border: 1px solid #bbb;\n\n    border-radius: 6px;\n\n    font-size: 14px;\n}\n\n.botones {\n\n    display: flex;\n\n    gap: 10px;\n\n    margin-top: 15px;\n\n    flex-wrap: wrap;\n}\n\nbutton {\n\n    border: none;\n\n    border-radius: 7px;\n\n    padding: 11px 17px;\n\n    color: white;\n\n    font-weight: bold;\n\n    cursor: pointer;\n}\n\nbutton:hover {\n\n    opacity: .85;\n}\n\n.btn-generar {\n    background: #08a5b5;\n}\n\n.btn-limpiar {\n    background: #555;\n}\n\n.btn-exportar {\n    background: #149c3c;\n}\n\n.btn-imprimir {\n    background: #6b35b8;\n}\n\n/* ==============================\n   GRÁFICOS\n================================ */\n\n.graficos {\n\n    display: grid;\n\n    grid-template-columns:\n    repeat(3, 1fr);\n\n    gap: 18px;\n\n    margin-bottom: 20px;\n}\n\n.grafico {\n\n    background: white;\n\n    border-radius: 12px;\n\n    padding: 20px;\n\n    min-height: 330px;\n\n    box-shadow:\n    0 4px 10px rgba(0,0,0,0.10);\n}\n\n.grafico h2 {\n\n    font-size: 17px;\n\n    margin-bottom: 20px;\n}\n\n/* ==============================\n   GRAFICO DE BARRAS\n================================ */\n\n.barras {\n\n    height: 240px;\n\n    display: flex;\n\n    align-items: flex-end;\n\n    justify-content: space-around;\n\n    border-bottom: 2px solid #aaa;\n\n    padding: 0 10px;\n}\n\n.barra {\n\n    width: 35px;\n\n    background: #08a5b5;\n\n    border-radius: 5px 5px 0 0;\n\n    position: relative;\n\n    min-height: 15px;\n}\n\n.barra span {\n\n    position: absolute;\n\n    bottom: -25px;\n\n    left: 50%;\n\n    transform: translateX(-50%);\n\n    font-size: 11px;\n}\n\n/* ==============================\n   METODOS DE PAGO\n================================ */\n\n.metodos {\n\n    display: flex;\n\n    flex-direction: column;\n\n    gap: 14px;\n}\n\n.metodo {\n\n    display: flex;\n\n    justify-content: space-between;\n\n    align-items: center;\n}\n\n.progreso {\n\n    height: 12px;\n\n    background: #ddd;\n\n    border-radius: 20px;\n\n    overflow: hidden;\n\n    flex: 1;\n\n    margin: 0 10px;\n}\n\n.progreso div {\n\n    height: 100%;\n\n    background: #149c3c;\n}\n\n/* ==============================\n   PRODUCTOS\n================================ */\n\n.productos {\n\n    display: flex;\n\n    flex-direction: column;\n\n    gap: 13px;\n}\n\n.producto {\n\n    display: flex;\n\n    align-items: center;\n\n    gap: 10px;\n}\n\n.producto-nombre {\n\n    width: 90px;\n\n    font-size: 13px;\n}\n\n.producto-barra {\n\n    flex: 1;\n\n    height: 22px;\n\n    background: #ddd;\n\n    border-radius: 5px;\n\n    overflow: hidden;\n}\n\n.producto-barra div {\n\n    height: 100%;\n\n    background: #f28c00;\n}\n\n/* ==============================\n   TABLA\n================================ */\n\n.tabla-panel {\n\n    background: white;\n\n    border-radius: 12px;\n\n    padding: 20px;\n\n    box-shadow:\n    0 4px 10px rgba(0,0,0,0.10);\n}\n\n.tabla-scroll {\n\n    overflow-x: auto;\n}\n\ntable {\n\n    width: 100%;\n\n    border-collapse: collapse;\n\n    min-width: 850px;\n}\n\nth {\n\n    background: #08a5b5;\n\n    color: white;\n\n    padding: 13px;\n\n    text-align: left;\n}\n\ntd {\n\n    padding: 12px;\n\n    border-bottom: 1px solid #ddd;\n}\n\ntr:hover {\n\n    background: #f4f4f4;\n}\n\n.total {\n\n    font-weight: bold;\n\n    background: #e8f7f9;\n}\n\n/* ==============================\n   RESUMEN GENERAL\n================================ */\n\n.resumen {\n\n    display: grid;\n\n    grid-template-columns:\n    2fr 1fr;\n\n    gap: 18px;\n\n    margin-top: 20px;\n}\n\n.resumen-general {\n\n    background: white;\n\n    border-radius: 12px;\n\n    padding: 20px;\n\n    box-shadow:\n    0 4px 10px rgba(0,0,0,0.10);\n}\n\n.resumen-general h2 {\n\n    margin-bottom: 15px;\n\n    font-size: 19px;\n}\n\n.resumen-item {\n\n    display: flex;\n\n    justify-content: space-between;\n\n    padding: 13px;\n\n    border-bottom: 1px solid #ddd;\n}\n\n.resumen-item strong {\n\n    font-size: 15px;\n}\n\n/* ==============================\n   RESPONSIVE\n================================ */\n\n@media(max-width:1100px) {\n\n    .estadisticas {\n\n        grid-template-columns:\n        repeat(2,1fr);\n    }\n\n    .graficos {\n\n        grid-template-columns: 1fr;\n    }\n\n    .filtros {\n\n        grid-template-columns:\n        repeat(2,1fr);\n    }\n\n    .resumen {\n\n        grid-template-columns: 1fr;\n    }\n}\n\n@media(max-width:700px) {\n\n    .header {\n\n        height: auto;\n\n        flex-wrap: wrap;\n    }\n\n    .administrador {\n\n        display: none;\n    }\n\n    .contenedor {\n\n        flex-direction: column;\n    }\n\n    .sidebar {\n\n        width: 100%;\n    }\n\n    .estadisticas {\n\n        grid-template-columns: 1fr;\n    }\n\n    .filtros {\n\n        grid-template-columns: 1fr;\n    }\n}\n\n</style>\n</head>\n<body>\n<!-- ===================================\n     ENCABEZADO\n==================================== -->\n<header class=\"header\">\n<div class=\"logo\">\n<!--\n        CAMBIA logo.png POR EL NOMBRE\n        EXACTO DE TU LOGO\n        -->\n<img alt=\"Proactiva Tu Negocio\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIj
