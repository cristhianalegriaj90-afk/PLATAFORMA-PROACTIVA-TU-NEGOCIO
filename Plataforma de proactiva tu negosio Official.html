<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Proactiva Tu Negocio - Plataforma Integrada</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#03052f}
:root{--alto-header:120px;--ancho-menu:240px;--azul:#03052f;--turquesa:#16dedb;--amarillo:#ffab00}
#encabezadoGlobal{position:fixed;top:0;left:0;right:0;height:var(--alto-header);background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 35px;z-index:2000;box-shadow:0 3px 10px rgba(0,0,0,.28)}
.marcaGlobal{display:flex;align-items:center;min-width:0;flex:1}
.logoGlobal{width:100px;height:100px;background:#ffb400;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.logoGlobal img{width:100%;height:100%;object-fit:contain;display:block}
.separadorGlobal{width:2px;height:82px;background:rgba(255,255,255,.75);margin:0 25px}
.tituloGlobal h1{margin:0;font-size:31px;letter-spacing:1px;white-space:nowrap}
.tituloGlobal h1 span{color:#ffa600}
.tituloGlobal p{margin:7px 0 0;font-size:16px;font-weight:700;color:#f1f1f1}
.usuarioGlobal{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.avatarGlobal{width:55px;height:55px;border-radius:50%;background:#fff;color:#03052f;display:flex;align-items:center;justify-content:center;font-size:28px}
.usuarioGlobal small{display:block;margin-top:5px;color:#ddd}
#menuGlobal{position:fixed;top:var(--alto-header);left:0;bottom:0;width:var(--ancho-menu);background:var(--azul);color:#fff;padding:22px 15px;overflow-y:auto;z-index:1900}
#menuGlobal h2{text-align:center;font-size:21px;line-height:1.3;margin:0 0 28px}
#menuGlobal ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
#menuGlobal a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:15px;padding:15px 14px;border-radius:9px;font-size:16px;transition:.15s;background:transparent}
#menuGlobal a:hover{background:transparent;color:#fff}
#menuGlobal a.active{background:var(--turquesa);color:#051033;font-weight:800}
.iconoMenu{width:30px;text-align:center;font-size:23px;flex:0 0 30px}
#areaContenido{position:fixed;top:var(--alto-header);left:var(--ancho-menu);right:0;bottom:0;background:var(--amarillo);z-index:100}
#appFrame{width:100%;height:100%;border:0;display:block;background:var(--amarillo)}
#cargando{position:absolute;inset:0;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;z-index:5;font-size:18px}
#cargando span{color:#ffab00;font-weight:800}
@media(max-width:720px){
  :root{--alto-header:90px;--ancho-menu:74px}
  #encabezadoGlobal{padding:0 12px}
  .logoGlobal{width:90px;height:65px}
  .separadorGlobal{height:58px;margin:0 12px}
  .tituloGlobal h1{font-size:19px}
  .tituloGlobal p,.usuarioGlobal{display:none}
  #menuGlobal{padding:15px 8px}
  #menuGlobal h2{display:none}
  #menuGlobal a{justify-content:center;padding:14px 6px;font-size:0;gap:0}
  .iconoMenu{font-size:24px;width:auto;flex:0 0 auto}
}
</style>
</head>

      text-decoration: none;\n        }\n\n\n        /* =========================================================\n           ENCABEZADO SUPERIOR\n        ========================================================= */\n\n        .header {\n            height: 120px;\n            background: #03052f;\n            color: white;\n\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n\n            padding: 0 35px;\n            position: fixed;\n\n            top: 0;\n            left: 0;\n            right: 0;\n\n            z-index: 1000;\n\n            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);\n        }\n\n        .header-left {\n            display: flex;\n            align-items: center;\n            gap: 28px;\n        }\n\n        .logo-box {\n            width: 110px;\n            height: 80px;\n\n            background: #ffb400;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n\n            border-radius: 4px;\n\n            overflow: hidden;\n        }\n\n        .logo-box img {\n            width: 100%;\n            height: 100%;\n            object-fit: contain;\n        }\n\n        .separator {\n            width: 2px;\n            height: 95px;\n            background: rgba(255, 255, 255, 0.8);\n        }\n\n        .brand h1 {\n            font-size: 31px;\n            letter-spacing: 1px;\n            font-weight: 800;\n        }\n\n        .brand h1 span {\n            color: #ffa600;\n        }\n\n        .brand p {\n            margin-top: 7px;\n            font-size: 17px;\n            color: #f1f1f1;\n        }\n\n        .administrator {\n            display: flex;\n            align-items: center;\n            gap: 12px;\n        }\n\n        .avatar {\n            width: 55px;\n            height: 55px;\n\n            background: white;\n            color: #222;\n\n            border-radius: 50%;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n\n            font-size: 30px;\n        }\n\n        .administrator-info strong {\n            display: block;\n            font-size: 17px;\n        }\n\n        .administrator-info span {\n            display: block;\n            margin-top: 5px;\n\n            color: #ddd;\n            font-size: 13px;\n        }\n\n        .admin-arrow {\n            font-size: 20px;\n            margin-left: 15px;\n            cursor: pointer;\n        }\n\n\n        /* =========================================================\n           MENÚ LATERAL\n        ========================================================= */\n\n        .sidebar {\n            position: fixed;\n\n            top: 120px;\n            bottom: 0;\n            left: 0;\n\n            width: 240px;\n\n            background: #03052f;\n\n            color: white;\n\n            padding: 20px 15px;\n\n            overflow-y: auto;\n\n            z-index: 999;\n        }\n\n        .sidebar-title {\n            text-align: center;\n\n            font-size: 22px;\n            font-weight: bold;\n\n            line-height: 1.2;\n\n            margin-bottom: 32px;\n        }\n\n        .menu {\n            display: flex;\n            flex-direction: column;\n            gap: 12px;\n        }\n\n        .menu a {\n            display: flex;\n            align-items: center;\n            gap: 16px;\n\n            color: white;\n\n            padding: 15px 14px;\n\n            border-radius: 9px;\n\n            transition: all 0.25s ease;\n\n            font-size: 16px;\n        }\n\n        .menu a:hover {\n            background: rgba(18, 224, 221, 0.2);\n            transform: translateX(3px);\n        }\n\n        .menu a.active {\n            background: #16dedb;\n            color: #051033;\n            font-weight: bold;\n        }\n\n        .menu-icon {\n            width: 30px;\n            font-size: 24px;\n            text-align: center;\n        }\n\n\n        /* =========================================================\n           CONTENIDO PRINCIPAL\n        ========================================================= */\n\n        .main {\n            margin-left: 240px;\n            padding-top: 120px;\n\n            min-height: 100vh;\n\n            background:\n                linear-gradient(\n                    135deg,\n                    #ffad00 0%,\n                    #ffa000 45%,\n                    #ffb000 100%\n                );\n        }\n\n        .content {\n            padding: 22px 30px 30px 30px;\n        }\n\n        .page-title h2 {\n            font-size: 36px;\n            font-weight: 900;\n            color: #28323d;\n        }\n\n        .page-title p {\n            margin-top: 5px;\n\n            font-size: 16px;\n            font-weight: 600;\n\n            color: #19202a;\n        }\n\n\n        /* =========================================================\n           ESTRUCTURA DE COLUMNAS\n        ========================================================= */\n\n        .dashboard-grid {\n            display: grid;\n\n            grid-template-columns:\n                minmax(0, 3fr)\n                minmax(300px, 1fr);\n\n            gap: 18px;\n\n            margin-top: 16px;\n        }\n\n\n        /* =========================================================\n           TARJETAS SUPERIORES\n        ========================================================= */\n\n        .stats-grid {\n            display: grid;\n\n            grid-template-columns: repeat(4, 1fr);\n\n            gap: 14px;\n        }\n\n        .stat-card {\n            min-height: 123px;\n\n            border-radius: 13px;\n\n            background:\n                linear-gradient(\n                    135deg,\n                    #11e0df,\n                    #20d9d5\n                );\n\n            padding: 15px;\n\n            display: flex;\n            align-items: center;\n            gap: 14px;\n\n            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.12);\n\n            transition: transform 0.25s ease;\n        }\n\n        .stat-card:hover {\n            transform: translateY(-4px);\n        }\n\n        .stat-icon {\n            width: 75px;\n            height: 75px;\n\n            min-width: 75px;\n\n            border-radius: 50%;\n\n            background: white;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n\n            font-size: 38px;\n\n            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);\n        }\n\n        .stat-info h3 {\n            font-size: 14px;\n            text-transform: uppercase;\n\n            color: #05091b;\n        }\n\n        .stat-number {\n            font-size: 31px;\n            font-weight: 900;\n\n            color: #05091b;\n\n            margin-top: 4px;\n        }\n\n        .stat-info p {\n            font-size: 12px;\n            margin-top: 3px;\n\n            color: #17202c;\n        }\n\n\n        /* =========================================================\n           BOTONES DE ACCIONES PRINCIPALES\n        ========================================================= */\n\n        .actions {\n            display: flex;\n            flex-wrap: wrap;\n\n            gap: 12px;\n\n            margin-top: 17px;\n            margin-bottom: 14px;\n        }\n\n        .btn {\n            border: none;\n            border-radius: 8px;\n\n            padding: 13px 22px;\n\n            cursor: pointer;\n\n            font-size: 14px;\n            font-weight: 700;\n\n            display: inline-flex;\n            align-items: center;\n            gap: 9px;\n\n            transition: all 0.2s ease;\n\n            box-shadow: 0 3px 7px rgba(0, 0, 0, 0.15);\n        }\n\n        .btn:hover {\n            transform: translateY(-2px);\n        }\n\n        .btn-green {\n            background: #45b52d;\n            color: white;\n        }\n\n        .btn-blue {\n            background: #0878ef;\n            color: white;\n        }\n\n        .btn-white {\n            background: white;\n            color: #182030;\n        }\n\n\n        /* =========================================================\n           PANEL / CAJA\n        ========================================================= */\n\n        .panel {\n            background: white;\n\n            border-radius: 13px;\n\n            padding: 17px;\n\n            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);\n        }\n\n        .panel-title {\n            font-size: 18px;\n            font-weight: 900;\n\n            display: flex;\n            align-items: center;\n            gap: 10px;\n\n            margin-bottom: 15px;\n        }\n\n\n        /* =========================================================\n           FILTROS\n        ========================================================= */\n\n        .filters {\n            display: grid;\n\n            grid-template-columns:\n                1.5fr\n                1fr\n                1fr\n                1.2fr\n                auto;\n\n            gap: 10px;\n\n            margin-bottom: 15px;\n        }\n\n        .input-control {\n            height: 42px;\n\n            border: 1px solid #d2d8df;\n            border-radius: 7px;\n\n            padding: 0 12px;\n\n            outline: none;\n\n            background: white;\n\n            font-size: 13px;\n        }\n\n        .input-control:focus {\n            border-color: #13ceca;\n            box-shadow: 0 0 0 2px rgba(19, 206, 202, 0.15);\n        }\n\n        .btn-clean {\n            height: 42px;\n\n            border: 1px solid #d2d8df;\n\n            background: white;\n\n            padding: 0 16px;\n\n            border-radius: 7px;\n\n            cursor: pointer;\n\n            font-weight: bold;\n        }\n\n\n        /* =========================================================\n           TABLA\n        ========================================================= */\n\n        .table-container {\n            overflow-x: auto;\n        }\n\n        table {\n            width: 100%;\n            border-collapse: collapse;\n\n            min-width: 850px;\n        }\n\n        thead {\n            background: #cff4f4;\n        }\n\n        th {\n            padding: 11px 8px;\n\n            font-size: 12px;\n            text-transform: uppercase;\n\n            border: 1px solid #d7e1e2;\n\n            color: #18202a;\n        }\n\n        td {\n            padding: 10px 8px;\n\n            font-size: 13px;\n            text-align: center;\n\n            border: 1px solid #e0e3e7;\n        }\n\n        tbody tr:hover {\n            background: #f7ffff;\n        }\n\n        .product-name {\n            display: flex;\n            align-items: center;\n\n            gap: 10px;\n\n            text-align: left;\n        }\n\n        .product-mini {\n            width: 40px;\n            height: 40px;\n\n            border-radius: 6px;\n\n            background: #edf2f4;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n\n            font-size: 25px;\n        }\n\n\n        /* =========================================================\n           ESTADOS\n        ========================================================= */\n\n        .status {\n            display: inline-block;\n\n            min-width: 92px;\n\n            padding: 7px 10px;\n\n            border-radius: 20px;\n\n            color: white;\n\n            font-size: 11px;\n            font-weight: bold;\n        }\n\n        .status.completed {\n            background: #50c85a;\n        }\n\n        .status.process {\n            background: #ffa500;\n        }\n\n        .status.pending {\n            background: #328fea;\n        }\n\n        .status.cancelled {\n            background: #ef4545;\n        }\n\n\n        /* =========================================================\n           BOTONES DE TABLA\n        ========================================================= */\n\n        .table-actions {\n            display: flex;\n            justify-content: center;\n\n            gap: 6px;\n        }\n\n        .action-btn {\n            width: 32px;\n            height: 32px;\n\n            border: none;\n            border-radius: 6px;\n\n            cursor: pointer;\n\n            color: white;\n\n            font-size: 15px;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n        }\n\n        .view {\n            background: #12d9d4;\n        }\n\n        .edit {\n            background: #0878e8;\n        }\n\n        .delete {\n            background: #e52c2c;\n        }\n\n\n        /* =========================================================\n           PAGINACIÓN\n        ========================================================= */\n\n        .pagination-area {\n            margin-top: 14px;\n\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n\n            gap: 10px;\n\n            font-size: 12px;\n        }\n\n        .pagination {\n            display: flex;\n            align-items: center;\n\n            gap: 5px;\n        }\n\n        .page-button {\n            min-width: 38px;\n            height: 38px;\n\n            border: 1px solid #d9dfe4;\n\n            background: white;\n\n            border-radius: 7px;\n\n            cursor: pointer;\n        }\n\n        .page-button.active {\n            background: #13ddd9;\n            color: #05102c;\n\n            border-color: #13ddd9;\n\n            font-weight: bold;\n        }\n\n\n        /* =========================================================\n           PANEL DERECHO\n        ========================================================= */\n\n        .right-column {\n            display: flex;\n            flex-direction: column;\n\n            gap: 16px;\n        }\n\n\n        /* =========================================================\n           GRÁFICO CIRCULAR\n        ========================================================= */\n\n        .summary-content {\n            display: flex;\n\n            align-items: center;\n            justify-content: space-around;\n\n            gap: 15px;\n        }\n\n        .donut-chart {\n            width: 180px;\n            height: 180px;\n\n            border-radius: 50%;\n\n            background:\n                conic-gradient(\n                    #55c962 0% 46.5%,\n                    #ffa500 46.5% 76.7%,\n                    #378ce2 76.7% 93%,\n                    #e64b4b 93% 100%\n                );\n\n            position: relative;\n\n            flex-shrink: 0;\n        }\n\n        .donut-chart::after {\n            content: \"\";\n\n            position: absolute;\n\n            width: 92px;\n            height: 92px;\n\n            background: white;\n\n            border-radius: 50%;\n\n            top: 50%;\n            left: 50%;\n\n            transform: translate(-50%, -50%);\n        }\n\n        .donut-text {\n            position: absolute;\n\n            top: 50%;\n            left: 50%;\n\n            transform: translate(-50%, -50%);\n\n            text-align: center;\n\n            z-index: 2;\n        }\n\n        .donut-text span {\n            font-size: 12px;\n        }\n\n        .donut-text strong {\n            display: block;\n\n            font-size: 26px;\n\n            color: #27313d;\n        }\n\n        .legend {\n            display: flex;\n            flex-direction: column;\n\n            gap: 13px;\n\n            font-size: 12px;\n        }\n\n        .legend-item {\n            display: flex;\n            align-items: center;\n\n            gap: 8px;\n        }\n\n        .legend-dot {\n            width: 11px;\n            height: 11px;\n\n            border-radius: 50%;\n        }\n\n        .green {\n            background: #55c962;\n        }\n\n        .orange {\n            background: #ffa500;\n        }\n\n        .blue {\n            background: #378ce2;\n        }\n\n        .red {\n            background: #e64b4b;\n        }\n\n        .period {\n            text-align: center;\n\n            margin-top: 17px;\n\n            font-size: 12px;\n        }\n\n        .period strong {\n            display: block;\n\n            color: #0878ef;\n\n            margin-top: 5px;\n        }\n\n\n        /* =========================================================\n           PRÓXIMAS TAREAS\n        ========================================================= */\n\n        .task {\n            display: grid;\n\n            grid-template-columns: 42px 1fr auto;\n\n            gap: 10px;\n\n            align-items: center;\n\n            padding: 12px 0;\n\n            border-bottom: 1px solid #ececec;\n        }\n\n        .task-icon {\n            width: 36px;\n            height: 36px;\n\n            border-radius: 50%;\n\n            display: flex;\n            align-items: center;\n            justify-content: center;\n\n            color: white;\n\n            font-size: 17px;\n        }\n\n        .task-info strong {\n            display: block;\n\n            font-size: 12px;\n        }\n\n        .task-info span {\n            display: block;\n\n            margin-top: 4px;\n\n            font-size: 10px;\n            color: #68707b;\n        }\n\n        .task-right {\n            text-align: right;\n        }\n\n        .task-date {\n            font-size: 10px;\n\n            display: block;\n\n            margin-bottom: 5px;\n        }\n\n        .priority {\n            padding: 5px 10px;\n\n            border-radius: 15px;\n\n            color: white;\n\n            font-size: 10px;\n            font-weight: bold;\n        }\n\n        .priority-high {\n            background: #e73e3e;\n        }\n\n        .priority-medium {\n            background: #ffae17;\n        }\n\n        .priority-low {\n            background: #52bd5d;\n        }\n\n        .view-all {\n            display: block;\n\n            text-align: center;\n\n            margin-top: 16px;\n\n            color: #0878ef;\n\n            font-size: 12px;\n            font-weight: bold;\n        }\n\n\n        /* =========================================================\n           PIE DE PÁGINA\n        ========================================================= */\n\n        .footer {\n            margin-top: 18px;\n\n            font-size: 12px;\n\n            color: #17212b;\n        }\n\n\n        /* =========================================================\n           MODAL NUEVA PRODUCCIÓN\n        ========================================================= */\n\n        .modal {\n            position: fixed;\n\n            inset: 0;\n\n            background: rgba(2, 5, 36, 0.65);\n\n            display: none;\n\n            align-items: center;\n            justify-content: center;\n\n            z-index: 5000;\n        }\n\n        .modal.show {\n            display: flex;\n        }\n\n        .modal-content {\n            width: min(560px, 92%);\n\n            background: white;\n\n            border-radius: 15px;\n\n            overflow: hidden;\n\n            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);\n        }\n\n        .modal-header {\n            background: #050733;\n\n            color: white;\n\n            padding: 18px 20px;\n\n            display: flex;\n            align-items: center;\n            justify-content: space-between;\n        }\n\n        .modal-header h3 {\n            font-size: 20px;\n        }\n\n        .close-modal {\n            border: none;\n\n            background: transparent;\n            color: white;\n\n            font-size: 26px;\n\n            cursor: pointer;\n        }\n\n        .modal-body {\n            padding: 20px;\n        }\n\n        .form-grid {\n            display: grid;\n\n            grid-template-columns: 1fr 1fr;\n\n            gap: 14px;\n        }\n\n        .form-group {\n            display: flex;\n            flex-direction: column;\n\n            gap: 6px;\n        }\n\n        .form-group.full {\n            grid-column: 1 / -1;\n        }\n\n        .form-group label {\n            font-size: 13px;\n            font-weight: bold;\n        }\n\n        .form-group input,\n        .form-group select {\n            height: 42px;\n\n            border: 1px solid #cfd6dc;\n\n            border-radius: 7px;\n\n            padding: 0 10px;\n\n            outline: none;\n        }\n\n        .modal-footer {\n            padding: 15px 20px;\n\n            display: flex;\n            justify-content: flex-end;\n\n            gap: 10px;\n\n            border-top: 1px solid #eee;\n        }\n\n        .btn-cancel {\n            background: #e4e7eb;\n            color: #27313d;\n        }\n\n\n        /* =========================================================\n           RESPONSIVE\n        ========================================================= */\n\n        @media (max-width: 1250px) {\n\n            .stats-grid {\n                grid-template-columns: repeat(2, 1fr);\n            }\n\n            .dashboard-grid {\n                grid-template-columns: 1fr;\n            }\n\n            .right-column {\n                display: grid;\n                grid-template-columns: 1fr 1fr;\n            }\n\n        }\n\n        @media (max-width: 900px) {\n\n            .header {\n                height: 85px;\n            }\n\n            .logo-box {\n                width: 90px;\n                height: 65px;\n            }\n\n            .separator {\n                display: none;\n            }\n\n            .brand h1 {\n                font-size: 20px;\n            }\n\n            .brand p {\n                font-size: 12px;\n            }\n\n            .administrator-info {\n                display: none;\n            }\n\n            .sidebar {\n                top: 85px;\n\n                width: 80px;\n\n                padding: 15px 8px;\n            }\n\n            .sidebar-title {\n                display: none;\n            }\n\n            .menu a {\n                justify-content: center;\n\n                padding: 15px 5px;\n            }\n\n            .menu a span:not(.menu-icon) {\n                display: none;\n            }\n\n            .main {\n                margin-left: 80px;\n                padding-top: 85px;\n            }\n\n            .filters {\n                grid-template-columns: 1fr 1fr;\n            }\n\n            .page-title h2 {\n                font-size: 28px;\n            }\n\n        }\n\n        @media (max-width: 650px) {\n\n            .content {\n                padding: 15px;\n            }\n\n            .stats-grid {\n                grid-template-columns: 1fr;\n            }\n\n            .filters {\n                grid-template-columns: 1fr;\n            }\n\n            .right-column {\n                grid-template-columns: 1fr;\n            }\n\n            .summary-content {\n                flex-direction: column;\n            }\n\n            .form-grid {\n                grid-template-columns: 1fr;\n            }\n\n            .form-group.full {\n                grid-column: auto;\n            }\n\n        }\n    </style>\n</head>\n<body>\n<!-- =========================================================\n         ENCABEZADO\n    ========================================================== -->\n<header class=\"header\">\n<div class=\"header-left\">\n<div class=\"logo-box\">\n<img alt=\"Proactiva Tu Negocio\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAGkAiADASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAEFBgIEBwMI/8QAGwEBAAIDAQEAAAAAAAAAAAAAAAEDAgQFBgf/2gAMAwEAAhADEAAAAbUmvn  class=\"page-title\">\n<h2>\n                    MÓDULO DE PRODUCCIÓN\n                </h2>\n<p>\n<strong>GESTIONA PRODUCTOS, LOTES, STOCK Y ORDENES DE PRODUCCION<strong>\n</strong></strong></p>\n</section>\n<div class=\"dashboard-grid\">\n<!-- =================================================\n                     COLUMNA IZQUIERDA\n                ================================================== -->\n<section>\n<!-- TARJETAS -->\n<div class=\"stats-grid\">\n<div class=\"stat-card\">\n<div class=\"stat-icon\">\n                                📦\n                            </div>\n<div class=\"stat-info\">\n<h3>Productos</h3>\n<div class=\"stat-number\" id=\"contadorProductos\">\n<span id=\"totalProductos\">0</span>\n</div>\n<p>Total registrados</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon\">\n                                🏭\n                            </div>\n<div class=\"stat-info\">\n<h3>Producción hoy</h3>\n<div class=\"stat-number\">\n<span id=\"produccionHoy\">0</span>\n</div>\n<p>Unidades producidas</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon\">\n                                📦\n                            </div>\n<div class=\"stat-info\">\n<h3>Lotes activos</h3>\n<div class=\"stat-number\">\n<span id=\"lotesActivos\">0</span>\n</div>\n<p>En proceso</p>\n</div>\n</div>\n<div class=\"stat-card\">\n<div class=\"stat-icon\">\n                                ⚠\n                            </div>\n<div class=\"stat-info\">\n<h3>Stock bajo</h3>\n<div class=\"stat-number\">\n<span id=\"stockBajo\">0</span>\n</div>\n<p>Requieren reposición</p>\n</div>\n</div>\n</div>\n<!-- BOTONES -->\n<div class=\"actions\">\n<button class=\"btn btn-green\" onclick=\"abrirModal()\">\n                            ＋ NUEVA PRODUCCIÓN\n                        </button>\n<button class=\"btn btn-white\" onclick=\"exportarProduccion()\">\n                            ↓ EXPORTAR\n                        </button>\n</div>\n<!-- TABLA -->\n<div class=\"panel\">\n<div class=\"panel-title\">\n                            ☷ LISTADO DE PRODUCCIÓN\n                        </div>\n<!-- FILTROS -->\n<div class=\"filters\">\n<input class=\"input-control\" id=\"buscador\" onkeyup=\"filtrarTabla()\" placeholder=\"Buscar producción...\" type=\"text\"/>\n<select class=\"input-control\" id=\"categoriaFiltro\" onchange=\"filtrarTabla()\">\n<option value=\"\">\n                                    Todas las categorías\n                                </option>\n<option value=\"Ladriloos\">\n                                    Ladrillos\n                                </option>\n<option value=\"Ladrillos\">\n                                  Ladrillos\n                                </option>\n<option value=\"Almacén\">\n                                    Almacén\n                                </option>\n<option value=\"Muebles\">\n                                    Material de escritotio\n                                </option>\n</select>\n<select class=\"input-control\" id=\"estadoFiltro\" onchange=\"filtrarTabla()\">\n<option value=\"\">\n                                    Todos los estados\n                                </option>\n<option value=\"Completado\">\n                                    Completado\n                                </option>\n<option value=\"En proceso\">\n                                    En proceso\n                                </option>\n<option value=\"Pendiente\">\n                                    Pendiente\n                                </option>\n<option value=\"Cancelado\">\n                                    Cancelado\n                                </option>\n</select>\n<input class=\"input-control\" type=\"date\"/>\n</div>\n<!-- TABLA -->\n<div class=\"table-container\">\n<table id=\"tablaProduccion\">\n<thead>\n<tr>\n<th>ID</th>\n<th>Producto</th>\n<th>Categoría</th>\n<th>Cantidad</th>\n<th>Fecha</th>\n<th>Estado</th>\n<th>Acciones</th>\n</tr>\n</thead>\n<tbody id=\"tablaBody\">\n<tr>\n<td>\n                                            PRD-0001\n                                        </td>\n<td>\n<div class=\"product-name\">\n<div class=\"product-mini\">\n                                                    🪑\n                                                </div>\n\n                                                Silla Ejecutiva\n\n                                            </div>\n</td>\n<td>Muebles</td>\n<td>50</td>\n<td>08/06/2026</td>\n<td>\n<span class=\"status completed\">\n                                                Completado\n                                            </span>\n</td>\n<td>\n<div class=\"table-actions\">\n<button class=\"action-btn view\" onclick=\"verProduccion('CAJ-0001')\">\n                                                    👁\n                                                </button>\n<button class=\"action-btn edit\" onclick=\"editarProduccion('CAJ-0001-0001')\">\n                                                    ✎\n                                                </button>\n<button class=\"action-btn delete\" onclick=\"eliminarFila(this)\">\n                                                    🗑\n                                                </button>\n</div>\n</td>\n</tr>\n<tr>\n<td>\n                                            PRD-0002\n                                        </td>\n<td>\n<div class=\"product-name\">\n<div class=\"product-mini\">\n                                                    🛋\n                                                </div>\n\n                                                Mesa de Oficina\n\n                                            </div>\n</td>\n<td>Muebles</td>\n<td>30</td>\n<td>08/06/2026</td>\n<td>\n<span class=\"status process\">\n                                                En proceso\n                                            </span>\n</td>\n<td>\n<div class=\"table-actions\">\n<button class=\"action-btn view\" onclick=\"verProduccion('PRD-0002')\">\n                                                    👁\n                                                </button>\n<button class=\"action-btn edit\" onclick=\"editarProduccion('PRD-0002')\">\n                                                    ✎\n                                                </button>\n<button class=\"action-btn delete\" onclick=\"eliminarFila(this)\">\n                                                    🗑\n                                                </button>\n</div>\n</td>\n</tr>\n<tr>\n<td>\n                                            PRD-0003\n                                        </td>\n<td>\n<div class=\"product-name\">\n<div class=\"product-mini\">\n                                                    🗄\n                                                </div>\n\n                                                Archivador Metal\n\n                                            </div>\n</td>\n<td>Oficina</td>\n<td>20</td>\n<td>07/06/2026</td>\n<td>\n<span class=\"status process\">\n                                                En proceso\n                                            </span>\n</td>\n<td>\n<div class=\"table-actions\">\n<button class=\"action-btn view\" onclick=\"verProduccion('PRD-0003')\">\n                                                    👁\n                                                </button>\n<button class=\"action-btn edit\" onclick=\"editarProduccion('PRD-0003')\">\n                                                    ✎\n                                                </button>\n<button class=\"action-btn delete\" onclick=\"eliminarFila(this)\">\n                                                    🗑\n                                                </button>\n</div>\n</td>\n</tr>\n<tr>\n<td>\n                                            PRD-0004\n                                        </td>\n<td>\n<div class=\"product-name\">\n<div class=\"product-mini\">\n                                                    🧰\n                                                </div>\n\n                                                Estante Metálico\n\n                                            </div>\n</td>\n<td>Almacén</td>\n<td>15</td>\n<td>07/06/2026</td>\n<td>\n<span class=\"status pending\">\n                                                Pendiente\n                                            </span>\n</td>\n<td>\n<div class=\"table-actions\">\n<button class=\"action-btn view\" onclick=\"verProduccion('PRD-0004')\">\n                                                    👁\n                                                </button>\n<button class=\"action-btn edit\" onclick=\"editarProduccion('PRD-0004')\">\n                                                    ✎\n                                                </button>\n<button class=\"action-btn delete\" onclick=\"eliminarFila(this)\">\n                                                    🗑\n                                                </button>\n</div>\n</td>\n</tr>\n<tr>\n<td>\n                                            PRD-0005\n                                        </td>\n<td>\n<div class=\"product-name\">\n<div class=\"product-mini\">\n                                                    🗃\n                                                </div>\n\n                                                Cajonera Rodante\n\n                                            </div>\n</td>\n<td>Oficina</td>\n<td>25</td>\n<td>06/06/2026</td>\n<td>\n<span class=\"status completed\">\n                                                Completado\n                                            </span>\n</td>\n<td>\n<div class=\"table-actions\">\n<button class=\"action-btn view\" onclick=\"verProduccion('PRD-0005')\">\n                                                    👁\n                                                </button>\n<button class=\"action-btn edit\" onclick=\"editarProduccion('PRD-0005')\">\n                                                    ✎\n                                                </button>\n<button class=\"action-btn delete\" onclick=\"eliminarFila(this)\">\n                                                    🗑\n                                                </button>\n</div>\n</td>\n</tr>\n</tbody>\n</table>\n</div>\n<!-- PAGINACIÓN -->\n<div class=\"pagination-area\">\n<span id=\"contadorRegistros\">\n                                Mostrando 1 a 5 de 5 registros\n                            </span>\n<div class=\"pagination\">\n<button class=\"page-button\">\n                                    ‹\n                                </button>\n<button class=\"page-button active\">\n                                    1\n                                </button>\n<button class=\"page-button\">\n                                    ›\n                                </button>\n</div>\n</div>\n</div>\n</section>\n<!-- =================================================\n                     COLUMNA DERECHA\n                ================================================== -->\n<aside class=\"right-column\">\n<!-- TAREAS -->\n<div class=\"panel\">\n<div class=\"panel-title\">\n                            📋 PRÓXIMAS TAREAS\n                        </div>\n<div class=\"task\">\n<div class=\"task-icon\" style=\"background:#10bab6;\">\n                                ◷\n                            </div>\n<div class=\"task-info\">\n<strong>\n                                    Revisar lote L-00015\n                                </strong>\n<span>\n                                    Inspección de calidad\n                                </span>\n</div>\n<div class=\"task-right\">\n<span class=\"task-date\">\n                                    09/06/2026\n                                </span>\n<span class=\"priority priority-medium\">\n                                    Media\n                                </span>\n</div>\n</div>\n<div class=\"task\">\n<div class=\"task-icon\" style=\"background:#42b94d;\">\n                                🛒\n                            </div>\n<div class=\"task-info\">\n<strong>\n                                    Comprar materia prima\n                                </strong>\n<span>\n                                    Tornillos y herrajes\n                                </span>\n</div>\n<div class=\"task-right\">\n<span class=\"task-date\">\n                                    10/06/2026\n                                </span>\n<span class=\"priority priority-high\">\n                                    Alta\n                                </span>\n</div>\n</div>\n<div class=\"task\">\n<div class=\"task-icon\" style=\"background:#347fd4;\">\n                                🔧\n                            </div>\n<div class=\"task-info\">\n<strong>\n                                    Mantenimiento máquina 2\n                                </strong>\n<span>\n                                    Revisión preventiva\n                                </span>\n</div>\n<div class=\"task-right\">\n<span class=\"task-date\">\n                                    11/06/2026\n                                </span>\n<span class=\"priority priority-medium\">\n                                    Media\n                                </span>\n</div>\n</div>\n<div class=\"task\">\n<div class=\"task-icon\" style=\"background:#7b58ce;\">\n                                📦\n                            </div>\n<div class=\"task-info\">\n<strong>\n                                    Empaquetar lote L-00016\n                                </strong>\n<span>\n                                    Listo para despacho\n                                </span>\n</div>\n<div class=\"task-right\">\n<span class=\"task-date\">\n                                    12/06/2026\n                                </span>\n<span class=\"priority priority-low\">\n                                    Baja\n                                </span>\n</div>\n</div>\n<a class=\"view-all\" href=\"#\">\n                            Ver todas las tareas →\n                        </a>\n</div>\n</aside>\n</div>\n<!-- PIE -->\n<footer class=\"footer\">\n\n                © 2026\n                <strong>\n                    Proactiva Tu Negocio.\n                </strong>\n\n                Todos los derechos reservados.\n\n            </footer>\n</div>\n</main>\n<!-- =========================================================\n         MODAL NUEVA PRODUCCIÓN\n    ========================================================== -->\n<div class=\"modal\" id=\"modalProduccion\">\n<div class=\"modal-content\">\n<div class=\"modal-header\">\n<h3>\n                    Nueva Producción\n                </h3>\n<button class=\"close-modal\" onclick=\"cerrarModal()\">\n                    ×\n                </button>\n</div>\n<form id=\"formProduccion\" onsubmit=\"guardarProduccion(event)\">\n<div class=\"modal-body\">\n<div class=\"form-grid\">\n<div class=\"form-group\">\n<label>\n                                Producto\n                            </label>\n<input id=\"producto\" placeholder=\"Nombre del producto\" required=\"\" type=\"text\"/>\n</div>\n<div class=\"form-group\">\n<label>\n                                Categoría\n                            </label>\n<select id=\"categoria\" required=\"\">\n<option value=\"\">\n                                    Seleccionar\n                                </option>\n<option value=\"Muebles\">\n                                    Muebles\n                                </option>\n<option value=\"Oficina\">\n                                    Oficina\n                                </option>\n<option value=\"Almacén\">\n                                    Almacén\n                                </option>\n</select>\n</div>\n<div class=\"form-group\">\n<label>\n                                Cantidad\n                            </label>\n<input id=\"cantidad\" min=\"1\" required=\"\" type=\"number\"/>\n</div>\n<div class=\"form-group\">\n<label>\n                                Fecha\n                            </label>\n<input id=\"fecha\" required=\"\" type=\"date\"/>\n</div>\n<div class=\"form-group full\">\n<label>\n                                Estado\n                            </label>\n<select id=\"estado\" required=\"\">\n<option value=\"Pendiente\">\n                                    Pendiente\n                                </option>\n<option value=\"En proceso\">\n                                    En proceso\n                                </option>\n<option value=\"Completado\">\n                                    Completado\n                                </option>\n</select>\n</div>\n</div>\n</div>\n<div class=\"modal-footer\">\n<button class=\"btn btn-cancel\" onclick=\"cerrarModal()\" type=\"button\">\n                        Cancelar\n                    </button>\n<button class=\"btn btn-green\" type=\"submit\">\n                        Guardar producción\n                    </button>\n</div>\n</form>\n</div>\n</div>\n<!-- =========================================================\n         JAVASCRIPT\n    ========================================================== -->\n<script>\n\n        /* =========================================================\n           JAVASCRIPT PRINCIPAL - PRODUCCIÓN\n           Los registros se guardan en localStorage del navegador.\n        ========================================================= */\n\n        const CLAVE_PRODUCCIONES = \"producciones\";\n\n        function obtenerProducciones() {\n            try {\n                const datos = JSON.parse(localStorage.getItem(CLAVE_PRODUCCIONES));\n                return Array.isArray(datos) ? datos : [];\n            } catch (error) {\n                console.error(\"Error leyendo producciones:\", error);\n                return [];\n            }\n        }\n\n        function guardarProducciones(producciones) {\n            localStorage.setItem(\n                CLAVE_PRODUCCIONES,\n                JSON.stringify(producciones)\n            );\n        }\n\n        function claseEstado(estado) {\n            if (estado === \"Completado\") return \"completed\";\n            if (estado === \"En proceso\") return \"process\";\n            if (estado === \"Cancelado\") return \"cancelled\";\n            return \"pending\";\n        }\n\n        function escaparHTML(texto) {\n            return String(texto)\n                .replace(/&/g, \"&amp;\")\n                .replace(/</g, \"&lt;\")\n                .replace(/>/g, \"&gt;\")\n                .replace(/\"/g, \"&quot;\")\n                .replace(/'/g, \"&#039;\");\n        }\n\n        function formatearFecha(fecha) {\n            if (!fecha) return \"\";\n            const partes = fecha.split(\"-\");\n            if (partes.length !== 3) return fecha;\n            return `${partes[2]}/${partes[1]}/${partes[0]}`;\n        }\n\n        function fechaParaInput(fecha) {\n            if (!fecha) return \"\";\n            if (fecha.includes(\"-\")) return fecha;\n            const partes = fecha.split(\"/\");\n            if (partes.length !== 3) return \"\";\n            return `${partes[2]}-${partes[1].padStart(2,\"0\")}-${partes[0].padStart(2,\"0\")}`;\n        }\n\n        /* =========================================================\n           INICIALIZAR LOS 5 REGISTROS QUE YA EXISTEN EN EL HTML\n           Solo se hace una vez, cuando todavía no hay datos guardados.\n        ========================================================= */\n\n        function inicializarDatos() {\n            const existentes = localStorage.getItem(CLAVE_PRODUCCIONES);\n\n            if (existentes !== null) return;\n\n            const filas = document.querySelectorAll(\"#tablaBody tr\");\n            const producciones = [];\n\n            filas.forEach(function (fila) {\n                const celdas = fila.querySelectorAll(\"td\");\n                if (celdas.length < 6) return;\n\n                const id = celdas[0].innerText.trim();\n                const producto = celdas[1].innerText.trim();\n                const categoria = celdas[2].innerText.trim();\n                const cantidad = Number(celdas[3].innerText.trim()) || 0;\n                const fechaTexto = celdas[4].innerText.trim();\n                const estado = celdas[5].innerText.trim();\n\n                let fecha = fechaParaInput(fechaTexto);\n\n                const icono = celdas[1].querySelector(\".product-mini\");\n                const icon = icono ? icono.innerText.trim() : \"📦\";\n\n                producciones.push({\n                    id,\n                    producto,\n                    categoria,\n                    cantidad,\n                    fecha,\n                    estado,\n                    icon\n                });\n            });\n\n            guardarProducciones(producciones);\n        }\n\n        /* =========================================================\n           RENDERIZAR LA TABLA DESDE LOS DATOS GUARDADOS\n        ========================================================= */\n\n        function renderizarTabla() {\n            const tbody = document.getElementById(\"tablaBody\");\n            if (!tbody) return;\n\n            const producciones = obtenerProducciones();\n\n            tbody.innerHTML = \"\";\n\n            producciones.forEach(function (p) {\n                const fila = document.createElement(\"tr\");\n\n                fila.innerHTML = `\n                    <td>${escaparHTML(p.id)}</td>\n                    <td>\n                        <div class=\"product-name\">\n                            <div class=\"product-mini\">${escaparHTML(p.icon || \"📦\")}</div>\n                            ${escaparHTML(p.producto)}\n                        </div>\n                    </td>\n                    <td>${escaparHTML(p.categoria)}</td>\n                    <td>${Number(p.cantidad) || 0}</td>\n                    <td>${escaparHTML(formatearFecha(p.fecha))}</td>\n                    <td>\n                        <span class=\"status ${claseEstado(p.estado)}\">\n                            ${escaparHTML(p.estado)}\n                        </span>\n                    </td>\n                    <td>\n                        <div class=\"table-actions\">\n                            <button class=\"action-btn view\" onclick=\"verProduccion('${escaparHTML(p.id)}')\">👁</button>\n                            <button class=\"action-btn edit\" onclick=\"editarProduccion('${escaparHTML(p.id)}')\">✎</button>\n                            <button class=\"action-btn delete\" onclick=\"eliminarProduccion('${escaparHTML(p.id)}')\">🗑</button>\n                        </div>\n                    </td>\n                `;\n\n                tbody.appendChild(fila);\n            });\n\n            filtrarTabla();\n            actualizarContador();\n            actualizarTarjetas();\n        }\n\n        /* =========================================================\n           MODAL\n        ========================================================= */\n\n        function abrirModal() {\n            document.getElementById(\"modalProduccion\").classList.add(\"show\");\n        }\n\n        function cerrarModal() {\n            document.getElementById(\"modalProduccion\").classList.remove(\"show\");\n        }\n\n        /* =========================================================\n           CREAR NUEVA PRODUCCIÓN\n        ========================================================= */\n\n        function siguienteId(producciones) {\n            let mayor = 0;\n\n            producciones.forEach(function (p) {\n                const numero = parseInt(String(p.id).replace(/\\D/g, \"\"), 10);\n                if (!isNaN(numero) && numero > mayor) mayor = numero;\n            });\n\n            return \"PRD-\" + String(mayor + 1).padStart(4, \"0\");\n        }\n\n        function guardarProduccion(event) {\n            event.preventDefault();\n\n            const producto = document.getElementById(\"producto\").value.trim();\n            const categoria = document.getElementById(\"categoria\").value;\n            const cantidad = Number(document.getElementById(\"cantidad\").value);\n            const fecha = document.getElementById(\"fecha\").value;\n            const estado = document.getElementById(\"estado\").value;\n\n            if (!producto || !categoria || !cantidad || !fecha || !estado) {\n                alert(\"Complete todos los campos obligatorios.\");\n                return;\n            }\n\n            const producciones = obtenerProducciones();\n\n            const nuevaProduccion = {\n                id: siguienteId(producciones),\n                producto,\n                categoria,\n                cantidad,\n                fecha,\n                estado,\n                icon: \"📦\"\n            };\n\n            producciones.push(nuevaProduccion);\n            guardarProducciones(producciones);\n\n            document.getElementById(\"formProduccion\").reset();\n            cerrarModal();\n            renderizarTabla();\n\n            alert(\"Producción registrada y guardada correctamente.\");\n        }\n\n        /* =========================================================\n           VER PRODUCCIÓN\n        ========================================================= */\n\n        function verProduccion(id) {\n            const producciones = obtenerProducciones();\n            const p = producciones.find(function (item) {\n                return item.id === id;\n            });\n\n            if (!p) return;\n\n            alert(\n                \"DETALLE DE PRODUCCIÓN\\n\\n\" +\n                \"ID: \" + p.id + \"\\n\" +\n                \"Producto: \" + p.producto + \"\\n\" +\n                \"Categoría: \" + p.categoria + \"\\n\" +\n                \"Cantidad: \" + p.cantidad + \"\\n\" +\n                \"Fecha: \" + formatearFecha(p.fecha) + \"\\n\" +\n                \"Estado: \" + p.estado\n            );\n        }\n\n        /* =========================================================\n           EDITAR PRODUCCIÓN\n        ========================================================= */\n\n        function editarProduccion(id) {\n            const producciones = obtenerProducciones();\n            const p = producciones.find(function (item) {\n                return item.id === id;\n            });\n\n            if (!p) {\n                alert(\"No se encontró el registro.\");\n                return;\n            }\n\n            document.getElementById(\"producto\").value = p.producto;\n            document.getElementById(\"categoria\").value = p.categoria;\n            document.getElementById(\"cantidad\").value = p.cantidad;\n            document.getElementById(\"fecha\").value = fechaParaInput(p.fecha);\n            document.getElementById(\"estado\").value = p.estado;\n\n            const formulario = document.getElementById(\"formProduccion\");\n            formulario.dataset.editando = id;\n\n            abrirModal();\n\n            const botonGuardar = formulario.querySelector('button[type=\"submit\"]');\n            botonGuardar.innerText = \"Guardar cambios\";\n        }\n\n        /* =========================================================\n           MODIFICAR GUARDAR PARA NUEVO / EDICIÓN\n        ========================================================= */\n\n        document.addEventListener(\"DOMContentLoaded\", function () {\n            const formulario = document.getElementById(\"formProduccion\");\n\n            formulario.addEventListener(\"submit\", function (event) {\n                event.preventDefault();\n\n                const idEditando = formulario.dataset.editando;\n\n                if (!idEditando) {\n                    guardarProduccion(event);\n                    return;\n                }\n\n                const producciones = obtenerProducciones();\n                const indice = producciones.findIndex(function (p) {\n                    return p.id === idEditando;\n                });\n\n                if (indice === -1) return;\n\n                producciones[indice].producto = document.getElementById(\"producto\").value.trim();\n                producciones[indice].categoria = document.getElementById(\"categoria\").value;\n                producciones[indice].cantidad = Number(document.getElementById(\"cantidad\").value);\n                producciones[indice].fecha = document.getElementById(\"fecha\").value;\n                producciones[indice].estado = document.getElementById(\"estado\").value;\n\n                guardarProducciones(producciones);\n\n                delete formulario.dataset.editando;\n                formulario.reset();\n                cerrarModal();\n\n                formulario.querySelector('button[type=\"submit\"]').innerText = \"Guardar producción\";\n\n                renderizarTabla();\n                alert(\"Producción actualizada y guardada correctamente.\");\n            });\n\n            inicializarDatos();\n            renderizarTabla();\n        });\n\n        /* =========================================================\n           ELIMINAR\n        ========================================================= */\n\n        function eliminarProduccion(id) {\n            const confirmar = confirm(\"¿Está seguro de eliminar el registro \" + id + \"?\");\n            if (!confirmar) return;\n\n            let producciones = obtenerProducciones();\n            producciones = producciones.filter(function (p) {\n                return p.id !== id;\n            });\n\n            guardarProducciones(producciones);\n            renderizarTabla();\n\n            alert(\"Registro eliminado correctamente.\");\n        }\n\n        /* Compatibilidad con botones antiguos */\n        function eliminarFila(boton) {\n            const fila = boton.closest(\"tr\");\n            if (!fila) return;\n\n            const id = fila.children[0].innerText.trim();\n            eliminarProduccion(id);\n        }\n\n        /* =========================================================\n           BUSCADOR Y FILTROS\n        ========================================================= */\n\n        function filtrarTabla() {\n            const texto = (document.getElementById(\"buscador\")?.value || \"\").toLowerCase().trim();\n            const categoria = (document.getElementById(\"categoriaFiltro\")?.value || \"\").toLowerCase();\n            const estado = (document.getElementById(\"estadoFiltro\")?.value || \"\").toLowerCase();\n            const fechaFiltro = document.querySelector('.filters input[type=\"date\"]')?.value || \"\";\n\n            const filas = document.querySelectorAll(\"#tablaBody tr\");\n\n            filas.forEach(function (fila) {\n                const columnas = fila.querySelectorAll(\"td\");\n                if (columnas.length < 6) return;\n\n                const contenido = fila.innerText.toLowerCase();\n                const categoriaFila = columnas[2].innerText.trim().toLowerCase();\n                const estadoFila = columnas[5].innerText.trim().toLowerCase();\n                const fechaFila = fechaParaInput(columnas[4].innerText.trim());\n\n                const coincideTexto = contenido.includes(texto);\n                const coincideCategoria = !categoria || categoriaFila === categoria;\n                const coincideEstado = !estado || estadoFila.includes(estado);\n                const coincideFecha = !fechaFiltro || fechaFila === fechaFiltro;\n\n                fila.style.display =\n                    coincideTexto && coincideCategoria && coincideEstado && coincideFecha\n                        ? \"\"\n                        : \"none\";\n            });\n\n            actualizarContador();\n        }\n\n        function limpiarFiltros() {\n            const buscador = document.getElementById(\"buscador\");\n            const categoria = document.getElementById(\"categoriaFiltro\");\n            const estado = document.getElementById(\"estadoFiltro\");\n            const fecha = document.querySelector('.filters input[type=\"date\"]');\n\n            if (buscador) buscador.value = \"\";\n            if (categoria) categoria.value = \"\";\n            if (estado) estado.value = \"\";\n            if (fecha) fecha.value = \"\";\n\n            filtrarTabla();\n        }\n\n        /* =========================================================\n           CONTADOR\n        ========================================================= */\n\n        function actualizarContador() {\n            const todas = document.querySelectorAll(\"#tablaBody tr\");\n            const visibles = Array.from(todas).filter(function (fila) {\n                return fila.style.display !== \"none\";\n            });\n\n            const contador = document.getElementById(\"contadorRegistros\");\n            if (contador) {\n                contador.innerText =\n                    \"Mostrando \" + visibles.length + \" de \" + todas.length + \" registros\";\n            }\n        }\n\n        /* =========================================================\n           TARJETAS SUPERIORES\n        ========================================================= */\n\n        function actualizarTarjetas() {\n            const producciones = obtenerProducciones();\n\n            const nombres = new Set(\n                producciones.map(function (p) {\n                    return String(p.producto || \"\").toLowerCase().trim();\n                }).filter(Boolean)\n            );\n\n            const totalProductos = document.getElementById(\"totalProductos\");\n            if (totalProductos) totalProductos.innerText = nombres.size;\n\n            const hoy = new Date();\n            const fechaHoy =\n                hoy.getFullYear() + \"-\" +\n                String(hoy.getMonth() + 1).padStart(2, \"0\") + \"-\" +\n                String(hoy.getDate()).padStart(2, \"0\");\n\n            const totalHoy = producciones.reduce(function (total, p) {\n                if (p.fecha === fechaHoy && p.estado !== \"Cancelado\") {\n                    return total + (Number(p.cantidad) || 0);\n                }\n                return total;\n            }, 0);\n\n            const produccionHoy = document.getElementById(\"produccionHoy\");\n            if (produccionHoy) produccionHoy.innerText = totalHoy;\n\n            const lotesActivos = document.getElementById(\"lotesActivos\");\n            if (lotesActivos) {\n                lotesActivos.innerText = producciones.filter(function (p) {\n                    return p.estado === \"En proceso\";\n                }).length;\n            }\n        }\n\n        /* =========================================================\n           EXPORTAR\n        ========================================================= */\n\n        function exportarProduccion() {\n            const producciones = obtenerProducciones();\n\n            if (producciones.length === 0) {\n                alert(\"No existen registros para exportar.\");\n                return;\n            }\n\n            let csv = \"ID;Producto;Categoria;Cantidad;Fecha;Estado\\n\";\n\n            producciones.forEach(function (p) {\n                csv += [\n                    p.id,\n                    p.producto,\n                    p.categoria,\n                    p.cantidad,\n                    formatearFecha(p.fecha),\n                    p.estado\n                ].join(\";\") + \"\\n\";\n            });\n\n            const archivo = new Blob([\"\\uFEFF\" + csv], {\n                type: \"text/csv;charset=utf-8;\"\n            });\n\n            const enlace = document.createElement(\"a\");\n            const url = URL.createObjectURL(archivo);\n\n            enlace.href = url;\n            enlace.download = \"Reporte_Produccion.csv\";\n            document.body.appendChild(enlace);\n            enlace.click();\n            document.body.removeChild(enlace);\n            URL.revokeObjectURL(url);\n        }\n\n        /* =========================================================\n           CERRAR MODAL AL HACER CLIC AFUERA\n        ========================================================= */\n\n        window.addEventListener(\"click\", function (event) {\n            const modal = document.getElementById(\"modalProduccion\");\n            if (event.target === modal) cerrarModal();\n        });\n\n    <\/script>\n\n<script>\n(function(){\n  function normalizar(s){\n    return (s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').trim();\n  }\n  document.addEventListener('click', function(ev){\n    var a = ev.target.closest && ev.target.closest('a');\n    if(!a) return;\n    var texto = normalizar(a.textContent);\n    var href = normalizar(a.getAttribute('href') || '');\n    var pagina = null;\n    if(texto.includes('inicio') || href.includes('index')) pagina='inicio';\n    else if(texto.includes('produccion') || href.includes('produccion')) pagina='produccion';\n    else if(texto.includes('pedidos') || href.includes('pedidos')) pagina='pedidos';\n    else if(texto.includes('clientes') || href.includes('clientes')) pagina='clientes';\n    else if(texto.includes('ventas') || href.includes('ventas')) pagina='ventas';\n    else if(texto.includes('reportes') || href.includes('reportes')) pagina='reportes';\n    if(pagina){\n      ev.preventDefault();\n      ev.stopPropagation();\n      parent.postMessage({type:'proactiva-nav', page:pagina}, '*');\n    }\n  }, true);\n  parent.postMessage({type:'proactiva-ready', page: document.title || ''}, '*');\n})();\n<\/script>\n</body>\n</html>", "pedidos": "<!DOCTYPE html>\n\n<html lang=\"es\">\n<head>\n<meta charset=\"utf-8\"/>\n<meta content=\"width=device-width, initial-scale=1.0\" name=\"viewport\"/>\n<title>Pedidos | Proactiva Tu Negocio</title>\n<style>\n\n/* =========================================================\n   GENERAL\n========================================================= */\n\n*{\n    box-sizing:border-box;\n    margin:0;\n    padding:0;\n}\n\nbody{\n    font-family:Arial, Helvetica, sans-serif;\n    background:#f5f6f8;\n    color:#1e293b;\n}\n\nbutton,\ninput,\nselect,\ntextarea{\n    font-family:inherit;\n}\n\nbutton{\n    cursor:pointer;\n}\n\na{\n    text-decoration:none;\n}\n\n\n/* =========================================================\n   SIDEBAR\n========================================================= */\n\n.sidebar{\n    width:205px;\n    position:fixed;\n    left:0;\n    top:0;\n    bottom:0;\n    background:#03052f;\n    color:white;\n    padding:20px 10px;\n    overflow:auto;\n}\n\n.logo{\n    width:110px;\n    height:80px;\n    margin:0 auto 30px;\n    background:#ffb400;\n    border-radius:8px;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    overflow:hidden;\n}\n\n.logo img{\n    width:100%;\n    height:100%;\n    object-fit:contain;\n}\n\n.admin{\n    display:flex;\n    gap:10px;\n    align-items:center;\n    margin-bottom:30px;\n}\n\n.admin-avatar{\n    width:45px;\n    height:45px;\n    background:white;\n    border-radius:50%;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    color:#222;\n    font-size:22px;\n}\n\n.admin small{\n    display:block;\n    color:#cbd5e1;\n    margin-top:4px;\n}\n\n.menu{\n    display:flex;\n    flex-direction:column;\n    gap:8px;\n}\n\n.menu a{\n    color:white;\n    padding:14px 12px;\n    border-radius:8px;\n    display:flex;\n    gap:12px;\n    align-items:center;\n}\n\n.menu a:hover{\n    background:#151a55;\n}\n\n.menu a.active{\n    background:#13d7d5;\n    color:#03102f;\n    font-weight:bold;\n}\n\n\n/* =========================================================\n   MAIN\n========================================================= */\n\n.main{\n    margin-left:205px;\n    min-height:100vh;\n}\n\n.header{\n    background:#ffab00;\n    padding:20px 25px;\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n}\n\n.header-brand{\n    display:flex;\n    align-items:center;\n    gap:18px;\n}\n\n.header-logo{\n    width:110px;\n    height:80px;\n    background:#ffb400;\n    border-radius:8px;\n    overflow:hidden;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    flex-shrink:0;\n}\n\n.header-logo img{\n    width:100%;\n    height:100%;\n    object-fit:contain;\n}\n\n.header h1{\n    color:#111827;\n    font-size:30px;\n}\n\n.header p{\n    font-size:13px;\n    margin-top:5px;\n    font-weight:bold;\n}\n\n.content{\n    padding:18px 20px 35px;\n}\n\n\n/* =========================================================\n   KPI\n========================================================= */\n\n.kpis{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:12px;\n}\n\n.kpi{\n    background:white;\n    border-radius:12px;\n    padding:15px;\n    display:flex;\n    gap:12px;\n    align-items:center;\n    box-shadow:0 3px 12px rgba(0,0,0,.08);\n}\n\n.kpi-icon{\n    width:48px;\n    height:48px;\n    border-radius:50%;\n    display:flex;\n    align-items:center;\n    justify-content:center;\n    color:white;\n    font-size:23px;\n    flex-shrink:0;\n}\n\n.kpi h3{\n    font-size:11px;\n}\n\n.kpi-number{\n    font-size:27px;\n    font-weight:900;\n    margin:3px 0;\n}\n\n.kpi p{\n    font-size:11px;\n    color:#64748b;\n}\n\n.blue{background:#1687ef;}\n.orange{background:#ff8a00;}\n.green{background:#1eb45d;}\n.purple{background:#8c42c6;}\n.red{background:#e52f35;}\n\n\n/* =========================================================\n   ACCIONES\n========================================================= */\n\n.actions{\n    display:grid;\n    grid-template-columns:repeat(5,1fr);\n    gap:12px;\n    margin:16px 0;\n}\n\n.btn{\n    border:none;\n    border-radius:7px;\n    padding:12px 15px;\n    color:white;\n    font-weight:bold;\n    box-shadow:0 2px 6px rgba(0,0,0,.12);\n}\n\n.btn-green{background:#16aa42;}\n.btn-blue{background:#1479e8;}\n.btn-orange{background:#ffa500;}\n.btn-red{background:#e52f35;}\n.btn-dark{background:#334155;}\n.btn-gray{\n    background:#e5e7eb;\n    color:#111827;\n}\n\n\n/* =========================================================\n   FILTROS\n========================================================= */\n\n.filters{\n    background:white;\n    padding:15px;\n    border-radius:10px;\n    display:grid;\n    grid-template-columns:1.3fr 1fr 1fr 1fr 1fr auto;\n    gap:10px;\n    box-shadow:0 3px 12px rgba(0,0,0,.07);\n}\n\n.control{\n    height:40px;\n    border:1px solid #d6dbe2;\n    border-radius:6px;\n    padding:0 10px;\n    outline:none;\n}\n\n.control:focus{\n    border-color:#13c7c4;\n}\n\n\n/* =========================================================\n   LAYOUT TABLA / DETALLE\n========================================================= */\n\n.grid{\n    display:grid;\n    grid-template-columns:minmax(0,3fr) minmax(300px,1fr);\n    gap:14px;\n    margin-top:15px;\n}\n\n.panel{\n    background:white;\n    border-radius:10px;\n    overflow:hidden;\n    box-shadow:0 3px 12px rgba(0,0,0,.07);\n}\n\n.panel-title{\n    padding:14px;\n    font-size:15px;\n    font-weight:900;\n    border-bottom:1px solid #e5e7eb;\n}\n\n.table-wrap{\n    overflow:auto;\n}\n\ntable{\n    width:100%;\n    border-collapse:collapse;\n    min-width:800px;\n}\n\nthead{\n    background:#16d8d6;\n    color:#071733;\n}\n\nth,\ntd{\n    border:1px solid #e1e5e9;\n    padding:10px 8px;\n    font-size:12px;\n    text-align:center;\n}\n\ntbody tr{\n    cursor:pointer;\n}\n\ntbody tr:hover{\n    background:#f4ffff;\n}\n\ntbody tr.selected{\n    background:#e5fbfb;\n}\n\n.status{\n    color:white;\n    border-radius:16px;\n    padding:6px 10px;\n    display:inline-block;\n    min-width:82px;\n    font-size:11px;\n    font-weight:bold;\n}\n\n.status-pendiente{background:#ffa30b;}\n.status-proceso{background:#15a955;}\n.status-enviado{background:#8242bd;}\n.status-cancelado{background:#df3035;}\n\n.row-actions{\n    display:flex;\n    justify-content:center;\n    gap:5px;\n}\n\n.icon-btn{\n    border:none;\n    width:30px;\n    height:30px;\n    border-radius:5px;\n    color:white;\n}\n\n.icon-view{background:#078cea;}\n.icon-edit{background:#ffa300;}\n.icon-delete{background:#e82c32;}\n\n\n/* =========================================================\n   DETALLE\n========================================================= */\n\n.detail{\n    padding:15px;\n}\n\n.detail-row{\n    display:grid;\n    grid-template-columns:120px 1fr;\n    gap:8px;\n    margin-bottom:12px;\n    font-size:12px;\n}\n\n.detail-row strong{\n    color:#334155;\n}\n\n.detail-products{\n    border-top:1px solid #ddd;\n    margin-top:15px;\n    padding-top:15px;\n}\n\n.detail-product{\n    display:flex;\n    justify-content:space-between;\n    gap:8px;\n    border-bottom:1px dashed #ddd;\n    padding:8px 0;\n    font-size:11px;\n}\n\n.detail-total{\n    margin-top:15px;\n    font-size:18px;\n    color:#0878e8;\n    font-weight:900;\n    display:flex;\n    justify-content:space-between;\n}\n\n\n/* =========================================================\n   MODAL\n========================================================= */\n\n.modal{\n    position:fixed;\n    inset:0;\n    background:rgba(3,5,47,.68);\n    display:none;\n    align-items:center;\n    justify-content:center;\n    z-index:5000;\n    padding:15px;\n}\n\n.modal.show{\n    display:flex;\n}\n\n.modal-box{\n    width:min(1050px,96vw);\n    max-height:94vh;\n    background:white;\n    border-radius:12px;\n    overflow:auto;\n}\n\n.modal-header{\n    background:#03052f;\n    color:white;\n    padding:15px 18px;\n    display:flex;\n    justify-content:space-between;\n    align-items:center;\n}\n\n.modal-close{\n    border:none;\n    background:none;\n    color:white;\n    font-size:27px;\n}\n\n.modal-body{\n    padding:18px;\n}\n\n.form-layout{\n    display:grid;\n    grid-template-columns:1fr 1.5fr;\n    gap:20px;\n}\n\n.form-grid{\n    display:grid;\n    grid-template-columns:1fr 1fr;\n    gap:13px;\n}\n\n.group{\n    display:flex;\n    flex-direction:column;\n    gap:6px;\n}\n\n.group.full{\n    grid-column:1/-1;\n}\n\n.group label{\n    font-size:12px;\n    font-weight:bold;\n}\n\n.group input,\n.group select,\n.group textarea{\n    border:1px solid #d4d9df;\n    border-radius:6px;\n    padding:9px;\n}\n\n.group textarea{\n    min-height:72px;\n    resize:vertical;\n}\n\n.product-box{\n    border:1px solid #e2e8f0;\n    border-radius:8px;\n    padding:12px;\n}\n\n.product-row{\n    display:grid;\n    grid-template-columns:1.5fr .6fr .8fr .8fr auto;\n    gap:7px;\n    margin-bottom:8px;\n    align-items:center;\n}\n\n.product-row input{\n    height:38px;\n    border:1px solid #d4d9df;\n    border-radius:5px;\n    padding:0 8px;\n}\n\n.remove-product{\n    width:35px;\n    height:35px;\n    border:none;\n    background:#e72e35;\n    color:white;\n    border-radius:5px;\n}\n\n.order-total{\n    text-align:right;\n    margin-top:15px;\n    font-size:18px;\n    font-weight:bold;\n}\n\n.modal-footer{\n    border-top:1px solid #eee;\n    padding:14px 18px;\n    display:flex;\n    justify-content:flex-end;\n    gap:10px;\n}\n\n\n/* =========================================================\n   RESPONSIVE\n========================================================= */\n\n@media(max-width:1150px){\n\n    .kpis{\n        grid-template-columns:repeat(3,1fr);\n    }\n\n    .actions{\n        grid-template-columns:repeat(3,1fr);\n    }\n\n    .filters{\n        grid-template-columns:repeat(2,1fr);\n    }\n\n    .grid{\n        grid-template-columns:1fr;\n    }\n}\n\n@media(max-width:750px){\n\n    .sidebar{\n        width:72px;\n    }\n\n    .sidebar .logo,\n    .sidebar .admin,\n    .menu span.text{\n        display:none;\n    }\n\n    .menu a{\n        justify-content:center;\n    }\n\n    .main{\n        margin-left:72px;\n    }\n\n    .kpis{\n        grid-template-columns:1fr 1fr;\n    }\n\n    .actions,\n    .filters,\n    .form-layout,\n    .form-grid{\n        grid-template-columns:1fr;\n    }\n\n    .product-row{\n        grid-template-columns:1fr;\n    }\n}\n\n</style>\n</head>\n<body>\n<!-- =========================================================\n     SIDEBAR\n========================================================= -->\n<aside class=\"sidebar\">\n<div class=\"logo\">\n<img alt=\"Proactiva Tu Negocio\" src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBAUEBAYFBQUGBgYHCQ4JCQgICRINDQoOFRIWFhUSFBQXGiEcFxgfGRQUHScdHyIjJSUlFhwpLCgkKyEkJST/2wBDAQYGBgkICREJCREkGBQYJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCQkJCT/wgARCAGkAiADASIAAhEBAxEB/8QAHAAAAgIDAQEAAAAAAAAAAAAAAAEFBgIEBwMI/8QAGwEBAAIDAQEAAAAAAAAAAAAAAAEDAgQFBgf/2gAMAwEAAhADEAAAAbUmvnndAaE04kTUACQMxIEDTk00MQMENBMJZIGPGRDEsiSBiGhMAABMEBMgCEMiUMEBIBiAgwJAIQ0DTkAwAmMgcQmAgINBIWSAABqJAJA0hpkSgAGIQAA4CGICZTEMCCGpJpgmoAnJMAGCGhDSQAAJMQAAAAADGJjyDRji0EhMAAYEAGIAQxIMghoRkgBSAABDAgAAAAAhqQBAWSEAAMGAIQA0oaEMEMkk0AAxMYiTeOUskEYgOSGQTAAQ3iwGCBDBDE4NCABI0xACMkDTQhqJGmIYIAAQwIJiAEloJJpgADQAIaakhoGmJhIaykxEYsCDAACRjliDJvcqh9mZj+zrGxBRl91rh5ry16Ylh5zeylMNv0Ojjrx+7lHjrTezCsObhuTtYjNG5DEIHEgEAQNBIQAJgAIBImCYADiEmpkAGJiAkNMAchpyQ1hDAkATDEwTJethrNl9Hz+daM1C1+nYFV0nf+WWvpcSUWvjhpWCm++hjfvDPLXYZGd2NohZuv8Aped4AeW6TBYwAksRAAGJgtCi7l3Rs+dSGzddcKVgxunlUFZNr86tllNlxr2MzY/CE87Mtv02Ft2yklCTXB0MxPSrABDJJiG8cs4aCkMMhs5Tfc08FUdLsZ2qPkZPUphJrGq7EelVzw0vSsNvXs1SUVVUYSYaFkj9zT1PVZGpr47Wsr8LXC4S/pudXtyXx188XCemxGOvZoTmXagHG2wHJaOXpv088juk4dLeqVnm1zao/Peyow1PTYWWHm8sULE0div20983MafOTZrbuOTOTiMIAAACGCyxeRsIg3NOzdbUKT71btbxkHO7pKxm7Zq+OvL7EVQknLxFFK0tiStzrZf5Le1eZ5dPM6eWrqerhlzvbs8Jp7Oe5WPXl2WBa21qam3HeuFseePpjXdIWGlzPoec9Oy1nRNa2jVlI6WjsdbXJTxzos9jxzpya8llHqxpeWE9ZhA6dz19+iq7env1ZgzynSAIAACYAhiBicsmnOKl4lbdU9QbnI+no5TlvxnP9VudO5/een5ytY8Kx3eR3g4OHf5/5h2D6ahK/euffXVLHn92M9d7OzHw39XT3aZOp27Y6k
